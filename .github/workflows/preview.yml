# Branch preview for every pull request.
# Builds a private Preview of the Worker with `wrangler preview`, which uses the
# "previews" block in wrangler.jsonc: the TEST database (paintersmax-db-preview)
# and the TEST photo bucket, never the live ones. Then it posts the link on the PR.
#
# Needs two GitHub secrets (Settings > Secrets and variables > Actions):
#   CLOUDFLARE_API_TOKEN  - a Cloudflare API token (template "Edit Cloudflare Workers")
#   CLOUDFLARE_ACCOUNT_ID - the account id shown on the Cloudflare dashboard
# Until both exist, this job skips itself and does nothing. (Both were added 2026-11-25.)
name: Branch preview

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  preview:
    runs-on: ubuntu-latest
    # Fork PRs never get secrets; only run for branches in this repository.
    if: github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - name: Check secrets are set
        id: gate
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$TOKEN" ] && [ -n "$ACCOUNT" ]; then echo "ok=1" >> "$GITHUB_OUTPUT"; else echo "Cloudflare secrets not set yet, skipping."; fi

      - uses: actions/checkout@v4
        if: steps.gate.outputs.ok == '1'

      - uses: actions/setup-node@v4
        if: steps.gate.outputs.ok == '1'
        with:
          node-version: 22
          cache: npm

      - name: Install
        if: steps.gate.outputs.ok == '1'
        run: npm ci

      - name: Tests
        if: steps.gate.outputs.ok == '1'
        run: npm test && npx tsc --noEmit

      - name: Build the preview
        id: preview
        if: steps.gate.outputs.ok == '1'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -o pipefail
          npx wrangler preview --name "pr-${{ github.event.pull_request.number }}" \
            --message "PR #${{ github.event.pull_request.number }}" 2>&1 | tee preview.log
          # The log has two addresses. "Preview URL" is stable for this pull request and always shows the newest push.
          # "Unique Deployment URL" is frozen to this one push (it is what old links point to). Post the stable one.
          STABLE=$(grep -Eo 'Preview URL: https://[A-Za-z0-9.-]+\.workers\.dev[^ ]*' preview.log | tail -1 | sed 's/^Preview URL: //')
          UNIQUE=$(grep -Eo 'Unique Deployment URL: https://[A-Za-z0-9.-]+\.workers\.dev[^ ]*' preview.log | tail -1 | sed 's/^Unique Deployment URL: //')
          ANY=$(grep -Eo 'https://[A-Za-z0-9.-]+\.workers\.dev[^ ]*' preview.log | tail -1)
          echo "url=${STABLE:-$ANY}" >> "$GITHUB_OUTPUT"
          echo "unique=${UNIQUE:-$ANY}" >> "$GITHUB_OUTPUT"

      - name: Post the link on the pull request
        if: steps.gate.outputs.ok == '1' && steps.preview.outputs.url != ''
        uses: actions/github-script@v7
        with:
          script: |
            const url = '${{ steps.preview.outputs.url }}';
            const unique = '${{ steps.preview.outputs.unique }}';
            const sha = context.payload.pull_request.head.sha.slice(0, 7);
            const when = new Date().toLocaleString('en-US', { timeZone: 'America/Chicago', dateStyle: 'medium', timeStyle: 'short' });
            const marker = '<!-- paintersmax-preview -->';
            const body = `${marker}\n**Preview ready (test database):** ${url}\n\nThis address always shows the newest version of this pull request. Built from commit ${sha} on ${when} (Texas time). If it looks old, hard-refresh the page. Older links from earlier messages stay frozen on their old version, so ignore them.\n\nThis exact build only: ${unique}\n\nSign in there with a test account. Nothing here touches the live site.`;
            const { owner, repo } = context.repo;
            const issue_number = context.payload.pull_request.number;
            const list = await github.rest.issues.listComments({ owner, repo, issue_number });
            const old = list.data.find(c => c.body && c.body.includes(marker));
            if (old) await github.rest.issues.updateComment({ owner, repo, comment_id: old.id, body });
            else await github.rest.issues.createComment({ owner, repo, issue_number, body });
