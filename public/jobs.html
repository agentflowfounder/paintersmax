<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0F1B2D">
<title>PaintersMax Jobs</title><script src="/i18n.js" data-app></script>
<style>
*{box-sizing:border-box}
body{font-family:Inter,system-ui,sans-serif;background:#F7F5F1;color:#0F1B2D;margin:0}
header{background:#0F1B2D;color:#fff;padding:14px 16px;display:flex;justify-content:space-between;align-items:center;gap:8px}
header b{font-family:Newsreader,Georgia,serif;font-size:19px;font-weight:500}
header a{color:#E8A33D;font-size:14px;text-decoration:none;margin-left:12px}
main{max-width:720px;margin:0 auto;padding:16px 16px 60px}
h2{font-family:Newsreader,Georgia,serif;font-weight:500;margin:0 0 8px;font-size:26px}
h3{margin:18px 0 6px;font-size:16px}
.card{background:#fff;border:1px solid rgba(15,27,45,.1);border-radius:10px;padding:16px;margin:0 0 14px}
label{display:block;font-size:14px;font-weight:600;margin:10px 0 4px}
input,select,textarea{width:100%;padding:11px;border:1px solid #cfd5dc;border-radius:8px;font:inherit;background:#fff}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn{padding:12px 16px;border-radius:8px;border:0;font-weight:700;font-size:15px;cursor:pointer;background:#E8A33D;color:#0F1B2D}
.btn.sec{background:#eceae4}.btn[disabled]{opacity:.5}
.btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.job{display:flex;justify-content:space-between;gap:10px;padding:12px 0;border-bottom:1px solid #eee;text-decoration:none;color:inherit}
.job:last-child{border-bottom:0}
.sec h3{margin:22px 0 8px}.sec .ct{font-weight:400;color:#4A5568;font-size:14px}
.sg{font-size:12px;border-radius:99px;padding:3px 10px;white-space:nowrap;background:#e6f4ea;color:#0a7a3d;margin-right:6px}.sg.w{background:#fff3d6;color:#8a5a00}
.chips2 summary{cursor:pointer;font-weight:600;font-size:14px;margin:12px 0 4px}
.cat{margin:8px 0}.cat b{font-size:13px}.cat .chip{margin:4px 4px 0 0}
.mic{display:inline-flex;align-items:center;gap:6px}.mic.on{background:#E8A33D}
.tag{font-size:12px;background:#eceae4;border-radius:99px;padding:3px 10px;white-space:nowrap;align-self:center}
.line{display:grid;grid-template-columns:1fr 70px 60px 90px 30px;gap:6px;margin:6px 0;align-items:center}
.line input{padding:8px}.line button{border:0;background:none;font-size:18px;cursor:pointer;color:#b42318}
.head{font-size:12px;color:#4A5568;font-weight:600}
.tot{text-align:right;font-size:15px;margin-top:10px;line-height:1.7}.tot b{font-size:19px}
small,.muted{color:#4A5568}#msg{font-size:14px;margin:8px 0;min-height:20px}.ok{color:#0a7a3d}.bad{color:#b42318}
.ev{font-size:13px;padding:4px 0;border-bottom:1px solid #f0eee9}
.fab{position:fixed;right:14px;bottom:16px;z-index:30;border-radius:999px;box-shadow:0 4px 14px rgba(0,0,0,.28);padding:13px 20px;font-size:16px}@media print{.fab{display:none}}
.bub{padding:10px 12px;border-radius:10px;margin:8px 0;white-space:pre-wrap;line-height:1.45}.bub.u{background:#eceae4;margin-left:24px}.bub.a{background:#fff8e8;border:1px solid #f0d9a0;margin-right:12px}.chips{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}.chip{border:1px solid #cfd5dc;background:#fff;border-radius:99px;padding:6px 12px;font-size:13px;cursor:pointer}.mini{border:0;background:none;color:#0F1B2D;text-decoration:underline;font-size:12px;cursor:pointer;padding:2px 0}
@media(max-width:520px){.line{grid-template-columns:1fr 60px 50px 80px 26px}}
.fgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px;margin:10px 0}.fi img{width:100%;height:100px;object-fit:cover;border-radius:8px;display:block}</style></head><body>
<header><div><b>PaintersMax</b> Jobs</div><div><a href="/app">Estimating Setup</a><a href="/calendar">Calendar</a><a href="/records">Records</a><a href="/crew">Crew</a><a href="/lessons">Lessons</a><a href="/builders">Builder rates</a><a href="/import">Import customers</a><a href="/materials">Materials</a><a href="/insurance">Insurance</a><a href="/dashboard">Settings and leads</a></div></header>
<main><div id="view">Loading...</div><div id="msg"></div></main>
<script>
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const $=id=>document.getElementById(id);
const TRADES={interior:'Interior painting',exterior:'Exterior painting',commercial:'Commercial',new_construction:'New construction',power_washing:'Power washing',drywall:'Drywall repair',cabinets:'Cabinet painting',decks_fences:'Decks and fences',fencing:'Fence installation',remodeling:'Remodeling',epoxy_floors:'Epoxy floors',industrial:'Industrial'};
const QL={small:'Small rooms',medium:'Medium rooms',large:'Large rooms',custom_min:'Custom rooms',ceiling:'Ceilings',trim:'Rooms with trim',door_each:'Doors',accent_wall:'Accent walls',repairs_hourly:'Repair hours',base_1_story:'1-story house (1 = yes)',base_2_story:'2-story house (1 = yes)',base_3_story:'3-story house (1 = yes)',door:'Doors',shutter:'Shutters',window:'Windows',garage_door:'Garage doors',power_washing:'Power washing (1 = yes)',wood_repair_hourly:'Wood repair hours',color_change:'Extra colors',gate_each:'Gates',removal_per_ft:'Old fence to remove (ft)',stain_per_ft:'Staining or painting (ft)',mobilization:'Mobilization (1 = yes)',lift_daily:'Lift days',hourly:'Labor hours'};
const BASE={sqft_floor:[['sqft','Square feet of floor area']],sqft_wall:[['sqft','Square feet of wall']],per_linear_ft:[['linear_ft','Linear feet']],lump_sum:[['cost','Your cost for the whole job ($)']]};
const STAGE={lead:'Lead',bid:'Estimate',contract:'Contract',scheduled:'Scheduled',in_progress:'In progress',punch:'Punch list',invoiced:'Invoiced',closed:'Closed',lost:'Lost'};
let J=null,lines=[],clauses=[],docs={},inv={},chat=[],chatJob=undefined,sched=[],cost={items:[],markupPct:0},msOpts=[];
function msg(t,ok){const m=$('msg');m.textContent=t||'';m.className=ok?'ok':'bad';}
async function api(path,body){const r=await fetch(path,body?{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(body)}:undefined);if(r.status===401){location.href='/login';throw 0;}const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.error||'Something went wrong.');return j;}


const CHIPS_JOB=['What is left to do on this job?','How much paint will I need?','What should I watch out for?','Write a short message to the customer about the schedule'];
const CHIPS_GEN=['How do I price a ceiling in a small bathroom?','What primer do I use over stains?','How long should I wait between coats?'];
const QCATS=[
 ['Bidding and pricing',['How do I price a ceiling in a small bathroom?','How do I bid a repaint by the square foot?','How much should I charge to paint kitchen cabinets?','What markup should I add for overhead and profit?']],
 ['Prep, stains and repairs',['What primer do I use over water stains on a ceiling?','How do I remove mildew before painting?','How do I cover smoke or nicotine stains?','How do I fix peeling paint on an exterior wall?']],
 ['Coatings and finishes',['When should I use oil-based instead of water-based paint?','What is the difference between epoxy, lacquer and varnish?','How long should I wait between coats?','Which sheen should I use in kitchens, baths and trim?']],
 ['Spraying and equipment',['How do I clean an airless sprayer?','Why does my sprayer spit or leave tails?','What tip size should I use for latex on walls?','How do I store a sprayer for the winter?']],
 ['Safety',['What do I do about lead paint in a home built before 1978?','What respirator do I need for spraying oil-based paint?','How do I stay safe on ladders and scaffolds?','How do I handle and dispose of leftover paint and rags?']],
 ['Customers and business',['Write a short message asking a customer to approve my estimate','How do I handle a change order in the middle of a job?','How do I ask for a deposit politely?','How do I answer a customer who says my price is too high?']]];
function assistantCard(jobId){
 if(chatJob!==jobId||chat===null){chat=[];}chatJob=jobId;
 const es=(localStorage.getItem('as_lang')||window.PM_LANG)==='es';
 return `<h3>Job assistant</h3><div class="card">
 <div style="display:flex;justify-content:space-between;gap:10px;align-items:end;flex-wrap:wrap"><label for="as_in" style="margin:0">${jobId?'Ask about this job, or any painting question':'Ask any painting or business question'}</label>
 <select id="as_lang" style="width:auto;padding:6px 8px" aria-label="Language"><option value="en" ${es?'':'selected'}>English</option><option value="es" ${es?'selected':''}>Español</option></select></div>
 <textarea id="as_in" rows="3" placeholder="Example: What primer should I use over water stains on a ceiling? Type your question, or tap the Mic button and speak it. Ask about bidding, safety, stains, coatings or equipment."></textarea>
 <div class="btns"><button class="btn" id="as_send">Quick answer</button>${jobId?'<button class="btn sec" id="as_detail" title="More explanation and options">Detailed</button><button class="btn sec" id="as_deep" title="A long step-by-step plan for tough problems">Deep step-by-step</button>':''}${jobId?'<label class="btn sec" style="cursor:pointer;margin:0" title="Take or attach a photo to ask about">Photo<input id="as_cam" type="file" accept="image/*" capture="environment" style="display:none"></label>':''}<button class="btn sec mic" id="as_mic" style="display:none" aria-label="Speak your question"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="9" y="2" width="6" height="12" rx="3"/><path d="M5 11a7 7 0 0014 0M12 18v4"/></svg>Mic</button></div>
 <div id="as_att" class="muted"></div>
 <div id="as_log"></div>
 ${jobId?`<div class="chips">${CHIPS_JOB.map(c=>`<button class="chip" data-chip="${esc(c)}">${esc(c)}</button>`).join('')}</div>`:''}
 <details class="chips2"><summary>Browse common questions by topic</summary>${QCATS.map(([t,qs])=>`<div class="cat"><b>${esc(t)}</b><div>${qs.map(q=>`<button class="chip" data-chip="${esc(q)}">${esc(q)}</button>`).join('')}</div></div>`).join('')}</details>
 <small class="muted">${jobId?'<b>Only you can see this chat.</b> It is saved on this job. ':''}Answers are suggestions: check numbers and safety rules before you rely on them. ${jobId?'Detailed step-by-step answers use your monthly detailed answers. On a job, the assistant sees the estimate, documents and notes, but never the customer email, phone or street address. ':''}Each question uses one of your monthly assistant questions.</small></div>`;}
function chatDraw(){const l=$('as_log');if(!l)return;l.innerHTML=(chatJob&&chat.length?'<div style="text-align:right"><button class="mini" data-aclear="1">Clear this chat</button></div>':'')+chat.map((m,i)=>`<div class="bub ${m.role==='user'?'u':'a'}">${m.fileId?`<img src="/api/files?id=${m.fileId}" alt="" style="max-width:120px;max-height:90px;border-radius:6px;display:block;margin-bottom:6px">`:''}${esc(m.content)}${m.role==='assistant'&&m.mode!=='quick'?'<br><small class="muted">'+(m.mode==='deep'?'Deep step-by-step':'Detailed')+'</small>':''}${m.role==='assistant'&&chatJob?`<br><button class="mini" data-asave="${i}">Save to job notes</button>`:''}</div>`).join('');l.scrollTop=l.scrollHeight;}
let chatFile=0;
function attDraw(){const a=$('as_att');if(a)a.innerHTML=chatFile?'Photo attached. <button class="mini" data-adetach="1">Remove</button>':'';}
async function askNow(q,mode){const inp=$('as_in'),btn=$('as_send');q=(q||'').trim();if(!q&&chatFile)q='What do you see in this photo? Any possible issues I should check?';if(!q)return;btn.disabled=true;msg('');
 const hist=chat.slice(),fid=chatFile;chat.push({role:'user',content:q,fileId:fid||undefined});chatDraw();inp.value='';chatFile=0;attDraw();
 try{if(chatJob){const r=await api('/api/jobchat',{jobId:chatJob,message:q,mode:mode||'quick',language:($('as_lang')||{value:'en'}).value,fileId:fid||undefined});chat=r.messages;}else{const r=await api('/api/assistant',{jobId:chatJob,message:q,history:hist,language:($('as_lang')||{value:'en'}).value});chat.push({role:'assistant',content:r.reply});}}
 catch(e){if(e){chat.pop();msg(e.message);inp.value=q;chatFile=fid;attDraw();}}
 chatDraw();btn.disabled=false;}
document.addEventListener('click',async e=>{const t=e.target,ds=t.dataset||{};
 if(ds.chip){askNow(ds.chip);}
 else if(t.id==='as_send'){askNow($('as_in').value,'quick');}
 else if(t.id==='as_detail'){askNow($('as_in').value,'detailed');}
 else if(t.id==='as_deep'){askNow($('as_in').value,'deep');}
 else if(ds.aclear){if(!confirm('Clear this job chat? This cannot be undone.'))return;try{await api('/api/jobchat',{jobId:chatJob,action:'clear'});chat=[];chatDraw();}catch(x){if(x)msg(x.message);}}
 else if(ds.lost){const r=$('lost_reason').value;if(!r){msg('Choose why it was lost.');return;}try{await api('/api/joblost',{jobId:J.job.id,action:'lost',reason:r,note:$('lost_note').value});await detail(J.job.id);msg('Marked lost. It stays in your records.',true);}catch(x){if(x)msg(x.message);}}
 else if(ds.reopen){try{await api('/api/joblost',{jobId:J.job.id,action:'reopen'});await detail(J.job.id);msg('Reopened.',true);}catch(x){if(x)msg(x.message);}}
 else if(ds.asave!==undefined&&ds.asave!==''){try{await api('/api/jobnote',{jobId:chatJob,text:'Assistant note: '+chat[+ds.asave].content});t.textContent='Saved';t.disabled=true;}catch(x){if(x)msg(x.message);}}
 else if(t.closest&&t.closest('#as_mic')){const R=window.SpeechRecognition||window.webkitSpeechRecognition;if(!R)return;const b=$('as_mic');const r=new R();r.lang=($('as_lang')||{value:'en'}).value==='es'?'es-US':'en-US';b.classList.add('on');r.onresult=ev=>{$('as_in').value=(($('as_in').value?$('as_in').value+' ':'')+ev.results[0][0].transcript).trim();};r.onend=r.onerror=()=>b.classList.remove('on');r.start();}
});
document.addEventListener('change',e=>{if(e.target.id==='as_lang'){try{localStorage.setItem('as_lang',e.target.value);}catch(x){}}});
document.addEventListener('change',async e=>{if(e.target.id!=='as_cam'||!e.target.files[0])return;const f=e.target.files[0];e.target.value='';try{msg('Adding photo...',true);const b=await shrinkImg(f),fd=new FormData();fd.append('file',b);fd.append('jobId',chatJob);fd.append('kind','photo');const r=await fetch('/api/files',{method:'POST',body:fd});if(r.status===401){location.href='/login';return;}const j=await r.json().catch(()=>({}));if(!r.ok){msg(j.error||'Could not add the photo.');return;}chatFile=j.id;attDraw();msg('');if(typeof filesLoad==='function')filesLoad();$('as_in').focus();}catch(x){msg('Could not add the photo.');}});
document.addEventListener('click',e=>{const d=e.target.dataset||{};if(d.adetach){chatFile=0;attDraw();}else if(e.target.id==='ask_fab'||(e.target.closest&&e.target.closest('#ask_fab'))){const i=$('as_in');if(i){i.scrollIntoView({behavior:'smooth',block:'center'});setTimeout(()=>i.focus(),350);}}});
(function(){const b=document.createElement('button');b.id='ask_fab';b.className='btn fab';b.type='button';b.textContent='Ask';b.setAttribute('aria-label','Ask the assistant');document.body.appendChild(b);})();

// ---- Photos and files ----
let FL=null;
function filesCard(){return `<h3>Photos and files</h3><div class="card" id="fl_card"><div id="fl_meter" class="muted">Loading...</div>
 <div class="btns"><label class="btn" style="cursor:pointer">Take or add photos<input id="fl_in" type="file" accept="image/*" multiple style="display:none"></label>
 <label class="btn sec" style="cursor:pointer">Add receipt or document<input id="fl_doc" type="file" accept="image/*,application/pdf" style="display:none"></label>
 <select id="fl_kind" style="width:auto;padding:6px 8px" aria-label="Type"><option value="receipt">Receipt</option><option value="document">Document</option></select></div>
 <div id="fl_list" class="fgrid"></div><div id="fl_allow"></div><div id="fl_find"></div><small class="muted">Photos are shrunk on your phone before upload to save space. Your customer can also add photos from their portal link. You can download a photo any time.</small></div>`;}
function shrinkImg(f){return new Promise(res=>{if(!f.type.startsWith('image/')||f.type==='image/gif'){res(f);return;}const im=new Image();im.onload=()=>{const s=Math.min(1,1600/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*s);c.height=Math.round(im.height*s);c.getContext('2d').drawImage(im,0,0,c.width,c.height);c.toBlob(b=>res(b?new File([b],(f.name||'photo').replace(/\.\w+$/,'')+'.jpg',{type:'image/jpeg'}):f),'image/jpeg',0.82);};im.onerror=()=>res(f);im.src=URL.createObjectURL(f);});}
function meterHtml(st){if(!st)return '';const col=st.level==='ok'?'#0a7a3d':st.level==='warn'?'#E8A33D':'#b42318';
 return `<div style="display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap"><b>Storage</b><span>${st.percent}% used</span></div><div style="height:8px;border-radius:5px;background:#eceae4;margin:4px 0 6px"><div style="height:8px;border-radius:5px;width:${st.percent}%;background:${col}"></div></div>${st.message?`<div style="background:#fff8e6;border-left:4px solid #E8A33D;padding:8px 10px;border-radius:6px;margin-top:6px">${esc(st.message)}${st.upgrade?' <a href="/dashboard#billing"><b>See plans</b></a>':''}</div>`:''}`;}
async function filesLoad(){if(!$('fl_card'))return;try{FL=await api('/api/files?jobId='+J.job.id);$('fl_meter').innerHTML=meterHtml(FL.storage);
 if(!FL.enabled)$('fl_meter').innerHTML+='<div class="muted">File storage is not available yet.</div>';
 $('fl_list').innerHTML=FL.files.length?FL.files.map(f=>`<div class="fi">${f.mime.startsWith('image/')?`<a href="/api/files?id=${f.id}" target="_blank"><img src="/api/files?id=${f.id}" alt="${esc(f.name)}" loading="lazy"></a>`:`<a href="/api/files?id=${f.id}" target="_blank">${esc(f.name)}</a>`}<div class="muted" style="font-size:12px">${esc(f.kind)}${f.by==='customer'?' &middot; from customer':''}</div><div>${f.mime.startsWith('image/')&&f.kind==='photo'?`<button class="mini" data-fanalyze="${f.id}">Analyze</button> `:''}<button class="mini" data-fldel="${f.id}">Delete</button></div></div>`).join(''):'<p class="muted">No photos or files yet.</p>';}catch(e){if(e)$('fl_meter').textContent='Could not load files.';}}
async function filesUpload(list,kind){for(const f of list){try{msg('Uploading '+(f.name||'file')+'...',true);const b=await shrinkImg(f),fd=new FormData();fd.append('file',b);fd.append('jobId',J.job.id);fd.append('kind',kind);const r=await fetch('/api/files',{method:'POST',body:fd});if(r.status===401){location.href='/login';return;}const j=await r.json().catch(()=>({}));if(!r.ok){msg(j.error||'Could not upload.');break;}}catch(e){msg('Could not upload.');break;}}msg('');await filesLoad();}
document.addEventListener('change',e=>{if(e.target.id==='fl_in'){filesUpload([...e.target.files],'photo');e.target.value='';}else if(e.target.id==='fl_doc'){filesUpload([...e.target.files],$('fl_kind').value);e.target.value='';}});
document.addEventListener('click',async e=>{const d=e.target.dataset||{};if(d.fldel){if(!confirm('Delete this file? This cannot be undone.'))return;try{await api('/api/files',{action:'delete',id:+d.fldel});await filesLoad();}catch(x){if(x)msg(x.message);}}});

// ---- Photo analysis ----
const $m=c=>'$'+Math.round(c/100).toLocaleString('en-US');
function allowHtml(a){if(!a)return '';return `<div class="muted" style="margin-top:6px">${esc(a.message)}${a.upgrade?' <a href="/dashboard#billing"><b>See plans</b></a>':''}</div>`;}
function findHtml(f,mode){const sev={low:'#0a7a3d',medium:'#8a5a00',high:'#b42318'};
 return `<div class="card" style="margin:10px 0" data-find="${f.id}"><b>${mode==='draft'?'Draft analysis (not saved yet)':'Approved findings'}</b>${f.summary?`<p style="margin:6px 0">${esc(f.summary)}</p>`:''}
 ${(f.issues||[]).length?f.issues.map(i=>`<div style="border-top:1px solid #eee;padding:8px 0"><b>${esc(i.title)}</b> <span style="color:${sev[i.severity]};font-size:12px;font-weight:700;text-transform:uppercase">${esc(i.severity)}</span>
  <div>${esc(i.what)}</div><div><b>How to fix:</b> ${esc(i.fix)}</div><div class="muted"><b>Labor:</b> about ${esc(i.hours)} hr${i.materials&&i.materials.length?' &middot; <b>Materials:</b> '+i.materials.map(m=>esc(m.item)+' ($'+Math.round(m.costLow)+'-$'+Math.round(m.costHigh)+')').join(', '):''}</div>
  ${i.price?`<div><b>Rough cost to you:</b> ${$m(i.price.costLowCents)} to ${$m(i.price.costHighCents)} &middot; <b>Suggested charge:</b> ${$m(i.price.chargeLowCents)} to ${$m(i.price.chargeHighCents)}</div>`:'<div class="muted">Add your hourly rate in Estimating Setup to see a suggested charge.</div>'}</div>`).join(''):'<p class="muted">No clear issues found in this photo.</p>'}
 <small class="muted">Possible issues to check, not a diagnosis. Prices are rough: check them before you quote.</small>
 ${mode==='draft'?`<div class="btns"><button class="btn" data-fapprove="${f.id}">Approve and save to job</button><button class="btn sec" data-fwo="${f.id}">Approve and make a work order</button><button class="btn sec" data-fdiscard="${f.id}">Discard</button></div>`:`<div class="btns"><button class="btn sec" data-fwo="${f.id}">Make a work order from this</button></div>`}</div>`;}
let FDRAFTS={};
async function findingsLoad(){const box=$('fl_find');if(!box)return;try{const r=await api('/api/photoanalysis?jobId='+J.job.id);$('fl_allow').innerHTML=allowHtml(r.allowance);box.innerHTML=r.findings.filter(f=>f.status==='approved').map(f=>findHtml(f,'saved')).join('');}catch(e){}}
document.addEventListener('click',async e=>{const d=e.target.dataset||{};
 if(d.fanalyze){const btn=e.target;btn.disabled=true;btn.textContent='Analyzing...';try{const r=await api('/api/photoanalysis',{action:'analyze',fileId:+d.fanalyze,language:window.PM_LANG==='es'?'es':'en'});FDRAFTS[r.id]=r;$('fl_find').insertAdjacentHTML('afterbegin',findHtml(r,'draft'));$('fl_allow').innerHTML=allowHtml(r.allowance);}catch(x){if(x)msg(x.message);}btn.disabled=false;btn.textContent='Analyze';}
 else if(d.fapprove||d.fwo){const id=+(d.fapprove||d.fwo);try{const r=await api('/api/photoanalysis',{action:'approve',id});msg(r.allowance.message,true);const dr=FDRAFTS[id];if(d.fwo&&typeof woFromFinding==='function'){woFromFinding(dr||{id,issues:[]});}await findingsLoad();document.querySelectorAll('[data-find="'+id+'"]').forEach(x=>{if(x.querySelector('[data-fapprove]'))x.remove();});}catch(x){if(x)msg(x.message);}}

 f.scrollIntoView({behavior:'smooth',block:'nearest'});}

});

function qtyFields(rc){
  if(!rc)return[];
  const out=[...(BASE[rc.method]||[])];
  for(const k of Object.keys(rc.data||{})){const L=(rc.labels&&rc.labels[k])?rc.labels[k].label+' ('+rc.labels[k].unit+')':QL[k];if(k.endsWith('_pct')||!L)continue;if(typeof rc.data[k]==='number'&&rc.data[k]>0)out.push([k,L]);}
  return out;
}
function totals(){
  const sub=lines.reduce((s,l)=>s+Math.round((+l.qty||0)*(+l.unitPrice||0)*100),0);
  const disc=Math.min(Math.round((+$('discount').value||0)*100),sub);
  const tax=Math.round((sub-disc)*(+$('tax').value||0)/100);
  return{sub,disc,tax,total:sub-disc+tax};
}
const $$=c=>'$'+(c/100).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
function drawLines(){
  $('lines').innerHTML=lines.length?`<div class="line head"><span>Description</span><span>Qty</span><span>Unit</span><span>Price ($)</span><span></span></div>`+lines.map((l,i)=>`<div class="line"><input data-i="${i}" data-f="description" value="${esc(l.description)}"><input data-i="${i}" data-f="qty" inputmode="decimal" value="${esc(l.qty)}"><input data-i="${i}" data-f="unit" value="${esc(l.unit)}"><input data-i="${i}" data-f="unitPrice" inputmode="decimal" value="${esc(l.unitPrice)}"><button data-del="${i}" title="Remove">&times;</button></div>`).join(''):'<p class="muted">No lines yet. Fill them from your prices above, or add a line by hand.</p>';
  drawTotals();
}
function drawTotals(){if($('sched'))drawSched();const t=totals();$('tot').innerHTML=`Subtotal ${$$(t.sub)}<br>${t.disc?`Discount -${$$(t.disc)}<br>`:''}${t.tax?`Tax ${$$(t.tax)}<br>`:''}<b>Total ${$$(t.total)}</b><br><small>Your minimum job and deposit are applied when you save.</small>`;}

function schedSum(){return Math.round(sched.reduce((a,m)=>a+(+m.pct||0),0)*100)/100;}
function schedNote(){const s=document.querySelector('#sched small');if(s){s.textContent='Total '+schedSum()+'%'+(schedSum()===100?'':' (must be 100%)');s.className=schedSum()===100?'ok':'bad';}}
function drawSched(){const c=$('sched');if(!c)return;const t=totals().total;
 c.innerHTML=sched.map((m,i)=>`<div class="line" style="grid-template-columns:1fr 70px 90px 30px"><input data-sf="label" data-si="${i}" value="${esc(m.label)}"><input data-sf="pct" data-si="${i}" inputmode="decimal" value="${esc(m.pct)}"><span class="muted">${$$(Math.round(t*(+m.pct||0)/100))}</span><button data-sdel="${i}">&times;</button></div>`).join('')+
 `<div class="btns"><button class="btn sec" data-sadd="1">+ Add a milestone</button></div>`+(sched.length?`<small class="${schedSum()===100?'ok':'bad'}">Total ${schedSum()}%${schedSum()===100?'':' (must be 100%)'}</small>`:'');}
function costTotal(){const base=cost.items.reduce((a,c)=>a+(+c.amount||0),0);return{base,total:Math.round(base*(1+(+cost.markupPct||0)/100)*100)/100};}
function costOut(){const o=$('c_out');const x=costTotal();if(o)o.innerHTML='Costs '+$$(Math.round(x.base*100))+'<br><b>Price '+$$(Math.round(x.total*100))+'</b>';}
function drawCost(){const c=$('cost');if(!c)return;
 c.innerHTML=cost.items.map((x,i)=>`<div class="line" style="grid-template-columns:1fr 110px 30px"><input data-cf2="label" data-ci2="${i}" value="${esc(x.label)}" placeholder="Example: Wood fence materials"><input data-cf2="amount" data-ci2="${i}" inputmode="decimal" value="${esc(x.amount||'')}" placeholder="$"><button data-cdel="${i}">&times;</button></div>`).join('')+
 `<div class="btns"><button class="btn sec" data-cadd="1">+ Add a cost</button></div><div class="row"><div><label>Markup for overhead, contingency and profit (%)</label><input id="c_mk" inputmode="decimal" value="${esc(cost.markupPct||'')}"></div><div class="tot" style="align-self:end" id="c_out"></div></div>
 <div class="btns"><button class="btn sec" data-cuse="1">Use as project total line</button></div>`;costOut();}

 if(ds.sf){sched[+ds.si][ds.sf]=t.value;schedNote();}
 else if(ds.cf2){cost.items[+ds.ci2][ds.cf2]=t.value;costOut();}
 else if(t.id==='c_mk'){cost.markupPct=t.value;costOut();}
 else if(t.id==='discount'||t.id==='tax')drawSched();});
document.addEventListener('click',e=>{const t=e.target,ds=t.dataset||{};
 if(ds.pre){if(ds.pre==='clear')sched=[];else{const names=['Deposit at signing','Posts set and rails installed','Work substantially complete','Final payment after punch list'];const p=ds.pre.split(',').map(Number);sched=p.map((v,i)=>({label:p.length===2?(i?'Final payment on completion':'Deposit at signing'):names[i],pct:v}));}drawSched();}
 else if(ds.sadd){sched.push({label:'',pct:0});drawSched();}
 else if(ds.sdel!==undefined&&ds.sdel!==''){sched.splice(+ds.sdel,1);drawSched();}
 else if(ds.cadd){cost.items.push({label:'',amount:0});drawCost();}
 else if(ds.cdel!==undefined&&ds.cdel!==''){cost.items.splice(+ds.cdel,1);drawCost();}
 else if(ds.cuse){const x=costTotal();if(x.total<=0){msg('Add your costs first.');return;}lines=lines.filter(l=>l.description!=='Project total');lines.push({description:'Project total',qty:1,unit:'lump sum',unitPrice:x.total});drawLines();msg('Added a Project total line.',true);}

];
function wDraw(k){const c=$('wl_'+k);if(!c)return;const d=docs[k];const m=DOCS.find(x=>x.k===k);
 c.innerHTML=d?`<label>Intro</label><textarea data-dk="${k}" data-df="intro" rows="2">${esc(d.intro||'')}</textarea>`+d.items.map((it,i)=>`<div class="line" style="grid-template-columns:${m.cols?'1fr 56px 56px 80px 1fr':'1fr 150px'} 30px;"><input data-dk="${k}" data-di="${i}" data-df="text" value="${esc(it.text)}">${m.cols?`<input data-dk="${k}" data-di="${i}" data-df="qty" inputmode="decimal" value="${it.qty||''}" placeholder="Qty"><input data-dk="${k}" data-di="${i}" data-df="unit" value="${esc(it.unit)}" placeholder="Unit"><select data-dk="${k}" data-di="${i}" data-df="group">${[['material','Buy'],['rental','Rent'],['tool','Tools'],['safety','Safety']].map(([v,l])=>`<option value="${v}" ${(it.group||'material')===v?'selected':''}>${l}</option>`).join('')}</select>`:''}<input data-dk="${k}" data-di="${i}" data-df="detail" value="${esc(it.detail)}" placeholder="${k==='schedule'?'Date':'Notes'}"><button data-dkdel="${k}:${i}">&times;</button></div>`).join('')+`<div class="btns"><button class="btn sec" data-dkadd="${k}">+ Add a line</button></div>`:'';
 const b=$('wb_'+k);if(b)b.style.display=d?'flex':'none';}
function docCard(m,d){const x=d.docs[m.k];const lang=docs[m.k]?docs[m.k].language:(m.crew?d.crewLanguage:'en');
 return `<h3>${m.n}. ${m.t}</h3><div class="card"><p class="muted" style="margin-top:0">${m.h}</p>
 <div class="row"><div><label>Language</label><select id="wlang_${m.k}"><option value="en">English</option><option value="es" ${lang==='es'?'selected':''}>Español</option></select></div>
 ${m.start?`<div><label>Start date</label><input id="wstart_${m.k}" type="date"></div>`:''}${m.done?`<div><label>Completion date</label><input id="wdone_${m.k}" placeholder="Example: Nov 21, 2026"></div>`:''}</div>
 <div class="btns"><button class="btn sec" data-dkbuild="${m.k}">${x?'Rebuild (replaces edits)':'Build it'}</button></div>
 <div id="wl_${m.k}"></div>
 <div class="btns" id="wb_${m.k}" style="display:none"><button class="btn" data-dksave="${m.k}">Save</button><button class="btn sec" data-dkview="${m.k}" ${x?'':'disabled'}>View / print</button>${m.cust?`<button class="btn sec" data-dksend="${m.k}" ${x&&d.job.customerEmail?'':'disabled'}>Email to customer</button>`:''}</div>
 <small>${x?'Status: '+esc(x.status):'Not saved yet'}</small></div>`;}
function invCard(d){const x=d.docs.invoice;
 return `<h3>8. Invoice</h3><div class="card">${d.estimate?`<p class="muted" style="margin-top:0">Uses the price from your saved estimate. Enter what the customer already paid, such as the deposit.</p>
 <div class="btns" style="margin-top:0"><button class="btn sec" data-ivbuild="1">${x?'Rebuild (replaces edits)':'Job complete: build invoice'}</button></div>
 <div id="iv_chk"></div><div id="ivf" style="display:none"><div class="row"><div><label>Invoice number</label><input id="iv_num"></div><div><label>Due</label><input id="iv_due" placeholder="Example: on completion, or Dec 1"></div></div>
 <div id="iv_ms"></div><div class="row"><div><label>Already paid ($)</label><input id="iv_paid" inputmode="decimal"></div><div><label>Language</label><select id="iv_lang"><option value="en">English</option><option value="es">Español</option></select></div></div>
 <label>Notes (how to pay, thank you)</label><textarea id="iv_notes" rows="3"></textarea><div class="btns" style="margin-top:6px"><button class="btn sec" data-ivnote="1">Write a thank-you note</button></div><small class="muted">The note never includes amounts. You can edit it before you save.</small>
 <label style="display:flex;gap:8px;align-items:flex-start;margin-top:10px"><input type="checkbox" id="iv_rem" style="width:auto;margin-top:3px"><span>Email the customer a friendly reminder if this is still unpaid after 7 and 14 days<br><small class="muted">The reminder names the invoice but never states an amount. It stops when you mark the invoice paid.</small></span></label><div class="btns"><button class="btn" data-ivsave="1">Save</button><button class="btn sec" data-ivview="1" ${x?'':'disabled'}>View / print</button><button class="btn sec" data-ivsend="1" ${x&&d.job.customerEmail?'':'disabled'}>Email to customer</button><button class="btn sec" data-ivpaid="1" ${x?'':'disabled'}>Mark as paid</button></div></div>
 <small>${x?'Status: '+esc(x.status):'Not saved yet'}</small>`:'<p class="muted">Save the estimate first. The invoice uses its price.</p>'}</div>`;}
function ivMs(){const w=$('iv_ms');if(!w)return;w.innerHTML=msOpts.length?`<label>Which payment is this invoice for?</label><select id="iv_msel"><option value="">The whole job</option>${msOpts.map((m,i)=>`<option value="${i}" ${inv.milestone===i?'selected':''}>${i+1}. ${esc(m.label)} (${m.pct}%, ${$$(m.amountCents)})</option>`).join('')}</select>`:'';}
function ivFill(){const f=$('ivf');if(!f)return;f.style.display='block';ivMs();$('iv_num').value=inv.number||'';$('iv_due').value=inv.dueDate||'';$('iv_paid').value=inv.paid||'';$('iv_notes').value=inv.notes||'';$('iv_lang').value=inv.language||'en';const rc=$('iv_rem');if(rc)rc.checked=!!inv.reminders;}
function ivRead(){const ms=$('iv_msel');return{milestone:ms&&ms.value!==''?Number(ms.value):null,number:$('iv_num').value,dueDate:$('iv_due').value,paid:$('iv_paid').value,notes:$('iv_notes').value,language:$('iv_lang').value,reminders:!!($('iv_rem')||{}).checked};}
function drawMore(d){
 docs={};for(const m of DOCS){if(d.docs[m.k]&&d.docs[m.k].doc)docs[m.k]=JSON.parse(JSON.stringify(d.docs[m.k].doc));}
 inv=d.docs.invoice&&d.docs.invoice.invoice?{...d.docs.invoice.invoice,paid:(d.docs.invoice.invoice.paidCents||0)/100}:{};
 $('more').innerHTML=DOCS.slice(0,4).map(m=>docCard(m,d)).join('')+invCard(d)+docCard(DOCS[4],d);
 DOCS.forEach(m=>wDraw(m.k));msOpts=((d.estimate&&d.estimate.estimate&&d.estimate.estimate.schedule)||[]).map((m,i,a)=>({label:m.label,pct:m.pct,amountCents:Math.round(((d.estimate.totals||{}).totalCents||0)*m.pct/100)}));if(d.docs.invoice&&d.docs.invoice.invoice)ivFill();
}
async function jd(body){try{msg('');return await api('/api/jobdoc',{jobId:J.job.id,...body});}catch(x){if(x)msg(x.message);}}
document.addEventListener('click',async e=>{const t=e.target,ds=t.dataset||{};if(!J)return;
 const rel=()=>detail(J.job.id);
 if(ds.dkbuild){const k=ds.dkbuild;if(docs[k]&&!confirm('This replaces what is on screen with a fresh draft. Continue?'))return;const r=await jd({action:'draft',kind:k,language:$('wlang_'+k).value,startDate:($('wstart_'+k)||{}).value,completionDate:($('wdone_'+k)||{}).value});if(r){docs[k]=r.doc;wDraw(k);msg('Built. Edit anything you like.',true);}}
 else if(ds.dksave){const k=ds.dksave;docs[k].language=$('wlang_'+k).value;const r=await jd({action:'save',kind:k,doc:docs[k]});if(r)rel().then(()=>msg('Saved.',true));}
 else if(ds.dksend){const k=ds.dksend;if(!confirm('Email this to '+J.job.customerEmail+'?'))return;docs[k].language=$('wlang_'+k).value;const r=await jd({action:'send',kind:k,doc:docs[k]});if(r)rel().then(()=>msg('Emailed.',true));}
 else if(ds.dkview){const x=J.docs[ds.dkview];if(x)window.open('/api/doc?id='+x.id,'_blank');}
 else if(ds.dkadd){const k=ds.dkadd;docs[k].items.push({text:'',detail:'',qty:0,unit:''});wDraw(k);}
 else if(ds.dkdel){const[k,i]=ds.dkdel.split(':');docs[k].items.splice(+i,1);wDraw(k);}
 else if(ds.ivbuild){if(inv.number&&!confirm('This replaces the invoice on screen. Continue?'))return;const r=await jd({action:'draft',kind:'invoice',language:'en'});if(r){inv=r.invoice;msOpts=r.milestones||[];ivFill();const c=$('iv_chk'),T=window.pmT||function(q){return q};if(c)c.innerHTML=(r.checks&&r.checks.length)?'<div style="background:#fff7e6;border:1px solid #E8A33D;border-radius:8px;padding:10px 12px;margin:10px 0"><b>'+T('Check before you send')+'</b><ul style="margin:6px 0 0;padding-left:18px">'+r.checks.map(x=>'<li>'+esc(T(x))+'</li>').join('')+'</ul></div>':'<p class="muted">'+T('No problems found. Review the amounts, then save and send.')+'</p>';}}
 else if(ds.ivnote){const r=await jd({action:'note',kind:'invoice',language:($('iv_lang')||{}).value||'en'});if(r&&r.note){const n=$('iv_notes');n.value=(n.value?n.value+'\n\n':'')+r.note;msg('Note added. Review it, then save.',true);}}
 else if(ds.ivsave){const r=await jd({action:'save',kind:'invoice',invoice:ivRead()});if(r)rel().then(()=>msg('Invoice saved.',true));}
 else if(ds.ivsend){if(!confirm('Email this invoice to '+J.job.customerEmail+'?'))return;const r=await jd({action:'send',kind:'invoice',invoice:ivRead()});if(r)rel().then(()=>msg('Invoice emailed.',true));}
 else if(ds.ivview){const x=J.docs.invoice;if(x)window.open('/api/doc?id='+x.id,'_blank');}
 else if(ds.ivpaid){if(!confirm('Mark this invoice as paid? The job will close.'))return;const r=await jd({action:'paid',kind:'invoice'});if(r)rel().then(()=>msg('Paid. Job closed.',true));}
});
document.addEventListener('change',e=>{if(e.target.id==='iv_msel'){const v=e.target.value;let paid=0;if(v!=='')for(let i=0;i<+v;i++)paid+=msOpts[i].amountCents;$('iv_paid').value=v!==''?(paid/100||''):'';}});
document.addEventListener('click',async e=>{const t=e.target,ds=t.dataset||{};if(!J)return;
 if(ds.claimopen){const b=$('claimbox');b.style.display=b.style.display==='none'?'block':'none';if(b.style.display==='block'&&!$('cl_date').value)$('cl_date').value=new Date().toISOString().slice(0,10);}
 else if(ds.ptshow||ds.ptmail||ds.ptnew){try{msg('');if(ds.ptnew&&!confirm('The old link will stop working. Continue?'))return;const r=await api('/api/portal',{jobId:J.job.id,action:ds.ptmail?'email':ds.ptnew?'reset':'show',language:'en'});ptShow(r.link);if(r.emailed)msg('Link emailed to the customer.',true);}catch(x){if(x)msg(x.message);}}
 else if(ds.inssend){try{msg('');t.disabled=true;await api('/api/insurance',{action:'email_customer',jobId:J.job.id,language:$('ins_lang').value});msg('Proof of insurance emailed to the customer.',true);}catch(x){if(x)msg(x.message);}t.disabled=false;}
 else if(ds.claimbuild){try{msg('');const what=$('cl_what').value.trim();if(!what){msg('Describe what happened first.');return;}
  let s={};try{const r=await api('/api/insurance');s=(r.policy&&r.policy.summary)||{};}catch(_){}
  const j=J.job,date=$('cl_date').value||new Date().toISOString().slice(0,10);
  const lines=['INCIDENT AND CLAIM INFORMATION SHEET','Prepared: '+new Date().toISOString().slice(0,10),'',
   'Contractor / insured: '+(s.insured||'(your business name)'),'Insurance carrier: '+(s.carrier||'(not on file)'),'Policy number (last 4): '+(s.policyNumberLast4||'(see your policy)'),'Policy period: '+[s.effective,s.expires].filter(Boolean).join(' to '),'',
   'Job: '+j.title,'Customer: '+j.customerName+(j.customerPhone?', '+j.customerPhone:'')+(j.customerEmail?', '+j.customerEmail:''),'Job address: '+([j.address,j.city,j.zip].filter(Boolean).join(', ')||'(not on file)'),'',
   'Date of incident: '+date,'Anyone hurt: '+$('cl_hurt').value,'','What happened:',what,'','Damage to the customer property:',$('cl_dmg').value.trim()||'(none reported)','','Others involved or witnesses:',$('cl_wit').value.trim()||'(none listed)','',
   'Photos and video taken: (yes or no)','Date I told my agent or carrier: (fill in)'];
  const sheet=lines.join('\n');
  await api('/api/jobnote',{jobId:j.id,text:'Incident report ('+date+'): '+what.slice(0,400)+(($('cl_hurt').value==='Yes')?' Someone was hurt.':'')});
  $('claimsheet').value=sheet;$('claimout').style.display='block';msg('Saved to the job history. Your claim sheet is ready below. Call or email your insurance agent now.',true);}catch(x){if(x)msg(x.message);}}
 else if(ds.claimcopy){try{await navigator.clipboard.writeText($('claimsheet').value);msg('Copied.',true);}catch(_){$('claimsheet').select();msg('Press Ctrl+C or Command+C to copy.');}}
});
document.addEventListener('input',e=>{const t=e.target,ds=t.dataset||{};if(ds.dk&&ds.df){const d=docs[ds.dk];if(!d)return;if(ds.di!==undefined)d.items[+ds.di][ds.df]=ds.df==='qty'?(Number(t.value)||0):t.value;else d[ds.df]=t.value;}});
document.addEventListener('input',e=>{const t=e.target;if(t.dataset&&t.dataset.ci!==undefined){clauses[+t.dataset.ci][t.dataset.cf]=t.value;return;}if(t.dataset&&t.dataset.f!==undefined){lines[+t.dataset.i][t.dataset.f]=t.value;drawTotals();}else if(t.id==='discount'||t.id==='tax')drawTotals();});
document.addEventListener('click',e=>{const d=e.target.dataset&&e.target.dataset.del;if(d!==undefined&&d!==''){lines.splice(+d,1);drawLines();}});
(async()=>{try{const id=new URLSearchParams(location.search).get('id');id?await detail(id):await list();}catch(e){if(e)$('view').innerHTML='<p class="bad">'+esc(e.message||'Could not load.')+'</p>';}})();
</script></body></html>
