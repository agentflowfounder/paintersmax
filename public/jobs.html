 if(chatJob!==jobId||chat===null){chat=[];}chatJob=jobId;

 <small class="muted">${jobId?'<b>Only you can see this chat.</b> It is saved on this job. ':''}Answers are suggestions: check numbers and safety rules before you rely on them. ${jobId?'Quote helper answers use your monthly Quote helper allowance (it builds its own price, so it is a good second opinion on your estimate). Detailed step-by-step answers use your monthly detailed answers. On a job, the assistant sees the estimate, documents and notes, but never the customer email, phone or street address. ':''}Each question uses one of your monthly assistant questions.</small></div>`;}
function chatDraw(){const l=$('as_log');if(!l)return;l.innerHTML=(chatJob&&chat.length?'<div style="text-align:right"><button class="mini" data-aclear="1">Clear this chat</button></div>':'')+chat.map((m,i)=>`<div class="bub ${m.role==='user'?'u':'a'}">${m.fileId?`<img src="/api/files?id=${m.fileId}" alt="" style="max-width:120px;max-height:90px;border-radius:6px;display:block;margin-bottom:6px">`:''}${esc(m.content)}${m.role==='assistant'&&m.mode!=='quick'?'<br><small class="muted">'+(m.mode==='deep'?'Deep step-by-step':m.mode==='quote'?'Quote helper':'Detailed')+'</small>':''}${m.role==='assistant'&&chatJob?`<br><button class="mini" data-asave="${i}">Save to job notes</button>`:''}${m.role==='assistant'&&m.ai?(m.rated?'<br><small class="muted">Thanks for the feedback.</small>':m.askWhy?'<br><small class="muted">What was wrong?</small> '+[['wrong','Not correct'],['unclear','Unclear'],['too_long','Too long'],['too_short','Too short'],['other','Other']].map(x=>`<button class="mini" data-arate="${i}" data-why="${x[0]}">${x[1]}</button>`).join(' '):`<br><button class="mini" data-arate="${i}" data-r="up" aria-label="Good answer">&#128077;</button> <button class="mini" data-arate="${i}" data-r="down" aria-label="Bad answer">&#128078;</button>`):''}</div>`).join('');l.scrollTop=l.scrollHeight;}
let chatFile=0;
function attDraw(){const a=$('as_att');if(a)a.innerHTML=chatFile?`<div style="display:flex;gap:10px;align-items:center;margin:6px 0"><img src="/api/files?id=${chatFile}" alt="The photo you attached" style="width:72px;height:72px;object-fit:cover;border-radius:8px;border:1px solid #cfd5dc"><span>Photo attached. It goes with your next question.</span><button class="mini" data-adetach="1">Remove</button></div>`:'';}
async function askNow(q,mode){const inp=$('as_in'),btn=$('as_send');q=(q||'').trim();if(!q&&mode==='quote')q=chatFile?'Give me a quote and a step by step plan for the work in this photo.':'Give me a quote and a step by step plan for this job.';if(!q&&chatFile)q='What do you see in this photo? Any possible issues I should check?';if(!q)return;btn.disabled=true;msg('');
 const hist=chat.slice(),fid=chatFile;chat.push({role:'user',content:q,fileId:fid||undefined});chatDraw();inp.value='';chatFile=0;attDraw();
 try{if(chatJob){const r=await api('/api/jobchat',{jobId:chatJob,message:q,mode:mode||'quick',language:($('as_lang')||{value:'en'}).value,fileId:fid||undefined});chat=r.messages;if(r.ai&&chat.length&&chat[chat.length-1].role==='assistant')chat[chat.length-1].ai=r.ai;}else{const r=await api('/api/assistant',{jobId:chatJob,message:q,history:hist,language:($('as_lang')||{value:'en'}).value});chat.push({role:'assistant',content:r.reply});}}
 catch(e){if(e){chat.pop();msg(e.message);inp.value=q;chatFile=fid;attDraw();}}
 chatDraw();btn.disabled=false;}
document.addEventListener('click',async e=>{const t=e.target,ds=t.dataset||{};
 if(ds.chip){askNow(ds.chip);}
 else if(t.id==='as_send'){askNow($('as_in').value,'quick');}
 else if(t.id==='as_detail'){askNow($('as_in').value,'detailed');}
 else if(t.id==='as_deep'){askNow($('as_in').value,'deep');}
 else if(t.id==='as_quote'){askNow($('as_in').value,'quote');}
 else if(ds.aclear){if(!confirm('Clear this job chat? This cannot be undone.'))return;try{await api('/api/jobchat',{jobId:chatJob,action:'clear'});chat=[];chatDraw();}catch(x){if(x)msg(x.message);}}
 else if(ds.lost){const r=$('lost_reason').value;if(!r){msg('Choose why it was lost.');return;}try{await api('/api/joblost',{jobId:J.job.id,action:'lost',reason:r,note:$('lost_note').value});await detail(J.job.id);msg('Marked lost. It stays in your records.',true);}catch(x){if(x)msg(x.message);}}
 else if(ds.reopen){try{await api('/api/joblost',{jobId:J.job.id,action:'reopen'});await detail(J.job.id);msg('Reopened.',true);}catch(x){if(x)msg(x.message);}}
 else if(ds.arate!==undefined&&ds.arate!==''){const m=chat[+ds.arate];if(!m||!m.ai)return;
  if(ds.r==='down'&&!ds.why){m.askWhy=true;chatDraw();return;}
  const rating=ds.r==='up'?'up':'down';m.rated=true;m.askWhy=false;chatDraw();
  try{await api('/api/ai/feedback',{tool:m.ai.tool,model:m.ai.model,rating,reason:ds.why||undefined});}catch(x){} }
 else if(ds.asave!==undefined&&ds.asave!==''){try{await api('/api/jobnote',{jobId:chatJob,text:'Assistant note: '+chat[+ds.asave].content});t.textContent='Saved';t.disabled=true;}catch(x){if(x)msg(x.message);}}
 else if(t.closest&&t.closest('#as_mic')){micToggle($('as_mic'),()=>($('as_lang')||{value:'en'}).value==='es'?'es-US':'en-US',x=>{$('as_in').value=(($('as_in').value?$('as_in').value+' ':'')+x).trim();});}
});
try{localStorage.removeItem('as_lang');}catch(x){}
document.addEventListener('change',async e=>{if(e.target.id!=='as_cam'||!e.target.files[0])return;const f=e.target.files[0];e.target.value='';try{msg('Adding photo...',true);const b=await shrinkImg(f),fd=new FormData();fd.append('file',b);fd.append('jobId',chatJob);fd.append('kind','photo');const r=await fetch('/api/files',{method:'POST',body:fd});if(r.status===401){location.href='/login';return;}const j=await r.json().catch(()=>({}));if(!r.ok){msg(j.error||'Could not add the photo.');return;}chatFile=j.id;attDraw();msg('');if(typeof filesLoad==='function')filesLoad();$('as_in').focus();}catch(x){msg('Could not add the photo.');}});
document.addEventListener('click',e=>{const d=e.target.dataset||{};if(d.adetach){chatFile=0;attDraw();}});

// ---- Photos and files ----
let FL=null;
function filesCard(){return `<label style="margin-top:14px">Photos and files</label><div class="card" id="fl_card"><div id="fl_meter" class="muted">Loading...</div>
 <div class="btns"><label class="btn" style="cursor:pointer">Take or add photos<input id="fl_in" type="file" accept="image/*" multiple style="display:none"></label>
 </div>
 <small class="muted" style="display:block;margin-top:6px">Tap a photo's <b>Analyze</b> button to have the AI look for possible issues. Receipts go in <a href="/records?job=${J.job.id}">Records</a>, where they are read and filed as expenses.</small>
 <div id="fl_list" class="fgrid"></div><div id="fl_allow"></div><div id="fl_find"></div><small class="muted">Photos are shrunk on your phone before upload to save space. Your customer can also add photos from their portal link. You can download a photo any time.</small></div>`;}
function shrinkImg(f){return new Promise(res=>{if(!f.type.startsWith('image/')||f.type==='image/gif'){res(f);return;}const im=new Image();im.onload=()=>{const s=Math.min(1,1600/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*s);c.height=Math.round(im.height*s);c.getContext('2d').drawImage(im,0,0,c.width,c.height);c.toBlob(b=>res(b?new File([b],(f.name||'photo').replace(/\.\w+$/,'')+'.jpg',{type:'image/jpeg'}):f),'image/jpeg',0.82);};im.onerror=()=>res(f);im.src=URL.createObjectURL(f);});}
function meterHtml(st){if(!st)return '';const col=st.level==='ok'?'#0a7a3d':st.level==='warn'?'#E8A33D':'#b42318';
 return `<div style="display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap"><b>Storage</b><span>${st.percent}% used</span></div><div style="height:8px;border-radius:5px;background:#eceae4;margin:4px 0 6px"><div style="height:8px;border-radius:5px;width:${st.percent}%;background:${col}"></div></div>${st.message?`<div style="background:#fff8e6;border-left:4px solid #E8A33D;padding:8px 10px;border-radius:6px;margin-top:6px">${esc(st.message)}${st.upgrade?' <a href="/dashboard#billing"><b>See plans</b></a>':''}</div>`:''}`;}
async function filesLoad(){if(!$('fl_card'))return;try{FL=await api('/api/files?jobId='+J.job.id);$('fl_meter').innerHTML=meterHtml(FL.storage);
 if(!FL.enabled)$('fl_meter').innerHTML+='<div class="muted">File storage is not available yet.</div>';
 $('fl_list').innerHTML=FL.files.length?FL.files.map(f=>f.removed?`<div class="fi"><div class="muted" style="font-size:12px">${esc(f.name)}<br>removed from storage</div></div>`:`<div class="fi">${f.mime.startsWith('image/')?`<a href="/api/files?id=${f.id}" target="_blank"><img src="/api/files?id=${f.id}" alt="${esc(f.name)}" loading="lazy"></a>`:`<a href="/api/files?id=${f.id}" target="_blank">${esc(f.name)}</a>`}<div class="muted" style="font-size:12px">${esc(f.kind)}${f.by==='customer'?' &middot; from customer':''}</div>${f.mime.startsWith('image/')&&f.kind==='photo'?`<div data-fread="${f.id}"></div>`:''}<div>${f.mime.startsWith('image/')&&f.kind==='photo'?`<button class="btn sec" style="padding:6px 10px;font-size:13px" data-fopen="${f.id}">Analyze photo</button> `:''}<button class="mini" data-fldel="${f.id}">Delete</button></div></div>`).join(''):'<p class="muted">No photos or files yet.</p>';markRead();}catch(e){if(e)$('fl_meter').textContent='Could not load files.';}}
async function filesUpload(list,kind){for(const f of list){try{msg('Uploading '+(f.name||'file')+'...',true);const b=await shrinkImg(f),fd=new FormData();fd.append('file',b);fd.append('jobId',J.job.id);fd.append('kind',kind);const r=await fetch('/api/files',{method:'POST',body:fd});if(r.status===401){location.href='/login';return;}const j=await r.json().catch(()=>({}));if(!r.ok){msg(j.error||'Could not upload.');break;}}catch(e){msg('Could not upload.');break;}}msg('');await filesLoad();}
document.addEventListener('change',e=>{if(e.target.id==='fl_in'){filesUpload([...e.target.files],'photo');e.target.value='';}else if(e.target.id==='fl_doc'){filesUpload([...e.target.files],$('fl_kind').value);e.target.value='';}});
document.addEventListener('click',async e=>{const d=e.target.dataset||{};if(d.fldel){if(!confirm('Delete this file? This cannot be undone.'))return;try{await api('/api/files',{action:'delete',id:+d.fldel});await filesLoad();}catch(x){if(x)msg(x.message);}}});

// ---- Photo analysis ----
const $m=c=>'$'+Math.round(c/100).toLocaleString('en-US');
function allowHtml(a){if(!a)return '';return `<div class="muted" style="margin-top:6px">${esc(a.message)}${a.upgrade?' <a href="/dashboard#billing"><b>See plans</b></a>':''}</div>`;}
function findHtml(f,mode){const sev={low:'#0a7a3d',medium:'#8a5a00',high:'#b42318'};
 return `<div class="card" style="margin:10px 0" data-find="${f.id}">${f.fileId?`<img src="/api/files?id=${f.fileId}" alt="" style="float:right;width:64px;height:64px;object-fit:cover;border-radius:8px;margin:0 0 6px 8px">`:''}<b>${mode==='draft'?'Draft analysis (not saved yet)':'Approved findings'}</b>${f.summary?`<p style="margin:6px 0">${esc(f.summary)}</p>`:''}
 ${(f.seen||[]).length?`<div style="margin:6px 0;font-size:14px"><b>What the AI saw in this photo:</b> ${f.seen.map(x=>esc(x.item)+(x.condition?' ('+esc(x.condition)+')':'')).join('; ')}</div>`:''}
 ${(f.issues||[]).length?f.issues.map(i=>`<div style="border-top:1px solid #eee;padding:8px 0"><b>${esc(i.title)}</b> <span style="color:${sev[i.severity]};font-size:12px;font-weight:700;text-transform:uppercase">${esc(i.severity)}</span>
  <div>${esc(i.what)}</div><div><b>How to fix:</b> ${esc(i.fix)}</div><div class="muted"><b>Labor:</b> about ${esc(i.hours)} hr${i.materials&&i.materials.length?' &middot; <b>Materials:</b> '+i.materials.map(m=>esc(m.item)+' ($'+Math.round(m.costLow)+'-$'+Math.round(m.costHigh)+')').join(', '):''}</div>
  ${i.price?`<div><b>Rough cost to you:</b> ${$m(i.price.costLowCents)} to ${$m(i.price.costHighCents)} &middot; <b>Suggested charge:</b> ${$m(i.price.chargeLowCents)} to ${$m(i.price.chargeHighCents)}</div>`:'<div class="muted">Add your hourly rate in Estimating Setup to see a suggested charge.</div>'}</div>`).join(''):'<p class="muted">No clear issues found in this photo.</p>'}
 <small class="muted">Possible issues to check, not a diagnosis. Prices are rough: check them before you quote.</small>
 ${mode==='draft'?`<div class="btns"><button class="btn" data-fapprove="${f.id}">Approve and save to job</button><button class="btn sec" data-fwo="${f.id}">Approve and make a work order</button><button class="btn sec" data-fdiscard="${f.id}">Discard</button></div>`:`<div class="btns"><button class="btn sec" data-fwo="${f.id}">Make a work order from this</button></div>`}</div>`;}
let FDRAFTS={};
let FREAD=new Set();
const FOCUS=['walls','ceiling','trim and baseboards','windows','doors','floors','cabinets','siding and outside','fixtures and outlets'];
function markRead(){document.querySelectorAll('[data-fread]').forEach(el=>{const id=+el.dataset.fread,on=FREAD.has(id);el.innerHTML=on?'<span class="rdchip">&#10003; AI has read this photo</span>':'';const b=document.querySelector('[data-fopen="'+id+'"]');if(b)b.textContent=on?'Analyze again':'Analyze photo';});}
function askPanel(id){return `<div class="card" id="fl_ask" style="margin:10px 0"><b>Before the AI looks</b><img src="/api/files?id=${id}" alt="" style="float:right;width:64px;height:64px;object-fit:cover;border-radius:8px;margin-left:8px">
 <p style="margin:6px 0">What should it look at closely? Tick any that matter. The AI checks the whole photo either way, but this helps it notice windows, doors and trim, not only walls.</p>
 <div>${FOCUS.map(x=>`<label class="fch"><input type="checkbox" data-focus="${x}"> ${x}</label>`).join('')}</div>
 <label for="fl_note">What should I know about this photo? (optional)</label><textarea id="fl_note" rows="2" placeholder="Example: guest bedroom, the window leaked last spring."></textarea>
 <div class="btns"><button class="btn" data-fanalyze="${id}">Analyze this photo</button><button class="btn sec" data-fcancel="1">Cancel</button></div>
 <small class="muted">Tip: photos from different angles (each wall, the windows, the doors, the ceiling) give the best results. Photos that look alike get similar answers.</small></div>`;}
async function findingsLoad(){const box=$('fl_find');if(!box)return;try{const r=await api('/api/photoanalysis?jobId='+J.job.id);$('fl_allow').innerHTML=allowHtml(r.allowance);FREAD=new Set(r.findings.map(f=>f.fileId));box.innerHTML=r.findings.map(f=>{if(f.status!=='approved')FDRAFTS[f.id]=f;return findHtml(f,f.status==='approved'?'saved':'draft');}).join('');markRead();}catch(e){}}
document.addEventListener('click',async e=>{const d=e.target.dataset||{};
 if(d.fopen){const o=$('fl_ask');if(o)o.remove();$('fl_find').insertAdjacentHTML('afterbegin',askPanel(+d.fopen));$('fl_ask').scrollIntoView({behavior:'smooth',block:'center'});}
 else if(d.fcancel){const o=$('fl_ask');if(o)o.remove();}
 else if(d.fanalyze){const ask=$('fl_ask'),focus=ask?[...ask.querySelectorAll('[data-focus]:checked')].map(x=>x.dataset.focus):[],note=ask&&$('fl_note')?$('fl_note').value.trim():'';
  if(ask)ask.remove();
  const old=$('fl_busy');if(old)old.remove();
  $('fl_find').insertAdjacentHTML('afterbegin','<div id="fl_busy" class="note" style="margin:10px 0;background:#fff8e6;border-left:4px solid #E8A33D;padding:8px 10px;border-radius:6px">Looking at your photo. This usually takes 10 to 20 seconds. Please keep this page open.</div>');
  $('fl_busy').scrollIntoView({behavior:'smooth',block:'center'});
  try{const r=await api('/api/photoanalysis',{action:'analyze',fileId:+d.fanalyze,focus,note,language:window.PM_LANG==='es'?'es':'en'});$('fl_busy').remove();FDRAFTS[r.id]=r;FREAD.add(+d.fanalyze);markRead();$('fl_find').insertAdjacentHTML('afterbegin',findHtml(r,'draft'));$('fl_allow').innerHTML=allowHtml(r.allowance);}
  catch(x){if(x){const b=$('fl_busy');if(b){b.style.borderLeftColor='#b42318';b.innerHTML='<b style="color:#b42318">'+esc(x.message)+'</b><div class="muted">Nothing was used from your allowance.'+(x.detail?' Technical note: '+esc(x.detail):'')+'</div>';}if(x.allowance)$('fl_allow').innerHTML=allowHtml(x.allowance);}else{const b=$('fl_busy');if(b)b.remove();}}}
 else if(d.fapprove||d.fwo){const id=+(d.fapprove||d.fwo);try{const r=await api('/api/photoanalysis',{action:'approve',id});msg(r.allowance.message,true);const dr=FDRAFTS[id];if(d.fwo&&typeof woFromFinding==='function'){woFromFinding(dr||{id,issues:[]});}await findingsLoad();document.querySelectorAll('[data-find="'+id+'"]').forEach(x=>{if(x.querySelector('[data-fapprove]'))x.remove();});}catch(x){if(x)msg(x.message);}}
 else if(d.fdiscard){try{await api('/api/photoanalysis',{action:'discard',id:+d.fdiscard});document.querySelectorAll('[data-find="'+d.fdiscard+'"]').forEach(x=>x.remove());}catch(x){if(x)msg(x.message);}}
});

// ---- Work orders and change orders ----
let WOS=[],WOE=null;
function woCard(){return `<div class="card" id="wo_card"><div id="wo_list" class="muted">Loading...</div><div id="wo_form"></div><div class="btns"><button class="btn sec" data-wonew="work_order">New work order</button><button class="btn sec" data-wonew="change_order">New change order</button></div><small class="muted">A change order is for extra work after the estimate was approved. Your customer approves it on a private page, or you can print it. Approved change orders add to the job total.</small></div>`;}
function woMoney(c){return '$'+(c/100).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});}
async function woLoad(){const b=$('wo_list');if(!b)return;try{const r=await api('/api/workorders?jobId='+J.job.id);WOS=r.workOrders;
 b.innerHTML=(WOS.length?WOS.map(w=>`<div style="border-top:1px solid #eee;padding:8px 0"><b>${esc(w.label)}</b> ${esc(w.title)} <span class="tag">${esc(w.status)}</span> &middot; ${woMoney(w.totalCents)}${w.decidedBy?' &middot; '+esc(w.decidedBy):''}
 <div class="btns"><button class="mini" data-woedit="${w.id}">${w.status==='approved'||w.status==='declined'?'View':'Edit'}</button> <a class="mini" href="/api/workorders?id=${w.id}&print=1" target="_blank">Print</a>${w.status==='draft'?` <button class="mini" data-wosend="${w.id}" data-via="email">Email to customer</button> <button class="mini" data-wosend="${w.id}" data-via="link">Get link</button> <button class="mini" data-wodel="${w.id}">Delete</button>`:''}${w.link&&w.status==='sent'?` <button class="mini" data-wocopy="${esc(w.link)}">Copy link</button> <button class="mini" data-wosend="${w.id}" data-via="email">Email again</button>`:''}</div></div>`).join(''):'<p class="muted">None yet.</p>')+(r.approvedCents?`<p><b>Approved change orders: ${woMoney(r.approvedCents)}</b> added to this job.</p>`:'');}catch(e){}}
function woLineRow(l){l=l||{};return `<div class="row wo_l" style="align-items:end"><div style="flex:3"><label>Description</label><input class="wo_d" maxlength="160" value="${esc(l.description||'')}"></div><div><label>Qty</label><input class="wo_q" inputmode="decimal" value="${l.qty!=null?l.qty:1}"></div><div><label>Price each ($)</label><input class="wo_u" inputmode="decimal" value="${l.unitCents!=null?(l.unitCents/100):''}"></div></div>`;}
function woForm(w){WOE=w;const f=$('wo_form');if(!f)return;const locked=w.status==='approved'||w.status==='declined';
 f.innerHTML=`<div class="card" style="background:#fbfaf7"><b>${w.id?esc(w.label||''):'New '+(w.kind==='change_order'?'change order':'work order')}</b>${locked?'<p class="muted">This was already answered, so it is read only.</p>':''}
 <label>Title</label><input id="wo_t" maxlength="120" value="${esc(w.title||'')}" placeholder="Example: Repair and repaint rotted fascia">
 <label>Why is this needed?</label><textarea id="wo_r" rows="2" maxlength="1200">${esc(w.reason||'')}</textarea>
 <label>What will be done</label><textarea id="wo_s" rows="3" maxlength="3000">${esc(w.scope||'')}</textarea>
 <div id="wo_lines">${(w.lines&&w.lines.length?w.lines:[{}]).map(woLineRow).join('')}</div>
 <div class="btns"><button class="mini" data-woaddline="1">+ Add a line</button></div>
 <div class="row"><div><label>Extra days</label><input id="wo_days" inputmode="numeric" value="${w.daysAdded||0}"></div><div><label>Customer language</label><select id="wo_lang"><option value="en"${w.language==='es'?'':' selected'}>English</option><option value="es"${w.language==='es'?' selected':''}>Español</option></select></div></div>
 <div class="btns">${locked?'':'<button class="btn" data-wosave="1">Save</button> '}<button class="btn sec" data-woclose="1">Close</button></div></div>`;
 f.scrollIntoView({behavior:'smooth',block:'nearest'});}
function woRead(){const lines=[...document.querySelectorAll('.wo_l')].map(r=>({description:r.querySelector('.wo_d').value.trim(),qty:Number(r.querySelector('.wo_q').value)||0,unitCents:Math.round((Number(String(r.querySelector('.wo_u').value).replace(/[$,]/g,''))||0)*100)})).filter(l=>l.description&&l.qty>0);
 return {title:$('wo_t').value.trim(),reason:$('wo_r').value.trim(),scope:$('wo_s').value.trim(),lines,daysAdded:Number($('wo_days').value)||0,language:$('wo_lang').value};}
function woFromFinding(dr){const iss=(dr&&dr.issues)||[];if(!$('wo_card')){msg('Saved. Open Work orders to use it.',true);return;}
 const lines=iss.filter(i=>i.price).map(i=>({description:i.title+': '+(i.fix||'').slice(0,100),qty:1,unitCents:Math.round((i.price.chargeLowCents+i.price.chargeHighCents)/2/100)*100}));
 woForm({kind:'work_order',title:iss[0]?iss[0].title:'Repair work',reason:(dr&&dr.summary)||'',scope:iss.map(i=>i.title+': '+(i.fix||'')).join('\n'),lines,daysAdded:0,language:window.PM_LANG==='es'?'es':'en'});
 msg('Work order started from the photo findings. Check the prices, then save.',true);}
document.addEventListener('click',async e=>{const d=e.target.dataset||{};
 if(d.wonew){woForm({kind:d.wonew,language:window.PM_LANG==='es'?'es':'en'});}
 else if(d.woedit){const w=WOS.find(x=>x.id===+d.woedit);if(w)woForm(w);}

function qtyFields(rc){
  if(!rc)return[];
  const out=[...(BASE[rc.method]||[])];
  for(const k of Object.keys(rc.data||{})){const L=(rc.labels&&rc.labels[k])?rc.labels[k].label+' ('+rc.labels[k].unit+')':QL[k];if(k.endsWith('_pct')||!L)continue;if(typeof rc.data[k]==='number'&&rc.data[k]>0)out.push([k,L]);}
  return out;
}
let OPTS=[];
const SECN={paint:'Paint',drywall:'Drywall',trim:'Trim',other:'Other'};
function secOf(l){return l.section&&SECN[l.section]?l.section:'paint';}
function totals(){
  const sub=lines.filter(l=>!OPTS.includes(secOf(l))).reduce((s,l)=>s+Math.round((+l.qty||0)*(+l.unitPrice||0)*100),0);
  const disc=Math.min(Math.round((+$('discount').value||0)*100),sub);
  const tax=Math.round((sub-disc)*(+$('tax').value||0)/100);
  return{sub,disc,tax,total:sub-disc+tax};
}
const $$=c=>'$'+(c/100).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
function drawLines(){
  $('lines').innerHTML=lines.length?lines.map((l,i)=>`<div class="lrow"><input data-i="${i}" data-f="description" value="${esc(l.description)}" placeholder="Description" aria-label="Description"><div class="l2"><input data-i="${i}" data-f="qty" inputmode="decimal" value="${esc(l.qty)}" aria-label="Quantity" placeholder="Qty"><input data-i="${i}" data-f="unit" value="${esc(l.unit)}" aria-label="Unit" placeholder="Unit"><input data-i="${i}" data-f="unitPrice" inputmode="decimal" class="${l.needsPrice&&!(+l.unitPrice>0)?'np':''}" value="${esc(l.unitPrice)}" aria-label="Price in dollars" placeholder="Price $"><select data-i="${i}" data-f="section" aria-label="Section">${Object.entries(SECN).map(([k,v])=>`<option value="${k}" ${secOf(l)===k?'selected':''}>${esc(v)}</option>`).join('')}</select><button data-del="${i}" title="Remove" aria-label="Remove line">&times;</button></div></div>`).join('')+optDraw():'<p class="muted">No lines yet. Build the estimate from your notes, fill the lines from your prices, or add a line by hand.</p>';
  drawTotals();
}
function optDraw(){const used=Object.keys(SECN).filter(k=>lines.some(l=>secOf(l)===k));if(used.length<2&&!OPTS.length)return '<small class="muted" style="display:block;margin-top:6px">Use the section box on each line to split the estimate into drywall, painting and trim. Each section can then be made optional.</small>';
 return `<div style="margin-top:10px"><b style="font-size:14px">Optional sections</b><small class="muted" style="display:block">Ticked sections print with their own price as an add-on the customer can choose, and are not counted in the total.</small>${used.map(k=>`<label class="optck"><input type="checkbox" data-optsec="${k}" ${OPTS.includes(k)?'checked':''}> ${esc(SECN[k])}</label>`).join('')}</div>`;}
document.addEventListener('change',e=>{const t=e.target;if(t.dataset&&t.dataset.optsec){OPTS=t.checked?OPTS.concat([t.dataset.optsec]):OPTS.filter(x=>x!==t.dataset.optsec);drawTotals();}else if(t.dataset&&t.dataset.f==='section'){lines[+t.dataset.i].section=t.value;drawLines();}});
function drawTotals(){if($('sched'))drawSched();const t=totals();const ot=OPTS.map(k=>[k,lines.filter(l=>secOf(l)===k).reduce((s,l)=>s+Math.round((+l.qty||0)*(+l.unitPrice||0)*100),0)]).filter(x=>x[1]>0);$('tot').innerHTML=`${ot.map(([k,c])=>`<small class="muted">Optional: ${esc(SECN[k])} ${$$(c)}</small><br>`).join('')}Subtotal ${$$(t.sub)}<br>${t.disc?`Discount -${$$(t.disc)}<br>`:''}${t.tax?`Tax ${$$(t.tax)}<br>`:''}<b>Total ${$$(t.total)}</b><br><small>Your minimum job and deposit are applied when you save.</small>`;}
function readEstimate(){const L=id=>($(id)||{value:''}).value;return{optionalSections:OPTS,revisionLabel:L('e_rev'),includeTerms:!!($('e_terms')||{}).checked,colors:(J&&J.colors)||[],inclusions:L('e_incl'),exclusions:L('e_excl'),assumptions:L('e_assume'),allowances:L('e_allow'),options:L('e_opts'),schedule:sched,costBuild:cost,lines,scope:$('scope').value,notes:$('notes').value,taxPct:$('tax').value,discount:$('discount').value,validDays:$('valid').value,language:$('lang').value};}

function drawClauses(){const c=$('clauses');if(!c)return;c.innerHTML=clauses.map((cl,i)=>`<label>${i+1}. Title</label><input data-ci="${i}" data-cf="title" value="${esc(cl.title)}"><textarea data-ci="${i}" data-cf="body" rows="4" style="margin-top:6px">${esc(cl.body)}</textarea>`).join('');const b=$('c_btns');if(b)b.style.display=clauses.length?'flex':'none';}

function schedSum(){return Math.round(sched.reduce((a,m)=>a+(+m.pct||0),0)*100)/100;}
function schedNote(){const s=document.querySelector('#sched small');if(s){s.textContent='Total '+schedSum()+'%'+(schedSum()===100?'':' (must be 100%)');s.className=schedSum()===100?'ok':'bad';}}
function drawSched(){const c=$('sched');if(!c)return;const t=totals().total;
 c.innerHTML=sched.map((m,i)=>`<div class="line" style="grid-template-columns:1fr 70px 90px 30px"><input data-sf="label" data-si="${i}" value="${esc(m.label)}"><input data-sf="pct" data-si="${i}" inputmode="decimal" value="${esc(m.pct)}"><span class="muted">${$$(Math.round(t*(+m.pct||0)/100))}</span><button data-sdel="${i}">&times;</button></div>`).join('')+
 `<div class="btns"><button class="btn sec" data-sadd="1">+ Add a milestone</button></div>`+(sched.length?`<small class="${schedSum()===100?'ok':'bad'}">Total ${schedSum()}%${schedSum()===100?'':' (must be 100%)'}</small>`:'');}
function costTotal(){const base=cost.items.reduce((a,c)=>a+(+c.amount||0),0);return{base,total:Math.round(base*(1+(+cost.markupPct||0)/100)*100)/100};}
function costOut(){const o=$('c_out');const x=costTotal();if(o)o.innerHTML='Costs '+$$(Math.round(x.base*100))+'<br><b>Price '+$$(Math.round(x.total*100))+'</b>';}
function drawCost(){const c=$('cost');if(!c)return;
 c.innerHTML=cost.items.map((x,i)=>`<div class="line" style="grid-template-columns:1fr 110px 30px"><input data-cf2="label" data-ci2="${i}" value="${esc(x.label)}" placeholder="Example: Wood fence materials"><input data-cf2="amount" data-ci2="${i}" inputmode="decimal" value="${esc(x.amount||'')}" placeholder="$"><button data-cdel="${i}">&times;</button></div>`).join('')+
 `<div class="btns"><button class="btn sec" data-cadd="1">+ Add a cost</button></div><div class="row"><div><label>Markup for overhead, contingency and profit (%)</label><input id="c_mk" inputmode="decimal" value="${esc(cost.markupPct||'')}"></div><div class="tot" style="align-self:end" id="c_out"></div></div>
 <div class="btns"><button class="btn sec" data-cuse="1">Use as project total line</button></div>`;costOut();}
document.addEventListener('input',e=>{const t=e.target,ds=t.dataset||{};
 if(ds.sf){sched[+ds.si][ds.sf]=t.value;schedNote();}
 else if(ds.cf2){cost.items[+ds.ci2][ds.cf2]=t.value;costOut();}
 else if(t.id==='c_mk'){cost.markupPct=t.value;costOut();}
 else if(t.id==='discount'||t.id==='tax')drawSched();});
document.addEventListener('click',e=>{const t=e.target,ds=t.dataset||{};
 if(ds.pre){if(ds.pre==='clear')sched=[];else{const names=['Deposit at signing','Posts set and rails installed','Work substantially complete','Final payment after punch list'];const p=ds.pre.split(',').map(Number);sched=p.map((v,i)=>({label:p.length===2?(i?'Final payment on completion':'Deposit at signing'):names[i],pct:v}));}drawSched();}
 else if(ds.sadd){sched.push({label:'',pct:0});drawSched();}
 else if(ds.sdel!==undefined&&ds.sdel!==''){sched.splice(+ds.sdel,1);drawSched();}
 else if(ds.cadd){cost.items.push({label:'',amount:0});drawCost();}
 else if(ds.cdel!==undefined&&ds.cdel!==''){cost.items.splice(+ds.cdel,1);drawCost();}
 else if(ds.cuse){const x=costTotal();if(x.total<=0){msg('Add your costs first.');return;}lines=lines.filter(l=>l.description!=='Project total');lines.push({description:'Project total',qty:1,unit:'lump sum',unitPrice:x.total});drawLines();msg('Added a Project total line.',true);}
});

 let reqs=[];try{reqs=(await api('/api/esign?jobId='+jobId)).requests;}catch(x){return;}
 [['estimate',est],['contract',ctr]].forEach(([k,doc])=>{const el=$('sig_'+k);if(!el||!doc)return;

  el.innerHTML='<div class="btns" style="margin-top:8px"><button class="btn sec" data-sigsend="'+doc.id+'">Send for e-signature</button></div>'+
   '<small>The customer gets a private link, signs on their phone, and you both get the signed copy by email. Save any changes first.</small>'+
   mine.map(r=>'<div class="ev"><b>'+esc(SIGST[r.status]||r.status)+'</b> &middot; '+esc(r.signerName)+' ('+esc(r.signerEmail)+') &middot; '+esc(dtf(String(r.signedAt||r.createdAt||'').slice(0,10)))+
    (r.status==='signed'?' <a href="/api/esign/record?id='+r.id+'" target="_blank">Open signed copy</a> &middot; <a href="/api/esign/record?id='+r.id+'&format=pdf" target="_blank">PDF</a>':'')+
    (r.status==='pending'?' <button class="btn sec" data-sigvoid="'+r.id+'" style="padding:2px 8px">Cancel</button>':'')+'</div>').join('');});
}

function dtOpen(){const f=$('dt_form');if(!f||!J)return;const j=J.job;
 f.innerHTML=`<div class="dtf"><b>Edit details</b><small class="muted" style="display:block">Fix a name, number or address any time. Changes are saved to the job history.</small>
 <div class="row"><div><label>Customer name</label><input id="dt_name" value="${esc(j.customerName)}"></div><div><label>Job title</label><input id="dt_title" value="${esc(j.title)}"></div></div>

 <label>Street address</label><input id="dt_addr" value="${esc(j.address||'')}"><div class="row"><div><label>City</label><input id="dt_city" value="${esc(j.city||'')}"></div><div><label>ZIP</label><input id="dt_zip" inputmode="numeric" value="${esc(j.zip||'')}"></div></div>
 <div class="btns"><button class="btn" data-dtsave="1">Save</button><button class="btn sec" data-dtcancel="1">Cancel</button></div></div>`;
 const n=$('dt_name');if(n)n.focus();}
const vTime=t=>{const m=/^(\d\d):(\d\d)$/.exec(t||'');if(!m)return '';const h=+m[1];return (h%12||12)+':'+m[2]+' '+(h<12?'AM':'PM');};
const vWhen=v=>dtf(v.date)+(vTime(v.time)?' at '+vTime(v.time):'');
const todayL=()=>new Date(Date.now()-6*36e5).toISOString().slice(0,10);
function gcalVisit(d){const v=d.visit,j=d.job;if(!v)return '';const dd=v.date.replace(/-/g,'');let dates;if(v.time){const t=v.time.replace(':','')+'00';const e=String((+v.time.slice(0,2)+1)%24).padStart(2,'0')+v.time.slice(3)+'00';dates=dd+'T'+t+'/'+dd+'T'+e;}else{const n=new Date(v.date+'T00:00:00Z');n.setUTCDate(n.getUTCDate()+1);dates=dd+'/'+n.toISOString().slice(0,10).replace(/-/g,'');}
 const addr=[j.address,j.city,[j.state,j.zip].filter(Boolean).join(' ')].filter(Boolean).join(', ');return 'https://calendar.google.com/calendar/render?action=TEMPLATE&text='+encodeURIComponent('Site visit - '+j.customerName)+'&dates='+dates+'&details='+encodeURIComponent((v.notes||'')+'\nJob: https://paintersmax.app/jobs?id='+j.id)+'&location='+encodeURIComponent(addr);}
function visitSub(d){const v=d.visit;if(!v)return 'Optional';if(v.status==='booked')return vWhen(v);if(v.status==='done')return 'Done';return 'Cancelled';}
function visitCard(d){const v=d.visit,j=d.job;const booked=v&&v.status==='booked';const est=d.estimate&&d.estimate.estimate;
 const top=booked?`<p style="margin-top:0"><b>Booked: ${esc(vWhen(v))}</b><br><small class="muted">${v.notify?(v.confirmedAt?'The customer was emailed a confirmation and gets a reminder the day before.':'The customer email has not gone out yet. Tap Save visit to send it.'):'The customer is not emailed about this visit.'}</small></p>`:v&&v.status==='done'?`<p style="margin-top:0"><b>Visit done</b> <small class="muted">(${esc(dtf(v.date))})</small></p>`:v&&v.status==='cancelled'?`<p class="muted" style="margin-top:0">The visit on ${esc(dtf(v.date))} was cancelled. You can book a new one.</p>`:`<p style="margin-top:0">Need to see the place, or go back to measure? Pick a day and time below and tap <b>Book</b>. It goes on your calendar.</p><small class="muted" style="display:block;margin-bottom:8px">Tick the box if you want the customer to get a confirmation email and a reminder the day before. Nothing is emailed unless you tick it. At the visit, add what you see in Visit notes below.</small>`;
 const dv=booked?v.date:'',tv=booked?v.time:'',nv=booked?v.notes:'',lg=booked?v.lang:(est&&est.language==='es'?'es':'en');
 const nt=booked?!!v.notify:!!j.customerEmail;
 return `<div class="card">${top}<div class="row"><div><label>Date</label><input type="date" id="vs_date" min="${todayL()}" value="${esc(dv)}"></div><div><label>Time (optional)</label><input type="time" id="vs_time" value="${esc(tv)}"></div></div>
 <label>Notes for me (private, never emailed)</label><textarea id="vs_notes" rows="2" placeholder="Example: Bring a ladder and the color deck. Dog in the back yard.">${esc(nv)}</textarea>
 <div class="row"><div><label>Customer email language</label><select id="vs_lang"><option value="en">English</option><option value="es" ${lg==='es'?'selected':''}>Español</option></select></div></div>
 <label style="display:flex;gap:8px;align-items:flex-start;margin-top:10px"><input type="checkbox" id="vs_notify" style="width:auto;margin-top:3px" ${nt&&j.customerEmail?'checked':''} ${j.customerEmail?'':'disabled'}><span>Email ${esc(String(j.customerName||'the customer').split(/\s+/)[0])} a confirmation with a calendar file, and a reminder the day before<br><small class="muted">${j.customerEmail?'The email names only the date, time and address. Your notes are never included.':'Add an email address in Edit details first.'}</small></span></label>
 <div class="btns"><button class="btn" data-vsbook="1">${booked?'Save visit':'Book the visit'}</button>${booked?`<button class="btn sec" data-vsdone="1">Mark visit done</button><button class="btn sec" data-vscancel="1">Cancel visit</button><a class="btn sec" style="text-decoration:none;display:inline-block" target="_blank" rel="noopener" href="${esc(gcalVisit(d))}">Add to Google Calendar</a>`:''}</div></div>`;}
function soCard(d){const s=d.signoff,j=d.job;const nm=esc(String(j.customerName||'the customer').split(/\s+/)[0]);const em=!!j.customerEmail;const lg=(d.estimate&&d.estimate.estimate&&d.estimate.estimate.language)==='es'?'es':'en';
 let h='';
 if(s&&s.acceptedAt)h=`<p style="margin-top:0"><b>Accepted by ${esc(s.acceptedBy||'the customer')} on ${esc(dtf(s.acceptedOn))}.</b><br><small class="muted">The warranty certificate will start from that day.</small></p>`;
 else if(s)h=`<p style="margin-top:0"><b>Waiting for ${nm} to accept the finished work.</b><br><small class="muted">Asked ${esc(dtf((s.requestedAt||'').slice(0,10)))}${s.emailedAt?'. The link was emailed to them.':'. Not emailed yet.'}</small></p>${s.concern?`<div style="background:#fff7e6;border:1px solid #E8A33D;border-radius:8px;padding:10px 12px;margin-bottom:10px"><b>${nm} sent a note:</b><br>${esc(s.concern.text)}</div>`:''}<div class="btns"><button class="btn sec" data-soreq="again" ${em?'':'disabled'}>Email the link again</button><button class="btn sec" data-sowd="1">Take back the request</button></div>`;
 else h=`<p class="muted" style="margin-top:0">Optional. At the final walkthrough you can ask ${nm} to confirm the finished work on their private page. It saves their name and the date, and the warranty starts from that day.</p><label style="display:flex;gap:8px;align-items:flex-start"><input type="checkbox" id="so_mail" style="width:auto;margin-top:3px" ${em?'checked':''} ${em?'':'disabled'}><span>Email ${nm} the link<br><small class="muted">${em?'Nothing is sent unless this is ticked.':'Add an email address in Edit details to send it by email. You can still share the Customer portal link.'}</small></span></label><div class="btns"><button class="btn" data-soreq="new">Ask ${nm} to accept the finished work</button></div>`;
 const late=['invoiced','closed'].includes(j.stage)||(s&&s.acceptedAt);
 if(late)h+=`<h3 style="margin:16px 0 4px">Review request</h3>${d.reviewAskedAt?`<p style="margin:0 0 6px"><b>Review request sent ${esc(dtf(String(d.reviewAskedAt).slice(0,10)))}.</b></p>`:''}<p class="muted" style="margin:0 0 6px">A short thank-you email that asks for a review. You read it first, and nothing is sent until you tap Send.</p><div class="btns" style="margin-top:0"><button class="btn sec" data-rvprev="${lg}" ${em?'':'disabled'}>${d.reviewAskedAt?'Write another review request':'Write the review request'}</button></div><div id="rv_box"></div>`;
 return `<div class="card">${h}</div>`;}
function bidLink(d){return `<a class="btn big dark" style="display:block;text-align:center;text-decoration:none;margin:0 0 12px" href="/jobs?id=${d.job.id}&bid=1">Open the bid screen: talk, photos, quick price</a>`;}
function nextSteps(d){const L=d.layout,b=d.bid;if(!L||!b||!b.tools||!b.tools.length)return '';const pick=L.tools.filter(t=>b.tools.includes(t.id));if(!pick.length)return '';
 return `<div class="card nsteps"><b>Next steps you picked for this bid</b>${pick.map(t=>`<div style="margin-top:8px">&#8226; <b>${esc(t.label)}</b><br><small class="muted">${esc(t.hint)}</small></div>`).join('')}<small class="muted" style="display:block;margin-top:8px"><a href="/jobs?id=${d.job.id}&bid=1">Change them on the bid screen</a></small></div>`;}
function nextStep(d){const j=d.job,e=d.estimate,st=j.stage;const nm=String(j.customerName||'the customer').split(/\s+/)[0];let t='';
 const vs=d.visit&&d.visit.status==='booked'?d.visit:null;
 if(st==='lead'&&vs&&!e)t=vs.date<todayL()?`The visit on ${dtf(vs.date)} is still marked as booked. Open Site visit and tap Mark visit done once you have been there.`:`Visit ${vWhen(vs)}. Take photos and notes, then tap Create estimate.`;
 else if(st==='lead')t=e?`You started an estimate. Review it, then send it to ${nm}.`:`This is a new bid. Open the bid screen to talk through the job and take photos, then get a quick price or write the full estimate.`;
 else if(st==='bid')t=e&&e.status==='sent'?`Estimate sent. Waiting for ${nm} to approve it. A friendly call or text often helps.`:`Your estimate is saved. Send it to ${nm} when it looks right.`;
 else if(st==='contract')t=`Contract stage. Record the deposit when it arrives, then add the job to the calendar. If the crew is already working, tap Start the job.`;
 else if(st==='scheduled'){const sc=d.schedule,td=new Date(Date.now()-6*36e5).toISOString().slice(0,10);t=sc&&sc.start?(sc.start<=td?`The start date (${dtf(sc.start)}) is here. Tap Start the job when the crew begins.`:`Scheduled for ${dtf(sc.start)}. Record the deposit if you have not, and make crew instructions and a materials list. When the crew begins, tap Start the job.`+(sc.startNotice?(sc.noticed&&sc.noticed===sc.start?` ${nm} was emailed the "We start tomorrow" notice.`:` ${nm} will be emailed a "We start tomorrow" notice the day before.`):'')):`Scheduled. Record the deposit if you have not, and make crew instructions and a materials list. When the crew begins, tap Start the job.`;}
 else if(st==='in_progress')t=`Work in progress. If ${nm} asks for something extra, make a change order so the price stays right.`;
 else if(st==='punch')t=`Final walkthrough. Finish the punch list, then build the invoice. You can also ask ${nm} to accept the finished work under Customer sign-off.`;
 else if(st==='invoiced')t=`Invoice sent. Record payments as they come in. When it is paid the job closes, and you can send the warranty.`;
 else if(st==='closed')t=`This job is done. Send the warranty certificate and save what you learned.`;
 const go=(st==='contract'||st==='scheduled')?`<div class="btns" style="margin-top:8px"><button class="btn" data-startjob="1">Start the job</button></div>`:'';
 return t?`<div class="next"><b>Next:</b> ${esc(t)}${go}</div>`:'';}

function briefCard(){return `<div class="card"><div class="jtypes" id="bf_types" style="display:none"></div>
 <label for="bf_details">Tell me about it. Type it, or tap the mic and talk.</label>
 <textarea id="bf_details" rows="4" placeholder="Example: Two bedrooms and the hall. Walls are in good shape. Customer wants it done before Thanksgiving."></textarea>
 <div class="btns" style="margin-top:6px"><button type="button" class="btn sec mic" id="bf_mic" style="display:none" aria-label="Speak your notes"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="9" y="2" width="6" height="12" rx="3"/><path d="M5 11a7 7 0 0014 0M12 18v4"/></svg>Mic</button></div>

function bfDraw(){if(!BF||!J)return;const T_=J.jobTypes||[];const def=T_.find(t=>t.id===BF.type)||T_[0];if(!def||!$('bf_types'))return;
 $('bf_types').innerHTML=T_.map(t=>`<button type="button" class="jt ${t.id===BF.type?'on':''}" data-jt="${t.id}" title="${esc(t.hint)}">${esc(t.label)}</button>`).join('');
 $('bf_q').innerHTML=`<small class="muted" style="display:block;margin-top:8px">${esc(def.hint)}. Tap what fits. Skip anything you do not know.</small>`+def.questions.map(q=>{const v=BF.answers[q.id];let h=`<label>${esc(q.label)}${q.help&&window.pmHelp?window.pmHelp(q.help):''}</label>`;
  if(q.kind==='select')h+=`<select data-bq="${q.id}"><option value="">Choose...</option>${q.options.map(o=>`<option ${v===o?'selected':''}>${esc(o)}</option>`).join('')}</select>`;
  else if(q.kind==='multi')h+=`<div class="ckgrid">${q.options.map(o=>`<label class="ck"><input type="checkbox" data-bqm="${q.id}" value="${esc(o)}" ${(v||[]).includes(o)?'checked':''}> ${esc(o)}</label>`).join('')}</div>`;
  else if(q.kind==='number')h+=`<input data-bq="${q.id}" inputmode="decimal" value="${esc(v||'')}">`;
  else h+=`<input data-bq="${q.id}" value="${esc(v||'')}">`;
  return h;}).join('');
 $('bf_details').value=BF.details||'';$('bf_photo').value=BF.photoNote||'';}
function bfSaveSoon(){clearTimeout(bfT);bfT=setTimeout(bfSave,700);}
async function bfSave(){clearTimeout(bfT);if(!J||!BF)return;try{await api('/api/job',{action:'brief',jobId:J.job.id,brief:BF});}catch(e){}}
async function bfCreate(){const btn=$('bf_create');if(!btn||!J)return;if(lines.length&&!confirm('This replaces the scope and lines on the page with a fresh draft. Continue?'))return;
 await bfSave();btn.disabled=true;btn.textContent='Writing your estimate...';msg('');
 try{const r=await api('/api/estimate',{action:'aiDraft',jobId:J.job.id,language:($('lang')||{}).value==='es'?'es':'en'});
  if(r.scope&&$('scope'))$('scope').value=r.scope;lines=(r.lines||[]).map(l=>({...l}));
  [['e_incl',r.inclusions],['e_excl',r.exclusions],['e_assume',r.assumptions]].forEach(([id,a])=>{if(a&&a.length&&$(id))$(id).value=a.join('\n');});
  drawLines();coachDraw(r);openAcc('est');const a=$('acc_est');if(a)a.scrollIntoView({behavior:'smooth',block:'start'});
 }catch(x){if(x)msg(x.message);}
 btn.disabled=false;btn.textContent='Create estimate';}
function coachDraw(r){const b=$('bf_coach');if(!b)return;const T=window.pmT||(q=>q);const L=t=>`<li>${esc(T(t))}</li>`;let h='';const nm=String(J.job.customerName||'the customer').split(/\s+/)[0];
 if(r.pricedCount)h+=L(`I priced ${r.pricedCount} ${r.pricedCount===1?'item':'items'} from your own price list, as a starting point only. Check the quantities and change any price that does not fit this job, then tap Create final estimate.`);
 if(r.needsPriceCount)h+=L(`${r.needsPriceCount} ${r.needsPriceCount===1?'line needs':'lines need'} your price (marked in orange). I never guess your prices.`);
 if(!r.hasPriceList)h+=`<li>${esc(T('You have not set prices for this type of work yet.'))} <a href="/app">${esc(T('Open Estimating Setup'))}</a> ${esc(T('and your next estimates will price themselves.'))}</li>`;
 if(r.assumptions&&r.assumptions.length)h+=L(`I made these assumptions. Please confirm them: ${r.assumptions.join('; ')}.`);
 if(r.questions&&r.questions.length)h+=`<li>${esc(T('Good questions to ask '+nm+' before you send:'))}<ul>${r.questions.map(q=>'<li>'+esc(q)+'</li>').join('')}</ul></li>`;
 h+=L('Not sure about the total? Tap "Get a second opinion on my price". The Quote helper builds its own price without your price list, then compares the two and coaches you if you have been bidding too low or too high.');
 b.innerHTML=`<div class="coach"><b>${esc(T('Here is what I did'))}</b><ul>${h}</ul>${window.pmThumbs?'<div>'+window.pmThumbs(r.ai)+'</div>':''}</div>`;}
async function bfOpinion(){if(!J)return;openAcc('help');const el=$('acc_help');if(el)el.scrollIntoView({behavior:'smooth',block:'start'});
 const q=$('as_in');if(q&&!q.value.trim())q.value='Please build your own quote for this job and compare it with my estimate. Tell me if I am too low or too high.';
 setTimeout(()=>{if(typeof askNow==='function')askNow($('as_in').value,'quote');},200);}

function checkInfo(title,extra,go){return new Promise(res=>{const j=J.job;
 const rows=[['Customer',j.customerName],['Email',j.customerEmail||'(none)'],['Phone',j.customerPhone||'(none)'],['Address',[j.address,j.city,j.zip].filter(Boolean).join(', ')||'(none)'],['Job',j.title]].concat(extra||[]);
 const w=document.createElement('div');w.className='modal';
 w.innerHTML=`<div class="mbox" role="dialog" aria-modal="true" aria-label="Check the information"><b style="font-size:17px">${esc(title)}</b><p class="muted" style="margin:4px 0 10px">Take a quick look. This is what the customer will see, and it is hard to take back once it goes out.</p>${rows.map(([a,b])=>`<div class="mrow"><span>${esc(a)}</span><b>${esc(b)}</b></div>`).join('')}<div class="btns"><button class="btn" data-ok="1">${esc(go||'Looks right, send it')}</button><button class="btn sec" data-fix="1">Fix something</button></div></div>`;
 const done=v=>{document.removeEventListener('keydown',key);w.remove();res(v);if(!v){window.scrollTo({top:0,behavior:'smooth'});dtOpen();}};
 const key=e=>{if(e.key==='Escape')done(false);};
 w.addEventListener('click',e=>{if(e.target.dataset&&e.target.dataset.ok)done(true);else if((e.target.dataset&&e.target.dataset.fix)||e.target===w)done(false);});
 document.addEventListener('keydown',key);document.body.appendChild(w);const ok=w.querySelector('[data-ok]');if(ok)ok.focus();});}

document.addEventListener('change',e=>{const t=e.target;if(!J||!BF||!t.dataset)return;
 if(t.dataset.bq!==undefined){BF.answers[t.dataset.bq]=t.value;bfSaveSoon();}
 else if(t.dataset.bqm!==undefined){const id=t.dataset.bqm;BF.answers[id]=[...document.querySelectorAll('[data-bqm="'+id+'"]')].filter(x=>x.checked).map(x=>x.value);bfSaveSoon();}});
document.addEventListener('input',e=>{const t=e.target;if(!J||!BF)return;if(t.id==='bf_details'){BF.details=t.value;bfSaveSoon();}else if(t.id==='bf_photo'){BF.photoNote=t.value;bfSaveSoon();}else if(t.dataset&&t.dataset.bq!==undefined&&t.tagName==='INPUT'){BF.answers[t.dataset.bq]=t.value;bfSaveSoon();}});
document.addEventListener('click',async e=>{const t=e.target,ds=t.dataset||{};if(!J)return;
 if(ds.jt){if(BF&&BF.type!==ds.jt){BF.type=ds.jt;BF.answers={};await bfSave();await detail(J.job.id);}}
 else if(t.id==='bf_create'){bfCreate();}
 else if(t.id==='bf_opinion'){bfOpinion();}
 else if(ds.startjob){if(!confirm('Start this job? It moves to In progress, and you can make change orders if the customer asks for extra work.'))return;try{msg('');await api('/api/job',{action:'start',jobId:J.job.id});await detail(J.job.id);openAcc('wo');msg('Job started. It is now in progress.',true);}catch(x){if(x)msg(x.message);}}
 else if(ds.soreq){const again=ds.soreq==='again';const mail=again||!!($('so_mail')||{}).checked;const lg=(J.estimate&&J.estimate.estimate&&J.estimate.estimate.language)==='es'?'es':'en';
  if(mail&&!await checkInfo('Email the finished-work link',[['What they receive','A link to their private page, with a button to accept the finished work']],'Looks right, send it'))return;
  try{msg('');const r=await api('/api/signoff',{action:'request',jobId:J.job.id,email:mail,language:lg});await detail(J.job.id);openAcc('signoff');msg(r.emailed==='sent'?'Asked. The customer was emailed the link.':r.emailed==='skipped'?'Asked, but the email could not be sent. Share the Customer portal link instead.':'Asked. The customer will see the button on their private page.',true);}catch(x){if(x)msg(x.message);}}

 <div id="iv_ms"></div><div id="iv_ex"></div><div class="row"><div><label>Already paid ($)</label><input id="iv_paid" inputmode="decimal"></div><div><label>Language</label><select id="iv_lang"><option value="en">English</option><option value="es">Español</option></select></div></div>
 <label>Notes (thank you, anything else)</label><textarea id="iv_notes" rows="3"></textarea><div class="btns" style="margin-top:6px"><button class="btn sec" data-ivnote="1">Write a thank-you note</button></div><small class="muted">The note never includes amounts. You can edit it before you save.</small><label>How to pay me <small class="muted">(prints on the invoice, saved for next time)</small></label><textarea id="iv_how" rows="3" placeholder="Example: Zelle to 555-123-4567. Checks payable to Tyler Painters."></textarea><small class="muted">Type how you like to be paid. Never put a bank account number here unless you choose to.</small>
 <label style="display:flex;gap:8px;align-items:flex-start;margin-top:10px"><input type="checkbox" id="iv_rem" style="width:auto;margin-top:3px"><span>Email the customer a friendly reminder if this is still unpaid after 7 and 14 days<br><small class="muted">The reminder names the invoice but never states an amount. It stops when you mark the invoice paid.</small></span></label><div class="btns"><button class="btn" data-ivsave="1">${lock?'Create corrected invoice':'Save'}</button><button class="btn sec" data-ivview="1" ${x?'':'disabled'}>View / print</button><button class="btn sec" data-ivsend="1" ${x&&d.job.customerEmail?'':'disabled'}>Email to customer</button><button class="btn sec" data-ivpaid="1" ${x?'':'disabled'}>Mark as paid</button></div></div>
 <small>${x?'Status: '+esc(x.status):'Not saved yet'}</small>`:'<p class="muted">Save the estimate first. The invoice uses its price.</p>'}</div>`;}
function ivMs(){const w=$('iv_ms');if(!w)return;w.innerHTML=msOpts.length?`<label>Which payment is this invoice for?</label><select id="iv_msel"><option value="">The whole job</option>${msOpts.map((m,i)=>`<option value="${i}" ${inv.milestone===i?'selected':''}>${i+1}. ${esc(m.label)} (${m.pct}%, ${$$(m.amountCents)}${i===msOpts.length-1&&(inv.extras||[]).length?' plus change orders':''})</option>`).join('')}</select>`:'';}
function ivEx(){const w=$('iv_ex');if(!w)return;const ex=inv.extras||[];const tot=ex.reduce((s,l)=>s+Math.round((+l.qty||0)*(+l.unitCents||0)),0);
 w.innerHTML=`<label>Approved change orders on this invoice</label>`+(ex.length?`<div class="line head" style="grid-template-columns:1fr 56px 84px 30px"><span>What</span><span>Qty</span><span>Price ($)</span><span></span></div>`+ex.map((l,i)=>`<div class="line" style="grid-template-columns:1fr 56px 84px 30px"><input data-ixd="${i}" value="${esc(l.description)}" aria-label="Description"><input data-ixq="${i}" inputmode="decimal" value="${esc(l.qty)}" aria-label="Quantity"><input data-ixu="${i}" inputmode="decimal" value="${((+l.unitCents||0)/100).toFixed(2)}" aria-label="Unit price"><button data-ixdel="${i}" title="Remove this line">&times;</button></div>`).join('')+`<small class="muted">Change orders total ${$$(tot)}.</small>`:'<small class="muted">None yet. Approved change orders land here as separate lines when you build the invoice, and you can edit them.</small>')+`<div class="btns" style="margin-top:6px"><button class="btn sec" data-ixadd="1">Add a line</button></div>`+(msOpts.length>1&&ex.length?`<small class="muted" style="display:block">With a payment schedule, change orders are billed with the final payment.</small>`:'');}
function ivExRead(){const out=[];document.querySelectorAll('#iv_ex [data-ixd]').forEach(el=>{const i=el.dataset.ixd;const q=document.querySelector('#iv_ex [data-ixq="'+i+'"]'),u=document.querySelector('#iv_ex [data-ixu="'+i+'"]');out.push({description:el.value,qty:parseFloat(q&&q.value)||0,unitCents:Math.round((parseFloat(u&&u.value)||0)*100)});});return out;}
function ivFill(){const f=$('ivf');if(!f)return;f.style.display='block';ivMs();ivEx();$('iv_num').value=inv.number||'';$('iv_due').value=inv.dueDate||'';$('iv_paid').value=inv.paid||'';$('iv_notes').value=inv.notes||'';$('iv_how').value=inv.howToPay||(PAY&&PAY.howToPay)||'';$('iv_lang').value=inv.language||'en';const rc=$('iv_rem');if(rc)rc.checked=!!inv.reminders;}
function ivRead(){const ms=$('iv_msel');return{milestone:ms&&ms.value!==''?Number(ms.value):null,number:$('iv_num').value,dueDate:$('iv_due').value,paid:$('iv_paid').value,notes:$('iv_notes').value,howToPay:($('iv_how')||{value:''}).value,language:$('iv_lang').value,reminders:!!($('iv_rem')||{}).checked,extras:ivExRead()};}
function drawMore(d){
 docs={};for(const m of DOCS){if(d.docs[m.k]&&d.docs[m.k].doc)docs[m.k]=JSON.parse(JSON.stringify(d.docs[m.k].doc));}
 inv=d.docs.invoice&&d.docs.invoice.invoice?{...d.docs.invoice.invoice,paid:(d.docs.invoice.invoice.paidCents||0)/100}:{};
 const put=(id,h)=>{const el=$(id);if(el)el.innerHTML=h;};
 put('m_sched',docCard(DOCS[1],d));put('m_mat',docCard(DOCS[0],d));put('m_crew',docCard(DOCS[2],d));put('m_punch',docCard(DOCS[3],d));put('m_inv',invCard(d));put('m_warr','<b>Warranty letter</b>'+docCard(DOCS[4],d));
 const ST={draft:'Saved as a draft',sent:'Sent to the customer',paid:'Paid',signed:'Signed',approved:'Approved'};
 [['schedule','sched'],['materials','mat'],['instructions','crew'],['punch','punch'],['invoice','inv'],['warranty','warr']].forEach(([k,a])=>{const x=d.docs[k];const el=$('accs_'+a);if(el)el.textContent=x?(ST[x.status]||x.status||'Saved'):'Not started';});
 DOCS.forEach(m=>wDraw(m.k));msOpts=((d.estimate&&d.estimate.estimate&&d.estimate.estimate.schedule)||[]).map((m,i,a)=>({label:m.label,pct:m.pct,amountCents:Math.round(((d.estimate.totals||{}).totalCents||0)*m.pct/100)}));if(d.docs.invoice&&d.docs.invoice.invoice)ivFill();
}
async function jd(body){try{msg('');return await api('/api/jobdoc',{jobId:J.job.id,...body});}catch(x){if(x)msg(x.message);}}
document.addEventListener('click',async e=>{const t=e.target,ds=t.dataset||{};if(!J)return;
 const rel=()=>detail(J.job.id);
 if(ds.dkbuild){const k=ds.dkbuild;if(docs[k]&&!confirm('This replaces what is on screen with a fresh draft. Continue?'))return;const r=await jd({action:'draft',kind:k,language:$('wlang_'+k).value,startDate:($('wstart_'+k)||{}).value,completionDate:($('wdone_'+k)||{}).value});if(r){docs[k]=r.doc;wDraw(k);msg('Built. Edit anything you like.',true);}}
 else if(ds.dksave){const k=ds.dksave;docs[k].language=$('wlang_'+k).value;const r=await jd({action:'save',kind:k,doc:docs[k]});if(r)rel().then(()=>msg('Saved.',true));}
 else if(ds.dksend){const k=ds.dksend;if(!await checkInfo('Email this to '+String(J.job.customerName||'the customer').split(/\s+/)[0],[['Document',(DOCS.find(x=>x.k===k)||{}).t||'Document']],'Looks right, send it'))return;docs[k].language=$('wlang_'+k).value;const r=await jd({action:'send',kind:k,doc:docs[k]});if(r)rel().then(()=>msg('Emailed.',true));}
 else if(ds.dkview){const x=J.docs[ds.dkview];if(x)window.open('/api/doc?id='+x.id,'_blank');}
 else if(ds.dkadd){const k=ds.dkadd;docs[k].items.push({text:'',detail:'',qty:0,unit:''});wDraw(k);}
 else if(ds.dkdel){const[k,i]=ds.dkdel.split(':');docs[k].items.splice(+i,1);wDraw(k);}
 else if(ds.ixadd){inv.extras=ivExRead();inv.extras.push({description:'',qty:1,unitCents:0});ivEx();}
 else if(ds.ixdel!==undefined){const ex=ivExRead();ex.splice(+ds.ixdel,1);inv.extras=ex;ivEx();}
 else if(ds.ivbuild){if(inv.number&&!confirm('This replaces the invoice on screen. Continue?'))return;const r=await jd({action:'draft',kind:'invoice',language:'en'});if(r){inv=r.invoice;msOpts=r.milestones||[];ivFill();const c=$('iv_chk'),T=window.pmT||function(q){return q};if(c)c.innerHTML=(r.checks&&r.checks.length)?'<div style="background:#fff7e6;border:1px solid #E8A33D;border-radius:8px;padding:10px 12px;margin:10px 0"><b>'+T('Check before you send')+'</b><ul style="margin:6px 0 0;padding-left:18px">'+r.checks.map(x=>'<li>'+esc(T(x))+'</li>').join('')+'</ul></div>':'<p class="muted">'+T('No problems found. Review the amounts, then save and send.')+'</p>';}}
 else if(ds.ivnote){const r=await jd({action:'note',kind:'invoice',language:($('iv_lang')||{}).value||'en'});if(r&&r.note){const n=$('iv_notes');n.value=(n.value?n.value+'\n\n':'')+r.note;msg('Note added. Review it, then save.',true);}}
 else if(ds.ivsave){const lk=J.docs.invoice&&(J.docs.invoice.status==='sent'||J.docs.invoice.status==='paid');if(lk&&!confirm('Create a corrected invoice? The invoice you already sent stays on record, and the corrected one starts as a draft.'))return;const iv=ivRead();const r=await jd({action:'save',kind:'invoice',invoice:iv,corrected:lk||undefined});if(r){if(iv.howToPay)api('/api/jobpay',{action:'saveHowToPay',text:iv.howToPay}).catch(()=>{});rel().then(()=>msg(lk?'Corrected invoice created. Review it, then email it.':'Invoice saved.',true));}}
 else if(ds.ivsend){const iv=ivRead();const exT=iv.extras.reduce((s,l)=>s+Math.round(l.qty*l.unitCents),0),coA=(J.changeOrders||{}).approvedCents||0;const rowsC=[['Invoice number',iv.number||'(next number)'],['Amount already paid',iv.paid?('$'+iv.paid):'$0'],['Change orders on this invoice',$$(exT)]];if(exT!==coA)rowsC.push(['Approved change orders on the job',$$(coA)+(coA>exT?' (not all are on this invoice)':'')]);if((J.changeOrders||{}).pending)rowsC.push(['Change orders waiting for the customer',String(J.changeOrders.pending)]);if(!await checkInfo('Send this invoice',rowsC,'Looks right, send it'))return;const r=await jd({action:'send',kind:'invoice',invoice:iv});if(r)rel().then(()=>msg('Invoice emailed.',true));}
 else if(ds.ivview){const x=J.docs.invoice;if(x)window.open('/api/doc?id='+x.id,'_blank');}
 else if(ds.ivpaid){if(!confirm(PAY&&PAY.totalCents>0&&!PAY.paidInFull?'Your recorded payments still show a balance of '+$$(PAY.balanceCents)+'. Mark this invoice as paid anyway? The job will close.':'Mark this invoice as paid? The job will close.'))return;const r=await jd({action:'paid',kind:'invoice'});if(r)rel().then(()=>msg('Paid. Job closed.',true));}
});
document.addEventListener('change',e=>{if(e.target.id==='iv_msel'){const v=e.target.value;let paid=0;if(v!=='')for(let i=0;i<+v;i++)paid+=msOpts[i].amountCents;$('iv_paid').value=v!==''?(paid/100||''):'';}});
document.addEventListener('click',async e=>{const t=e.target,ds=t.dataset||{};if(!J)return;
 if(ds.claimopen){const b=$('claimbox');b.style.display=b.style.display==='none'?'block':'none';if(b.style.display==='block'&&!$('cl_date').value)$('cl_date').value=new Date().toISOString().slice(0,10);}
 else if(ds.ptshow||ds.ptmail||ds.ptnew){try{msg('');if(ds.ptnew&&!confirm('The old link will stop working. Continue?'))return;const r=await api('/api/portal',{jobId:J.job.id,action:ds.ptmail?'email':ds.ptnew?'reset':'show',language:'en'});ptShow(r.link);if(r.emailed)msg('Link emailed to the customer.',true);}catch(x){if(x)msg(x.message);}}
 else if(ds.inssend){try{msg('');t.disabled=true;await api('/api/insurance',{action:'email_customer',jobId:J.job.id,language:$('ins_lang').value});msg('Proof of insurance emailed to the customer.',true);}catch(x){if(x)msg(x.message);}t.disabled=false;}
 else if(ds.claimbuild){try{msg('');const what=$('cl_what').value.trim();if(!what){msg('Describe what happened first.');return;}
  let s={};try{const r=await api('/api/insurance');s=(r.policy&&r.policy.summary)||{};}catch(_){}
  const j=J.job,date=$('cl_date').value||new Date().toISOString().slice(0,10);
  const lines=['INCIDENT AND CLAIM INFORMATION SHEET','Prepared: '+new Date().toISOString().slice(0,10),'',
   'Contractor / insured: '+(s.insured||'(your business name)'),'Insurance carrier: '+(s.carrier||'(not on file)'),'Policy number (last 4): '+(s.policyNumberLast4||'(see your policy)'),'Policy period: '+[s.effective,s.expires].filter(Boolean).join(' to '),'',
   'Job: '+j.title,'Customer: '+j.customerName+(j.customerPhone?', '+j.customerPhone:'')+(j.customerEmail?', '+j.customerEmail:''),'Job address: '+([j.address,j.city,j.zip].filter(Boolean).join(', ')||'(not on file)'),'',
   'Date of incident: '+date,'Anyone hurt: '+$('cl_hurt').value,'','What happened:',what,'','Damage to the customer property:',$('cl_dmg').value.trim()||'(none reported)','','Others involved or witnesses:',$('cl_wit').value.trim()||'(none listed)','',
   'Photos and video taken: (yes or no)','Date I told my agent or carrier: (fill in)'];
  const sheet=lines.join('\n');
  await api('/api/jobnote',{jobId:j.id,text:'Incident report ('+date+'): '+what.slice(0,400)+(($('cl_hurt').value==='Yes')?' Someone was hurt.':'')});
  $('claimsheet').value=sheet;$('claimout').style.display='block';msg('Saved to the job history. Your claim sheet is ready below. Call or email your insurance agent now.',true);}catch(x){if(x)msg(x.message);}}
 else if(ds.claimcopy){try{await navigator.clipboard.writeText($('claimsheet').value);msg('Copied.',true);}catch(_){$('claimsheet').select();msg('Press Ctrl+C or Command+C to copy.');}}
});
document.addEventListener('input',e=>{const t=e.target,ds=t.dataset||{};if(ds.dk&&ds.df){const d=docs[ds.dk];if(!d)return;if(ds.di!==undefined)d.items[+ds.di][ds.df]=ds.df==='qty'?(Number(t.value)||0):t.value;else d[ds.df]=t.value;}});
document.addEventListener('input',e=>{const t=e.target;if(t.dataset&&t.dataset.ci!==undefined){clauses[+t.dataset.ci][t.dataset.cf]=t.value;return;}if(t.dataset&&t.dataset.f!==undefined){if(t.dataset.f==='section')return;lines[+t.dataset.i][t.dataset.f]=t.value;drawTotals();}else if(t.id==='discount'||t.id==='tax')drawTotals();});
document.addEventListener('click',e=>{const d=e.target.dataset&&e.target.dataset.del;if(d!==undefined&&d!==''){lines.splice(+d,1);drawLines();}});
(async()=>{try{const sp=new URLSearchParams(location.search),id=sp.get('id');if(sp.get('new'))await newBid();else if(sp.get('services'))await servicesPage();else if(id&&sp.get('bid'))await bidScreen(id);else if(id){await detail(id);if(sp.get('draft')){history.replaceState(null,'','/jobs?id='+id);openAcc('type');bfCreate();}}else await list();}catch(e){if(e)$('view').innerHTML='<p class="bad">'+esc(e.message||'Could not load.')+'</p>';}})();
