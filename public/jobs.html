<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0F1B2D">
<title>PaintersMax Jobs</title><script src="/i18n.js" data-app></script>
<style>
*{box-sizing:border-box}
body{font-family:Inter,system-ui,sans-serif;background:#F7F5F1;color:#0F1B2D;margin:0}
header{background:#0F1B2D;color:#fff;padding:14px 16px;display:flex;justify-content:space-between;align-items:center;gap:8px}
header b{font-family:Newsreader,Georgia,serif;font-size:19px;font-weight:500}
header a{color:#E8A33D;font-size:14px;text-decoration:none;margin-left:12px}
main{max-width:720px;margin:0 auto;padding:16px 16px 100px}
h2{font-family:Newsreader,Georgia,serif;font-weight:500;margin:0 0 8px;font-size:26px}
h3{margin:18px 0 6px;font-size:16px}
.card{background:#fff;border:1px solid rgba(15,27,45,.1);border-radius:10px;padding:16px;margin:0 0 14px}
label{display:block;font-size:14px;font-weight:600;margin:10px 0 4px}
input,select,textarea{width:100%;padding:11px;border:1px solid #cfd5dc;border-radius:8px;font:inherit;background:#fff}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn{padding:12px 16px;border-radius:8px;border:0;font-weight:700;font-size:15px;cursor:pointer;background:#E8A33D;color:#0F1B2D}
.btn.sec{background:#eceae4}.btn[disabled]{opacity:.5}
.btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.job{display:flex;justify-content:space-between;gap:10px;padding:12px 0;border-bottom:1px solid #eee;text-decoration:none;color:inherit}
.job:last-child{border-bottom:0}
.sec h3{margin:22px 0 8px}.sec .ct{font-weight:400;color:#4A5568;font-size:14px}
.sg{font-size:12px;border-radius:99px;padding:3px 10px;white-space:nowrap;background:#e6f4ea;color:#0a7a3d;margin-right:6px}.sg.w{background:#fff3d6;color:#8a5a00}
.chips2 summary{cursor:pointer;font-weight:600;font-size:14px;margin:12px 0 4px}
.cat{margin:8px 0}.cat b{font-size:13px}.cat .chip{margin:4px 4px 0 0}
.mic{display:inline-flex;align-items:center;gap:6px}.mic.on{background:#E8A33D}
.stp{display:flex;gap:10px;align-items:flex-start;margin:14px 0 4px}.stp .n{width:24px;height:24px;border-radius:50%;background:#0F1B2D;color:#fff;font-weight:700;font-size:13px;display:inline-flex;align-items:center;justify-content:center;flex:none}.stp.off{opacity:.6}
.rdchip{display:inline-block;background:#eaf6ee;color:#0a7a3d;border-radius:999px;font-size:12px;font-weight:700;padding:2px 8px;margin:3px 0}
.fch{display:inline-flex;align-items:center;gap:6px;border:1px solid #cfd5dc;border-radius:999px;padding:6px 12px;margin:3px 4px 3px 0;font-size:14px;background:#fff;font-weight:500}.fch input{width:auto;margin:0}
.tag{font-size:12px;background:#eceae4;border-radius:99px;padding:3px 10px;white-space:nowrap;align-self:center}
.line{display:grid;grid-template-columns:1fr 70px 60px 90px 30px;gap:6px;margin:6px 0;align-items:center}
.line input{padding:8px}.line button{border:0;background:none;font-size:18px;cursor:pointer;color:#b42318}
.head{font-size:12px;color:#4A5568;font-weight:600}
.tot{text-align:right;font-size:15px;margin-top:10px;line-height:1.7}.tot b{font-size:19px}
small,.muted{color:#4A5568}#msg{font-size:14px;margin:8px 0;min-height:20px}.ok{color:#0a7a3d}.bad{color:#b42318}
.ev{font-size:13px;padding:4px 0;border-bottom:1px solid #f0eee9}
.fab{position:fixed;right:14px;bottom:16px;z-index:30;border-radius:999px;box-shadow:0 4px 14px rgba(0,0,0,.28);padding:13px 20px;font-size:16px}@media print{.fab{display:none}}
.bub{padding:10px 12px;border-radius:10px;margin:8px 0;white-space:pre-wrap;line-height:1.45}.bub.u{background:#eceae4;margin-left:24px}.bub.a{background:#fff8e8;border:1px solid #f0d9a0;margin-right:12px}.chips{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}.chip{border:1px solid #cfd5dc;background:#fff;border-radius:99px;padding:6px 12px;font-size:13px;cursor:pointer}.mini{border:0;background:none;color:#0F1B2D;text-decoration:underline;font-size:12px;cursor:pointer;padding:2px 0}
@media(max-width:520px){.line{grid-template-columns:1fr 60px 50px 80px 26px}}
.fgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px;margin:10px 0}.fi img{width:100%;height:100px;object-fit:cover;border-radius:8px;display:block}
.grp{font-family:Newsreader,Georgia,serif;font-weight:500;font-size:20px;margin:26px 0 2px}.grpn{margin:0 0 8px;font-size:13px}
details.acc{background:#fff;border:1px solid rgba(15,27,45,.1);border-radius:10px;margin:0 0 10px}
details.acc>summary{list-style:none;cursor:pointer;padding:12px 44px 12px 16px;display:flex;flex-direction:column;gap:2px;position:relative;min-height:48px;justify-content:center}
details.acc>summary::-webkit-details-marker{display:none}
details.acc>summary::after{content:"+";position:absolute;right:16px;top:50%;transform:translateY(-50%);font-size:24px;line-height:1;color:#4A5568}
details.acc[open]>summary::after{content:"\2212"}
details.acc[open]>summary{border-bottom:1px solid #eee}
.at{font-weight:700;font-size:16px}.asub{font-size:13px;color:#4A5568}.asub:empty{display:none}
.accin{padding:12px 16px 16px}
.accin .card:not([style]){border:0;padding:0;margin:0 0 12px;background:none}
.next{background:#eef5ff;border:1px solid #9cc2f0;border-radius:10px;padding:10px 12px;margin:0 0 12px;font-size:15px;line-height:1.4}
.contact{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
.cbtn{display:inline-flex;align-items:center;justify-content:center;min-height:44px;padding:0 18px;border-radius:8px;background:#eceae4;color:#0F1B2D;font-weight:700;text-decoration:none;font-size:15px}
.dtf{border-top:1px solid #eee;margin-top:12px;padding-top:10px}
.jtypes{display:flex;flex-wrap:wrap;gap:8px}
.jt{border:1px solid #cfd5dc;background:#fff;border-radius:99px;padding:8px 16px;font-size:15px;font-weight:600;cursor:pointer;min-height:44px;color:#0F1B2D}
.jt.on{background:#0F1B2D;color:#fff;border-color:#0F1B2D}
.ckgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px}
.ck{display:flex;gap:8px;align-items:center;font-weight:400;margin:0;padding:8px 10px;border:1px solid #cfd5dc;border-radius:8px;font-size:14px;min-height:44px}.ck input{width:auto}
.coach{background:#fff8e8;border:1px solid #f0d9a0;border-radius:10px;padding:10px 12px;margin:12px 0}.coach ul{margin:6px 0 0;padding-left:18px}.coach li{margin:5px 0}
.modal{position:fixed;inset:0;background:rgba(15,27,45,.55);z-index:60;display:flex;align-items:flex-end;justify-content:center}
.mbox{background:#fff;width:100%;max-width:520px;border-radius:14px 14px 0 0;padding:18px 16px 22px;max-height:90vh;overflow:auto}
@media(min-width:600px){.modal{align-items:center}.mbox{border-radius:14px}}
.mrow{display:flex;justify-content:space-between;gap:12px;padding:7px 0;border-bottom:1px solid #f0eee9;font-size:14px}.mrow span{color:#4A5568}.mrow b{text-align:right;word-break:break-word}
.np{border-color:#E8A33D!important;background:#fff8e6}
.ed{white-space:nowrap;padding:10px 8px;font-size:14px;min-height:44px}
@media(max-width:520px){.btn{min-height:44px}.mini{padding:8px 4px}}
</style></head><body>
<header><div><b>PaintersMax</b> Jobs</div><div><a href="/app">Estimating Setup</a><a href="/calendar">Calendar</a><a href="/records">Records</a><a href="/crew">Crew</a><a href="/lessons">Lessons</a><a href="/analysis">Analysis</a><a href="/builders">Builder rates</a><a href="/import">Import customers</a><a href="/materials">Materials</a><a href="/insurance">Insurance</a><a href="/dashboard">Settings and leads</a></div></header>
<main><div id="view">Loading...</div><div id="msg"></div></main>
<script>
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const $=id=>document.getElementById(id);
const TRADES={interior:'Interior painting',exterior:'Exterior painting',commercial:'Commercial',new_construction:'New construction',power_washing:'Power washing',drywall:'Drywall repair',cabinets:'Cabinet painting',decks_fences:'Decks and fences',fencing:'Fence installation',remodeling:'Remodeling',epoxy_floors:'Epoxy floors',industrial:'Industrial'};
const QL={small:'Small rooms',medium:'Medium rooms',large:'Large rooms',custom_min:'Custom rooms',ceiling:'Ceilings',trim:'Rooms with trim',door_each:'Doors',accent_wall:'Accent walls',repairs_hourly:'Repair hours',base_1_story:'1-story house (1 = yes)',base_2_story:'2-story house (1 = yes)',base_3_story:'3-story house (1 = yes)',door:'Doors',shutter:'Shutters',window:'Windows',garage_door:'Garage doors',power_washing:'Power washing (1 = yes)',wood_repair_hourly:'Wood repair hours',color_change:'Extra colors',gate_each:'Gates',removal_per_ft:'Old fence to remove (ft)',stain_per_ft:'Staining or painting (ft)',mobilization:'Mobilization (1 = yes)',lift_daily:'Lift days',hourly:'Labor hours'};
const BASE={sqft_floor:[['sqft','Square feet of floor area']],sqft_wall:[['sqft','Square feet of wall']],per_linear_ft:[['linear_ft','Linear feet']],lump_sum:[['cost','Your cost for the whole job ($)']]};
const STAGE={lead:'Lead',bid:'Estimate',contract:'Contract',scheduled:'Scheduled',in_progress:'In progress',punch:'Punch list',invoiced:'Invoiced',closed:'Closed',lost:'Lost'};
let J=null,lines=[],clauses=[],docs={},inv={},chat=[],chatJob=undefined,sched=[],cost={items:[],markupPct:0},msOpts=[];
function msg(t,ok){const m=$('msg');m.textContent=t||'';m.className=ok?'ok':'bad';}
async function api(path,body){const r=await fetch(path,body?{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(body)}:undefined);if(r.status===401){location.href='/login';throw 0;}const j=await r.json().catch(()=>({}));if(!r.ok){const er=new Error(j.error||'Something went wrong.');er.detail=j.detail;er.allowance=j.allowance;er.code=j.code;throw er;}return j;}


const CHIPS_JOB=['What is left to do on this job?','How much paint will I need?','What should I watch out for?','Write a short message to the customer about the schedule'];
const CHIPS_GEN=['How do I price a ceiling in a small bathroom?','What primer do I use over stains?','How long should I wait between coats?'];
const QCATS=[
 ['Bidding and pricing',['How do I price a ceiling in a small bathroom?','How do I bid a repaint by the square foot?','How much should I charge to paint kitchen cabinets?','What markup should I add for overhead and profit?']],
 ['Prep, stains and repairs',['What primer do I use over water stains on a ceiling?','How do I remove mildew before painting?','How do I cover smoke or nicotine stains?','How do I fix peeling paint on an exterior wall?']],
 ['Coatings and finishes',['When should I use oil-based instead of water-based paint?','What is the difference between epoxy, lacquer and varnish?','How long should I wait between coats?','Which sheen should I use in kitchens, baths and trim?']],
 ['Spraying and equipment',['How do I clean an airless sprayer?','Why does my sprayer spit or leave tails?','What tip size should I use for latex on walls?','How do I store a sprayer for the winter?']],
 ['Safety',['What do I do about lead paint in a home built before 1978?','What respirator do I need for spraying oil-based paint?','How do I stay safe on ladders and scaffolds?','How do I handle and dispose of leftover paint and rags?']],
 ['Customers and business',['Write a short message asking a customer to approve my estimate','How do I handle a change order in the middle of a job?','How do I ask for a deposit politely?','How do I answer a customer who says my price is too high?']]];
function assistantCard(jobId){
 if(chatJob!==jobId||chat===null){chat=[];}chatJob=jobId;
 const es=(localStorage.getItem('as_lang')||window.PM_LANG)==='es';
 return `${jobId?'':'<h3>Job assistant</h3>'}<div class="card">
 <div style="display:flex;justify-content:space-between;gap:10px;align-items:end;flex-wrap:wrap"><label for="as_in" style="margin:0">${jobId?'Ask about this job, or any painting question':'Ask any painting or business question'}</label>
 <select id="as_lang" style="width:auto;padding:6px 8px" aria-label="Language"><option value="en" ${es?'':'selected'}>English</option><option value="es" ${es?'selected':''}>Español</option></select></div>
 <textarea id="as_in" rows="3" placeholder="Example: What primer should I use over water stains on a ceiling? Type your question, or tap the Mic button and speak it. Ask about bidding, safety, stains, coatings or equipment."></textarea>
 <div class="btns"><button class="btn" id="as_send">Quick answer</button>${jobId?'<button class="btn" id="as_quote" title="My own price for this job, the steps, and a check against your prices">Quote helper</button><button class="btn sec" id="as_detail" title="More explanation and options">Detailed</button><button class="btn sec" id="as_deep" title="A long step-by-step plan for tough problems">Deep step-by-step</button>':''}${jobId?'<label class="btn sec" style="cursor:pointer;margin:0" title="Take or attach a photo to ask about">Photo<input id="as_cam" type="file" accept="image/*" capture="environment" style="display:none"></label>':''}<button class="btn sec mic" id="as_mic" style="display:none" aria-label="Speak your question"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="9" y="2" width="6" height="12" rx="3"/><path d="M5 11a7 7 0 0014 0M12 18v4"/></svg>Mic</button></div>
 <div id="as_att" class="muted"></div>
 <div id="as_log"></div>
 ${jobId?`<div class="chips">${CHIPS_JOB.map(c=>`<button class="chip" data-chip="${esc(c)}">${esc(c)}</button>`).join('')}</div>`:''}
 <details class="chips2"><summary>Browse common questions by topic</summary>${QCATS.map(([t,qs])=>`<div class="cat"><b>${esc(t)}</b><div>${qs.map(q=>`<button class="chip" data-chip="${esc(q)}">${esc(q)}</button>`).join('')}</div></div>`).join('')}</details>
 <small class="muted">${jobId?'<b>Only you can see this chat.</b> It is saved on this job. ':''}Answers are suggestions: check numbers and safety rules before you rely on them. ${jobId?'Quote helper answers use your monthly Quote helper allowance (it builds its own price, so it is a good second opinion on your estimate). Detailed step-by-step answers use your monthly detailed answers. On a job, the assistant sees the estimate, documents and notes, but never the customer email, phone or street address. ':''}Each question uses one of your monthly assistant questions.</small></div>`;}
function chatDraw(){const l=$('as_log');if(!l)return;l.innerHTML=(chatJob&&chat.length?'<div style="text-align:right"><button class="mini" data-aclear="1">Clear this chat</button></div>':'')+chat.map((m,i)=>`<div class="bub ${m.role==='user'?'u':'a'}">${m.fileId?`<img src="/api/files?id=${m.fileId}" alt="" style="max-width:120px;max-height:90px;border-radius:6px;display:block;margin-bottom:6px">`:''}${esc(m.content)}${m.role==='assistant'&&m.mode!=='quick'?'<br><small class="muted">'+(m.mode==='deep'?'Deep step-by-step':m.mode==='quote'?'Quote helper':'Detailed')+'</small>':''}${m.role==='assistant'&&chatJob?`<br><button class="mini" data-asave="${i}">Save to job notes</button>`:''}</div>`).join('');l.scrollTop=l.scrollHeight;}
let chatFile=0;
function attDraw(){const a=$('as_att');if(a)a.innerHTML=chatFile?`<div style="display:flex;gap:10px;align-items:center;margin:6px 0"><img src="/api/files?id=${chatFile}" alt="The photo you attached" style="width:72px;height:72px;object-fit:cover;border-radius:8px;border:1px solid #cfd5dc"><span>Photo attached. It goes with your next question.</span><button class="mini" data-adetach="1">Remove</button></div>`:'';}
async function askNow(q,mode){const inp=$('as_in'),btn=$('as_send');q=(q||'').trim();if(!q&&mode==='quote')q=chatFile?'Give me a quote and a step by step plan for the work in this photo.':'Give me a quote and a step by step plan for this job.';if(!q&&chatFile)q='What do you see in this photo? Any possible issues I should check?';if(!q)return;btn.disabled=true;msg('');
 const hist=chat.slice(),fid=chatFile;chat.push({role:'user',content:q,fileId:fid||undefined});chatDraw();inp.value='';chatFile=0;attDraw();
 try{if(chatJob){const r=await api('/api/jobchat',{jobId:chatJob,message:q,mode:mode||'quick',language:($('as_lang')||{value:'en'}).value,fileId:fid||undefined});chat=r.messages;}else{const r=await api('/api/assistant',{jobId:chatJob,message:q,history:hist,language:($('as_lang')||{value:'en'}).value});chat.push({role:'assistant',content:r.reply});}}
 catch(e){if(e){chat.pop();msg(e.message);inp.value=q;chatFile=fid;attDraw();}}
 chatDraw();btn.disabled=false;}
document.addEventListener('click',async e=>{const t=e.target,ds=t.dataset||{};
 if(ds.chip){askNow(ds.chip);}
 else if(t.id==='as_send'){askNow($('as_in').value,'quick');}
 else if(t.id==='as_detail'){askNow($('as_in').value,'detailed');}
 else if(t.id==='as_deep'){askNow($('as_in').value,'deep');}
 else if(t.id==='as_quote'){askNow($('as_in').value,'quote');}
 else if(ds.aclear){if(!confirm('Clear this job chat? This cannot be undone.'))return;try{await api('/api/jobchat',{jobId:chatJob,action:'clear'});chat=[];chatDraw();}catch(x){if(x)msg(x.message);}}
 else if(ds.lost){const r=$('lost_reason').value;if(!r){msg('Choose why it was lost.');return;}try{await api('/api/joblost',{jobId:J.job.id,action:'lost',reason:r,note:$('lost_note').value});await detail(J.job.id);msg('Marked lost. It stays in your records.',true);}catch(x){if(x)msg(x.message);}}
 else if(ds.reopen){try{await api('/api/joblost',{jobId:J.job.id,action:'reopen'});await detail(J.job.id);msg('Reopened.',true);}catch(x){if(x)msg(x.message);}}
 else if(ds.asave!==undefined&&ds.asave!==''){try{await api('/api/jobnote',{jobId:chatJob,text:'Assistant note: '+chat[+ds.asave].content});t.textContent='Saved';t.disabled=true;}catch(x){if(x)msg(x.message);}}
 else if(t.closest&&t.closest('#as_mic')){micToggle($('as_mic'),()=>($('as_lang')||{value:'en'}).value==='es'?'es-US':'en-US',x=>{$('as_in').value=(($('as_in').value?$('as_in').value+' ':'')+x).trim();});}
});
document.addEventListener('change',e=>{if(e.target.id==='as_lang'){try{localStorage.setItem('as_lang',e.target.value);}catch(x){}}});
document.addEventListener('change',async e=>{if(e.target.id!=='as_cam'||!e.target.files[0])return;const f=e.target.files[0];e.target.value='';try{msg('Adding photo...',true);const b=await shrinkImg(f),fd=new FormData();fd.append('file',b);fd.append('jobId',chatJob);fd.append('kind','photo');const r=await fetch('/api/files',{method:'POST',body:fd});if(r.status===401){location.href='/login';return;}const j=await r.json().catch(()=>({}));if(!r.ok){msg(j.error||'Could not add the photo.');return;}chatFile=j.id;attDraw();msg('');if(typeof filesLoad==='function')filesLoad();$('as_in').focus();}catch(x){msg('Could not add the photo.');}});
document.addEventListener('click',e=>{const d=e.target.dataset||{};if(d.adetach){chatFile=0;attDraw();}else if(e.target.id==='ask_fab'||(e.target.closest&&e.target.closest('#ask_fab'))){if(typeof openAcc==='function')openAcc('help');const i=$('as_in');if(i){i.scrollIntoView({behavior:'smooth',block:'center'});setTimeout(()=>i.focus(),350);}}});
(function(){const b=document.createElement('button');b.id='ask_fab';b.className='btn fab';b.type='button';b.textContent='Ask';b.setAttribute('aria-label','Ask the assistant');document.body.appendChild(b);})();

// ---- Photos and files ----
let FL=null;
function filesCard(){return `<label style="margin-top:14px">Photos and files</label><div class="card" id="fl_card"><div id="fl_meter" class="muted">Loading...</div>
 <div class="btns"><label class="btn" style="cursor:pointer">Take or add photos<input id="fl_in" type="file" accept="image/*" multiple style="display:none"></label>
 </div>
 <small class="muted" style="display:block;margin-top:6px">Tap a photo's <b>Analyze</b> button to have the AI look for possible issues. Receipts go in <a href="/records?job=${J.job.id}">Records</a>, where they are read and filed as expenses.</small>
 <div id="fl_list" class="fgrid"></div><div id="fl_allow"></div><div id="fl_find"></div><small class="muted">Photos are shrunk on your phone before upload to save space. Your customer can also add photos from their portal link. You can download a photo any time.</small></div>`;}
function shrinkImg(f){return new Promise(res=>{if(!f.type.startsWith('image/')||f.type==='image/gif'){res(f);return;}const im=new Image();im.onload=()=>{const s=Math.min(1,1600/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*s);c.height=Math.round(im.height*s);c.getContext('2d').drawImage(im,0,0,c.width,c.height);c.toBlob(b=>res(b?new File([b],(f.name||'photo').replace(/\.\w+$/,'')+'.jpg',{type:'image/jpeg'}):f),'image/jpeg',0.82);};im.onerror=()=>res(f);im.src=URL.createObjectURL(f);});}
function meterHtml(st){if(!st)return '';const col=st.level==='ok'?'#0a7a3d':st.level==='warn'?'#E8A33D':'#b42318';
 return `<div style="display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap"><b>Storage</b><span>${st.percent}% used</span></div><div style="height:8px;border-radius:5px;background:#eceae4;margin:4px 0 6px"><div style="height:8px;border-radius:5px;width:${st.percent}%;background:${col}"></div></div>${st.message?`<div style="background:#fff8e6;border-left:4px solid #E8A33D;padding:8px 10px;border-radius:6px;margin-top:6px">${esc(st.message)}${st.upgrade?' <a href="/dashboard#billing"><b>See plans</b></a>':''}</div>`:''}`;}
async function filesLoad(){if(!$('fl_card'))return;try{FL=await api('/api/files?jobId='+J.job.id);$('fl_meter').innerHTML=meterHtml(FL.storage);
 if(!FL.enabled)$('fl_meter').innerHTML+='<div class="muted">File storage is not available yet.</div>';
 $('fl_list').innerHTML=FL.files.length?FL.files.map(f=>f.removed?`<div class="fi"><div class="muted" style="font-size:12px">${esc(f.name)}<br>removed from storage</div></div>`:`<div class="fi">${f.mime.startsWith('image/')?`<a href="/api/files?id=${f.id}" target="_blank"><img src="/api/files?id=${f.id}" alt="${esc(f.name)}" loading="lazy"></a>`:`<a href="/api/files?id=${f.id}" target="_blank">${esc(f.name)}</a>`}<div class="muted" style="font-size:12px">${esc(f.kind)}${f.by==='customer'?' &middot; from customer':''}</div>${f.mime.startsWith('image/')&&f.kind==='photo'?`<div data-fread="${f.id}"></div>`:''}<div>${f.mime.startsWith('image/')&&f.kind==='photo'?`<button class="btn sec" style="padding:6px 10px;font-size:13px" data-fopen="${f.id}">Analyze photo</button> `:''}<button class="mini" data-fldel="${f.id}">Delete</button></div></div>`).join(''):'<p class="muted">No photos or files yet.</p>';markRead();}catch(e){if(e)$('fl_meter').textContent='Could not load files.';}}
async function filesUpload(list,kind){for(const f of list){try{msg('Uploading '+(f.name||'file')+'...',true);const b=await shrinkImg(f),fd=new FormData();fd.append('file',b);fd.append('jobId',J.job.id);fd.append('kind',kind);const r=await fetch('/api/files',{method:'POST',body:fd});if(r.status===401){location.href='/login';return;}const j=await r.json().catch(()=>({}));if(!r.ok){msg(j.error||'Could not upload.');break;}}catch(e){msg('Could not upload.');break;}}msg('');await filesLoad();}
document.addEventListener('change',e=>{if(e.target.id==='fl_in'){filesUpload([...e.target.files],'photo');e.target.value='';}else if(e.target.id==='fl_doc'){filesUpload([...e.target.files],$('fl_kind').value);e.target.value='';}});
document.addEventListener('click',async e=>{const d=e.target.dataset||{};if(d.fldel){if(!confirm('Delete this file? This cannot be undone.'))return;try{await api('/api/files',{action:'delete',id:+d.fldel});await filesLoad();}catch(x){if(x)msg(x.message);}}});

// ---- Photo analysis ----
const $m=c=>'$'+Math.round(c/100).toLocaleString('en-US');
function allowHtml(a){if(!a)return '';return `<div class="muted" style="margin-top:6px">${esc(a.message)}${a.upgrade?' <a href="/dashboard#billing"><b>See plans</b></a>':''}</div>`;}
function findHtml(f,mode){const sev={low:'#0a7a3d',medium:'#8a5a00',high:'#b42318'};
 return `<div class="card" style="margin:10px 0" data-find="${f.id}">${f.fileId?`<img src="/api/files?id=${f.fileId}" alt="" style="float:right;width:64px;height:64px;object-fit:cover;border-radius:8px;margin:0 0 6px 8px">`:''}<b>${mode==='draft'?'Draft analysis (not saved yet)':'Approved findings'}</b>${f.summary?`<p style="margin:6px 0">${esc(f.summary)}</p>`:''}
 ${(f.seen||[]).length?`<div style="margin:6px 0;font-size:14px"><b>What the AI saw in this photo:</b> ${f.seen.map(x=>esc(x.item)+(x.condition?' ('+esc(x.condition)+')':'')).join('; ')}</div>`:''}
 ${(f.issues||[]).length?f.issues.map(i=>`<div style="border-top:1px solid #eee;padding:8px 0"><b>${esc(i.title)}</b> <span style="color:${sev[i.severity]};font-size:12px;font-weight:700;text-transform:uppercase">${esc(i.severity)}</span>
  <div>${esc(i.what)}</div><div><b>How to fix:</b> ${esc(i.fix)}</div><div class="muted"><b>Labor:</b> about ${esc(i.hours)} hr${i.materials&&i.materials.length?' &middot; <b>Materials:</b> '+i.materials.map(m=>esc(m.item)+' ($'+Math.round(m.costLow)+'-$'+Math.round(m.costHigh)+')').join(', '):''}</div>
  ${i.price?`<div><b>Rough cost to you:</b> ${$m(i.price.costLowCents)} to ${$m(i.price.costHighCents)} &middot; <b>Suggested charge:</b> ${$m(i.price.chargeLowCents)} to ${$m(i.price.chargeHighCents)}</div>`:'<div class="muted">Add your hourly rate in Estimating Setup to see a suggested charge.</div>'}</div>`).join(''):'<p class="muted">No clear issues found in this photo.</p>'}
 <small class="muted">Possible issues to check, not a diagnosis. Prices are rough: check them before you quote.</small>
 ${mode==='draft'?`<div class="btns"><button class="btn" data-fapprove="${f.id}">Approve and save to job</button><button class="btn sec" data-fwo="${f.id}">Approve and make a work order</button><button class="btn sec" data-fdiscard="${f.id}">Discard</button></div>`:`<div class="btns"><button class="btn sec" data-fwo="${f.id}">Make a work order from this</button></div>`}</div>`;}
let FDRAFTS={};
let FREAD=new Set();
const FOCUS=['walls','ceiling','trim and baseboards','windows','doors','floors','cabinets','siding and outside','fixtures and outlets'];
function markRead(){document.querySelectorAll('[data-fread]').forEach(el=>{const id=+el.dataset.fread,on=FREAD.has(id);el.innerHTML=on?'<span class="rdchip">&#10003; AI has read this photo</span>':'';const b=document.querySelector('[data-fopen="'+id+'"]');if(b)b.textContent=on?'Analyze again':'Analyze photo';});}
function askPanel(id){return `<div class="card" id="fl_ask" style="margin:10px 0"><b>Before the AI looks</b><img src="/api/files?id=${id}" alt="" style="float:right;width:64px;height:64px;object-fit:cover;border-radius:8px;margin-left:8px">
 <p style="margin:6px 0">What should it look at closely? Tick any that matter. The AI checks the whole photo either way, but this helps it notice windows, doors and trim, not only walls.</p>
 <div>${FOCUS.map(x=>`<label class="fch"><input type="checkbox" data-focus="${x}"> ${x}</label>`).join('')}</div>
 <label for="fl_note">What should I know about this photo? (optional)</label><textarea id="fl_note" rows="2" placeholder="Example: guest bedroom, the window leaked last spring."></textarea>
 <div class="btns"><button class="btn" data-fanalyze="${id}">Analyze this photo</button><button class="btn sec" data-fcancel="1">Cancel</button></div>
 <small class="muted">Tip: photos from different angles (each wall, the windows, the doors, the ceiling) give the best results. Photos that look alike get similar answers.</small></div>`;}
async function findingsLoad(){const box=$('fl_find');if(!box)return;try{const r=await api('/api/photoanalysis?jobId='+J.job.id);$('fl_allow').innerHTML=allowHtml(r.allowance);FREAD=new Set(r.findings.map(f=>f.fileId));box.innerHTML=r.findings.map(f=>{if(f.status!=='approved')FDRAFTS[f.id]=f;return findHtml(f,f.status==='approved'?'saved':'draft');}).join('');markRead();}catch(e){}}
document.addEventListener('click',async e=>{const d=e.target.dataset||{};
 if(d.fopen){const o=$('fl_ask');if(o)o.remove();$('fl_find').insertAdjacentHTML('afterbegin',askPanel(+d.fopen));$('fl_ask').scrollIntoView({behavior:'smooth',block:'center'});}
 else if(d.fcancel){const o=$('fl_ask');if(o)o.remove();}
 else if(d.fanalyze){const ask=$('fl_ask'),focus=ask?[...ask.querySelectorAll('[data-focus]:checked')].map(x=>x.dataset.focus):[],note=ask&&$('fl_note')?$('fl_note').value.trim():'';
  if(ask)ask.remove();
  const old=$('fl_busy');if(old)old.remove();
  $('fl_find').insertAdjacentHTML('afterbegin','<div id="fl_busy" class="note" style="margin:10px 0;background:#fff8e6;border-left:4px solid #E8A33D;padding:8px 10px;border-radius:6px">Looking at your photo. This usually takes 10 to 20 seconds. Please keep this page open.</div>');
  $('fl_busy').scrollIntoView({behavior:'smooth',block:'center'});
  try{const r=await api('/api/photoanalysis',{action:'analyze',fileId:+d.fanalyze,focus,note,language:window.PM_LANG==='es'?'es':'en'});$('fl_busy').remove();FDRAFTS[r.id]=r;FREAD.add(+d.fanalyze);markRead();$('fl_find').insertAdjacentHTML('afterbegin',findHtml(r,'draft'));$('fl_allow').innerHTML=allowHtml(r.allowance);}
  catch(x){if(x){const b=$('fl_busy');if(b){b.style.borderLeftColor='#b42318';b.innerHTML='<b style="color:#b42318">'+esc(x.message)+'</b><div class="muted">Nothing was used from your allowance.'+(x.detail?' Technical note: '+esc(x.detail):'')+'</div>';}if(x.allowance)$('fl_allow').innerHTML=allowHtml(x.allowance);}else{const b=$('fl_busy');if(b)b.remove();}}}
 else if(d.fapprove||d.fwo){const id=+(d.fapprove||d.fwo);try{const r=await api('/api/photoanalysis',{action:'approve',id});msg(r.allowance.message,true);const dr=FDRAFTS[id];if(d.fwo&&typeof woFromFinding==='function'){woFromFinding(dr||{id,issues:[]});}await findingsLoad();document.querySelectorAll('[data-find="'+id+'"]').forEach(x=>{if(x.querySelector('[data-fapprove]'))x.remove();});}catch(x){if(x)msg(x.message);}}
 else if(d.fdiscard){try{await api('/api/photoanalysis',{action:'discard',id:+d.fdiscard});document.querySelectorAll('[data-find="'+d.fdiscard+'"]').forEach(x=>x.remove());}catch(x){if(x)msg(x.message);}}
});

// ---- Work orders and change orders ----
let WOS=[],WOE=null;
function woCard(){return `<div class="card" id="wo_card"><div id="wo_list" class="muted">Loading...</div><div id="wo_form"></div><div class="btns"><button class="btn sec" data-wonew="work_order">New work order</button><button class="btn sec" data-wonew="change_order">New change order</button></div><small class="muted">A change order is for extra work after the estimate was approved. Your customer approves it on a private page, or you can print it. Approved change orders add to the job total.</small></div>`;}
function woMoney(c){return '$'+(c/100).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});}
async function woLoad(){const b=$('wo_list');if(!b)return;try{const r=await api('/api/workorders?jobId='+J.job.id);WOS=r.workOrders;
 b.innerHTML=(WOS.length?WOS.map(w=>`<div style="border-top:1px solid #eee;padding:8px 0"><b>${esc(w.label)}</b> ${esc(w.title)} <span class="tag">${esc(w.status)}</span> &middot; ${woMoney(w.totalCents)}${w.decidedBy?' &middot; '+esc(w.decidedBy):''}
 <div class="btns"><button class="mini" data-woedit="${w.id}">${w.status==='approved'||w.status==='declined'?'View':'Edit'}</button> <a class="mini" href="/api/workorders?id=${w.id}&print=1" target="_blank">Print</a>${w.status==='draft'?` <button class="mini" data-wosend="${w.id}" data-via="email">Email to customer</button> <button class="mini" data-wosend="${w.id}" data-via="link">Get link</button> <button class="mini" data-wodel="${w.id}">Delete</button>`:''}${w.link&&w.status==='sent'?` <button class="mini" data-wocopy="${esc(w.link)}">Copy link</button> <button class="mini" data-wosend="${w.id}" data-via="email">Email again</button>`:''}</div></div>`).join(''):'<p class="muted">None yet.</p>')+(r.approvedCents?`<p><b>Approved change orders: ${woMoney(r.approvedCents)}</b> added to this job.</p>`:'');}catch(e){}}
function woLineRow(l){l=l||{};return `<div class="row wo_l" style="align-items:end"><div style="flex:3"><label>Description</label><input class="wo_d" maxlength="160" value="${esc(l.description||'')}"></div><div><label>Qty</label><input class="wo_q" inputmode="decimal" value="${l.qty!=null?l.qty:1}"></div><div><label>Price each ($)</label><input class="wo_u" inputmode="decimal" value="${l.unitCents!=null?(l.unitCents/100):''}"></div></div>`;}
function woForm(w){WOE=w;const f=$('wo_form');if(!f)return;const locked=w.status==='approved'||w.status==='declined';
 f.innerHTML=`<div class="card" style="background:#fbfaf7"><b>${w.id?esc(w.label||''):'New '+(w.kind==='change_order'?'change order':'work order')}</b>${locked?'<p class="muted">This was already answered, so it is read only.</p>':''}
 <label>Title</label><input id="wo_t" maxlength="120" value="${esc(w.title||'')}" placeholder="Example: Repair and repaint rotted fascia">
 <label>Why is this needed?</label><textarea id="wo_r" rows="2" maxlength="1200">${esc(w.reason||'')}</textarea>
 <label>What will be done</label><textarea id="wo_s" rows="3" maxlength="3000">${esc(w.scope||'')}</textarea>
 <div id="wo_lines">${(w.lines&&w.lines.length?w.lines:[{}]).map(woLineRow).join('')}</div>
 <div class="btns"><button class="mini" data-woaddline="1">+ Add a line</button></div>
 <div class="row"><div><label>Extra days</label><input id="wo_days" inputmode="numeric" value="${w.daysAdded||0}"></div><div><label>Customer language</label><select id="wo_lang"><option value="en"${w.language==='es'?'':' selected'}>English</option><option value="es"${w.language==='es'?' selected':''}>Español</option></select></div></div>
 <div class="btns">${locked?'':'<button class="btn" data-wosave="1">Save</button> '}<button class="btn sec" data-woclose="1">Close</button></div></div>`;
 f.scrollIntoView({behavior:'smooth',block:'nearest'});}
function woRead(){const lines=[...document.querySelectorAll('.wo_l')].map(r=>({description:r.querySelector('.wo_d').value.trim(),qty:Number(r.querySelector('.wo_q').value)||0,unitCents:Math.round((Number(String(r.querySelector('.wo_u').value).replace(/[$,]/g,''))||0)*100)})).filter(l=>l.description&&l.qty>0);
 return {title:$('wo_t').value.trim(),reason:$('wo_r').value.trim(),scope:$('wo_s').value.trim(),lines,daysAdded:Number($('wo_days').value)||0,language:$('wo_lang').value};}
function woFromFinding(dr){const iss=(dr&&dr.issues)||[];if(!$('wo_card')){msg('Saved. Open Work orders to use it.',true);return;}
 const lines=iss.filter(i=>i.price).map(i=>({description:i.title+': '+(i.fix||'').slice(0,100),qty:1,unitCents:Math.round((i.price.chargeLowCents+i.price.chargeHighCents)/2/100)*100}));
 woForm({kind:'work_order',title:iss[0]?iss[0].title:'Repair work',reason:(dr&&dr.summary)||'',scope:iss.map(i=>i.title+': '+(i.fix||'')).join('\n'),lines,daysAdded:0,language:window.PM_LANG==='es'?'es':'en'});
 msg('Work order started from the photo findings. Check the prices, then save.',true);}
document.addEventListener('click',async e=>{const d=e.target.dataset||{};
 if(d.wonew){woForm({kind:d.wonew,language:window.PM_LANG==='es'?'es':'en'});}
 else if(d.woedit){const w=WOS.find(x=>x.id===+d.woedit);if(w)woForm(w);}
 else if(d.woclose){$('wo_form').innerHTML='';WOE=null;}
 else if(d.woaddline){$('wo_lines').insertAdjacentHTML('beforeend',woLineRow());}
 else if(d.wosave){try{const b=woRead();const r=await api('/api/workorders',Object.assign({action:'save',id:WOE&&WOE.id,jobId:J.job.id,kind:WOE&&WOE.kind},b));msg('Saved.',true);$('wo_form').innerHTML='';WOE=null;await woLoad();}catch(x){if(x)msg(x.message);}}
 else if(d.wosend){try{const r=await api('/api/workorders',{action:'send',id:+d.wosend,via:d.via});if(d.via==='email')msg(r.emailed?'Emailed to your customer.':'Marked sent, but the email did not go out. Copy the link instead.',r.emailed);else{try{await navigator.clipboard.writeText(r.link);msg('Link copied. Send it to your customer.',true);}catch(x){prompt('Copy this link',r.link);}}await woLoad();}catch(x){if(x)msg(x.message);}}
 else if(d.wocopy){try{await navigator.clipboard.writeText(d.wocopy);msg('Link copied.',true);}catch(x){prompt('Copy this link',d.wocopy);}}
 else if(d.wodel){if(!confirm('Delete this draft?'))return;try{await api('/api/workorders',{action:'delete',id:+d.wodel});await woLoad();}catch(x){if(x)msg(x.message);}}
});

// ---- Job costs (expenses and mileage) ----
// ---- Payments from the customer (deposit, progress, final). Records only: we never store bank or card numbers. ----
const PMETH={cash:'Cash',check:'Check',zelle:'Zelle',cash_app:'CashApp',venmo:'Venmo',paypal:'PayPal',bank_deposit:'Bank deposit (ACH or wire)',card_outside:'Card (taken outside PaintersMax)',other:'Other'};
const PKIND={deposit:'Deposit',progress:'Progress payment',final:'Final payment',other:'Payment'};
const dtf=s=>(window.pmDate?window.pmDate(s):s);
let PAY=null,PAYE=null;
function payCard(){return `<div class="card" id="pay_card"><div id="pay_body" class="muted">Loading...</div></div>`;}
async function payLoad(){const b=$('pay_body');if(!b)return;try{PAY=await api('/api/jobpay?jobId='+J.job.id);payDraw();}catch(e){}}
function payForm(p){const m=PAY.methods.map(k=>`<option value="${k}" ${p.method===k?'selected':''}>${PMETH[k]||k}</option>`).join('');const kd=Object.keys(PKIND).map(k=>`<option value="${k}" ${p.kind===k?'selected':''}>${PKIND[k]}</option>`).join('');
 return `<div style="border:1px solid #cfd5dc;border-radius:8px;padding:10px;margin:10px 0;background:#faf9f6"><b>${p.id?'Change this payment':'Record a payment'}</b>
 <div class="row"><div><label>Amount ($)</label><input id="py_amt" inputmode="decimal" value="${esc(p.amount||'')}"></div><div><label>Date it was paid</label><input id="py_on" type="date" value="${esc(p.on||PAY.today)}"></div></div>
 <div class="row"><div><label>How did they pay?</label><select id="py_method">${m}</select></div><div><label>What was it for?</label><select id="py_kind">${kd}</select></div></div>
 <label>Check number, or last 4 digits <small class="muted">(optional)</small></label><input id="py_ref" value="${esc(p.ref||'')}" placeholder="Example: 1042">
 <label>Note <small class="muted">(optional)</small></label><input id="py_note" value="${esc(p.note||'')}" placeholder="Example: paid at the door">
 <small class="muted">Please never type a full bank or card number here. PaintersMax does not store them.</small>
 <div class="btns"><button class="btn" data-pysave="${esc(p.id||'')}">${p.id?'Save changes':'Save payment'}</button><button class="btn sec" data-pycancel="1">Cancel</button></div></div>`;}
function payDraw(){const b=$('pay_body');if(!b||!PAY)return;const P=PAY,f=c=>$$(c);const as=$('accs_pay');if(as)as.textContent=P.totalCents>0?(P.paidInFull?'Paid in full':(P.paidCents?f(P.paidCents)+' paid, '+f(P.balanceCents)+' to go':'Nothing paid yet')):'';
 const status=P.totalCents>0?(P.paidInFull?`<b style="color:#0a7a3d">Paid in full</b>${P.overpaidCents?` <span class="muted">(${f(P.overpaidCents)} more than the total. Check the amounts.)</span>`:''}`:`Balance due <b>${f(P.balanceCents)}</b>`):'<span class="muted">Save an estimate to see what is owed.</span>';
 let guide='';
 if(!P.payments.length&&P.totalCents>0)guide=P.depositCents>0?`<p style="margin:0 0 8px">${P.signed?'The customer signed.':'When the customer says yes,'} your deposit is <b>${f(P.depositCents)}</b>. When it arrives, record it here and I will keep track. Then add the job to the <a href="/calendar">calendar</a>.</p><div class="btns" style="margin:0 0 8px"><button class="btn" data-pydep="1">Record the ${f(P.depositCents)} deposit</button></div>`:`<p style="margin:0 0 8px">Nothing paid yet. When the customer pays you, record it here so your balance stays right.</p>`;
 else if(P.payments.length&&!P.paidInFull&&P.balanceCents>0&&!PAYE)guide='';
 const rows=P.payments.map(p=>`<div style="display:flex;justify-content:space-between;gap:10px;border-top:1px solid #eee;padding:8px 0;flex-wrap:wrap"><div><b>${f(p.cents)}</b> <span class="tag">${esc(PKIND[p.kind]||'Payment')}</span><br><small class="muted">${esc(dtf(p.on))} &middot; ${esc(PMETH[p.method]||p.method)}${p.ref?' &middot; '+esc(p.ref):''}${p.note?' &middot; '+esc(p.note):''}</small></div><div class="btns" style="margin:0"><button class="mini" data-pyedit="${esc(p.id)}">Edit</button> <button class="mini" data-pydel="${esc(p.id)}">Delete</button></div></div>`).join('');
 b.innerHTML=`<div style="display:flex;gap:14px;flex-wrap:wrap;align-items:baseline"><span>Job total <b>${f(P.totalCents)}</b>${P.changeOrderCents?`<small class="muted"> (estimate ${f(P.estimateCents)} plus approved changes ${f(P.changeOrderCents)})</small>`:''}</span><span>Paid <b>${f(P.paidCents)}</b></span><span>${status}</span></div>
 ${guide}${rows}${PAYE?payForm(PAYE):`<div class="btns"><button class="btn sec" data-pynew="1">+ Record a payment</button></div>`}
 <details style="margin-top:10px"><summary><b>How to pay me</b> <small class="muted">(prints on your invoices)</small></summary>
  <p class="muted" style="margin:6px 0">Tell customers how to pay you. Example: "Zelle to 555-123-4567. CashApp $TylerPainters. Checks payable to Tyler Painters, 123 Main St." You decide what goes here. PaintersMax never asks for or stores bank account numbers.</p>
  <textarea id="py_how" rows="3">${esc(P.howToPay||'')}</textarea><div class="btns"><button class="btn sec" data-pyhow="1">Save</button></div></details>`;}
document.addEventListener('click',async e=>{const t=e.target,ds=t.dataset||{};if(!J||!PAY)return;
 const call=async body=>{try{msg('');PAY=await api('/api/jobpay',{jobId:J.job.id,...body});PAYE=null;payDraw();return true;}catch(x){if(x)msg(x.message);return false;}};
 if(ds.pynew){PAYE={method:'check',kind:PAY.payments.length?'progress':'deposit'};payDraw();}
 else if(ds.pydep){PAYE={method:'check',kind:'deposit',amount:(PAY.depositCents/100).toFixed(2)};payDraw();}
 else if(ds.pycancel){PAYE=null;payDraw();}
 else if(ds.pyedit){const p=PAY.payments.find(x=>x.id===ds.pyedit);if(p){PAYE={...p,amount:(p.cents/100).toFixed(2)};payDraw();}}
 else if(t.hasAttribute&&t.hasAttribute('data-pysave')){const id=ds.pysave;const body={action:id?'update':'add',id:id||undefined,amount:$('py_amt').value,on:$('py_on').value,method:$('py_method').value,kind:$('py_kind').value,ref:$('py_ref').value,note:$('py_note').value};if(await call(body))msg(id?'Payment changed.':'Payment saved. Your balance is updated.',true);}
 else if(ds.pydel){if(!confirm('Delete this payment? Your balance will change.'))return;if(await call({action:'delete',id:ds.pydel}))msg('Deleted.',true);}
 else if(ds.pyhow){try{msg('');const r=await api('/api/jobpay',{action:'saveHowToPay',text:$('py_how').value});PAY.howToPay=r.howToPay;msg('Saved. It will print on your invoices.',true);}catch(x){if(x)msg(x.message);}}
});


// ---- Warranty certificate ----
let WC=null;
function wcCard(){return `<h3 style="font-size:15px;margin:18px 0 6px">Warranty certificate</h3><div class="card" id="wc_card"><div id="wc_body" class="muted">Loading...</div></div>`;}
async function wcLoad(){const b=$('wc_body');if(!b)return;try{WC=await api('/api/warranty?jobId='+J.job.id);wcDraw();}catch(e){}}

// Mic that stays on until you tap it again. Browsers end a listening session after a short pause (about 5 to 10 seconds on a phone),
// so we start a fresh one right away while the button is on. Only finished phrases are added to the box.
const MIC={};
function micLabel(b,on){const t=b.lastChild;if(t&&t.nodeType===3)t.textContent=on?(window.PM_LANG==='es'?'Escuchando. Toca para parar':'Listening. Tap to stop'):(window.pmT?window.pmT('Mic'):'Mic');b.classList.toggle('on',on);b.setAttribute('aria-pressed',on?'true':'false');}
function micToggle(b,lang,onText){
  const R=window.SpeechRecognition||window.webkitSpeechRecognition;if(!R||!b)return;
  if(MIC[b.id]){MIC[b.id].stop();return;}
  const st={want:true,r:null,bad:0,t:0,stop(){st.want=false;try{st.r&&st.r.stop();}catch(e){}delete MIC[b.id];micLabel(b,false);}};
  MIC[b.id]=st;micLabel(b,true);
  const begin=()=>{
    if(!st.want)return;
    const r=new R();st.r=r;r.lang=lang();r.continuous=true;r.interimResults=false;
    st.t=Date.now();
    r.onresult=ev=>{st.bad=0;for(let i=ev.resultIndex;i<ev.results.length;i++){if(ev.results[i].isFinal){const x=(ev.results[i][0].transcript||'').trim();if(x)onText(x);}}};
    r.onerror=ev=>{if(ev.error==='not-allowed'||ev.error==='service-not-allowed'){st.stop();msg(window.PM_LANG==='es'?'El micrófono está bloqueado. Permítelo en la configuración del navegador.':'The microphone is blocked. Allow it in your browser settings.');}};
    r.onend=()=>{if(!st.want)return;if(Date.now()-st.t<800){if(++st.bad>=4){st.stop();return;}}setTimeout(begin,250);};
    try{r.start();}catch(e){setTimeout(begin,400);}
  };
  begin();
}

function qtyFields(rc){
  if(!rc)return[];
  const out=[...(BASE[rc.method]||[])];
  for(const k of Object.keys(rc.data||{})){const L=(rc.labels&&rc.labels[k])?rc.labels[k].label+' ('+rc.labels[k].unit+')':QL[k];if(k.endsWith('_pct')||!L)continue;if(typeof rc.data[k]==='number'&&rc.data[k]>0)out.push([k,L]);}
  return out;
}
function totals(){
  const sub=lines.reduce((s,l)=>s+Math.round((+l.qty||0)*(+l.unitPrice||0)*100),0);
  const disc=Math.min(Math.round((+$('discount').value||0)*100),sub);
  const tax=Math.round((sub-disc)*(+$('tax').value||0)/100);
  return{sub,disc,tax,total:sub-disc+tax};
}

 `<div class="btns"><button class="btn sec" data-cadd="1">+ Add a cost</button></div><div class="row"><div><label>Markup for overhead, contingency and profit (%)</label><input id="c_mk" inputmode="decimal" value="${esc(cost.markupPct||'')}"></div><div class="tot" style="align-self:end" id="c_out"></div></div>
 <div class="btns"><button class="btn sec" data-cuse="1">Use as project total line</button></div>`;costOut();}
document.addEventListener('input',e=>{const t=e.target,ds=t.dataset||{};
 if(ds.sf){sched[+ds.si][ds.sf]=t.value;schedNote();}
 else if(ds.cf2){cost.items[+ds.ci2][ds.cf2]=t.value;costOut();}
 else if(t.id==='c_mk'){cost.markupPct=t.value;costOut();}
 else if(t.id==='discount'||t.id==='tax')drawSched();});
document.addEventListener('click',e=>{const t=e.target,ds=t.dataset||{};
 if(ds.pre){if(ds.pre==='clear')sched=[];else{const names=['Deposit at signing','Posts set and rails installed','Work substantially complete','Final payment after punch list'];const p=ds.pre.split(',').map(Number);sched=p.map((v,i)=>({label:p.length===2?(i?'Final payment on completion':'Deposit at signing'):names[i],pct:v}));}drawSched();}
 else if(ds.sadd){sched.push({label:'',pct:0});drawSched();}
 else if(ds.sdel!==undefined&&ds.sdel!==''){sched.splice(+ds.sdel,1);drawSched();}
 else if(ds.cadd){cost.items.push({label:'',amount:0});drawCost();}
 else if(ds.cdel!==undefined&&ds.cdel!==''){cost.items.splice(+ds.cdel,1);drawCost();}
 else if(ds.cuse){const x=costTotal();if(x.total<=0){msg('Add your costs first.');return;}lines=lines.filter(l=>l.description!=='Project total');lines.push({description:'Project total',qty:1,unit:'lump sum',unitPrice:x.total});drawLines();msg('Added a Project total line.',true);}
});

const SIGST={pending:'Waiting for signature',signed:'Signed',void:'Cancelled',expired:'Expired'};
async function sigLoad(jobId,est,ctr){
 let reqs=[];try{reqs=(await api('/api/esign?jobId='+jobId)).requests;}catch(x){return;}
 [['estimate',est],['contract',ctr]].forEach(([k,doc])=>{const el=$('sig_'+k);if(!el||!doc)return;
  const mine=reqs.filter(r=>r.kind===k&&r.documentId===doc.id);
  el.innerHTML='<div class="btns" style="margin-top:8px"><button class="btn sec" data-sigsend="'+doc.id+'">Send for e-signature</button></div>'+
   '<small>The customer gets a private link, signs on their phone, and you both get the signed copy by email. Save any changes first.</small>'+
   mine.map(r=>'<div class="ev"><b>'+esc(SIGST[r.status]||r.status)+'</b> &middot; '+esc(r.signerName)+' ('+esc(r.signerEmail)+') &middot; '+esc(dtf(String(r.signedAt||r.createdAt||'').slice(0,10)))+
    (r.status==='signed'?' <a href="/api/esign/record?id='+r.id+'" target="_blank">Open signed copy</a> &middot; <a href="/api/esign/record?id='+r.id+'&format=pdf" target="_blank">PDF</a>':'')+
    (r.status==='pending'?' <button class="btn sec" data-sigvoid="'+r.id+'" style="padding:2px 8px">Cancel</button>':'')+'</div>').join('');});
}
document.addEventListener('click',async e=>{const ds=e.target.dataset||{};
 if(ds.sigsend){const to=prompt('Send for signature to which email? (leave as is for the customer)',(J&&J.job&&J.job.customerEmail)||'');if(to===null)return;
  try{msg('');const r=await api('/api/esign',{action:'send',docId:+ds.sigsend,signerEmail:to});await detail(J.job.id);msg(r.emailed?'Sent for signature.':'Created, but the email could not be sent. Copy this link: '+r.link,r.emailed);}catch(x){if(x)msg(x.message);}}
 else if(ds.sigvoid){if(!confirm('Cancel this signature request? The link stops working.'))return;try{await api('/api/esign',{action:'void',id:+ds.sigvoid});await detail(J.job.id);msg('Cancelled.',true);}catch(x){if(x)msg(x.message);}}
});

function nextStep(d){const j=d.job,e=d.estimate,st=j.stage;const nm=String(j.customerName||'the customer').split(/\s+/)[0];let t='';
 if(st==='lead')t=e?`You started an estimate. Review it, then send it to ${nm}.`:`This is a new lead. Tell me about the job below, then tap Create estimate.`;
 else if(st==='bid')t=e&&e.status==='sent'?`Estimate sent. Waiting for ${nm} to approve it. A friendly call or text often helps.`:`Your estimate is saved. Send it to ${nm} when it looks right.`;
 else if(st==='contract')t=`Contract stage. Record the deposit when it arrives, then add the job to the calendar.`;
 else if(st==='scheduled')t=`Scheduled. Record the deposit if you have not, and make crew instructions and a materials list.`;
 else if(st==='in_progress')t=`Work in progress. If ${nm} asks for something extra, make a change order so the price stays right.`;
 else if(st==='punch')t=`Final walkthrough. Finish the punch list, then build the invoice.`;
 else if(st==='invoiced')t=`Invoice sent. Record payments as they come in. When it is paid the job closes, and you can send the warranty.`;
 else if(st==='closed')t=`This job is done. Send the warranty certificate and save what you learned.`;
 return t?`<div class="next"><b>Next:</b> ${esc(t)}</div>`:'';}

function bfDraw(){if(!BF||!J)return;const T_=J.jobTypes||[];const def=T_.find(t=>t.id===BF.type)||T_[0];if(!def||!$('bf_types'))return;
 $('bf_types').innerHTML=T_.map(t=>`<button type="button" class="jt ${t.id===BF.type?'on':''}" data-jt="${t.id}" title="${esc(t.hint)}">${esc(t.label)}</button>`).join('');
 $('bf_q').innerHTML=`<small class="muted" style="display:block;margin-top:8px">${esc(def.hint)}. Tap what fits. Skip anything you do not know.</small>`+def.questions.map(q=>{const v=BF.answers[q.id];let h=`<label>${esc(q.label)}${q.help&&window.pmHelp?window.pmHelp(q.help):''}</label>`;

 if(r.needsPriceCount)h+=L(`${r.needsPriceCount} ${r.needsPriceCount===1?'line needs':'lines need'} your price (marked in orange). I never guess your prices.`);

function checkInfo(title,extra,go){return new Promise(res=>{const j=J.job;
 const rows=[['Customer',j.customerName],['Email',j.customerEmail||'(none)'],['Phone',j.customerPhone||'(none)'],['Address',[j.address,j.city,j.zip].filter(Boolean).join(', ')||'(none)'],['Job',j.title]].concat(extra||[]);
 const w=document.createElement('div');w.className='modal';
 w.innerHTML=`<div class="mbox" role="dialog" aria-modal="true" aria-label="Check the information"><b style="font-size:17px">${esc(title)}</b><p class="muted" style="margin:4px 0 10px">Take a quick look. This is what the customer will see, and it is hard to take back once it goes out.</p>${rows.map(([a,b])=>`<div class="mrow"><span>${esc(a)}</span><b>${esc(b)}</b></div>`).join('')}<div class="btns"><button class="btn" data-ok="1">${esc(go||'Looks right, send it')}</button><button class="btn sec" data-fix="1">Fix something</button></div></div>`;
 const done=v=>{document.removeEventListener('keydown',key);w.remove();res(v);if(!v){window.scrollTo({top:0,behavior:'smooth'});dtOpen();}};
 const key=e=>{if(e.key==='Escape')done(false);};

async function detail(id){

   <label style="margin-top:0">Scope of work (what the customer gets)</label><textarea id="scope" rows="4" placeholder="Tap Create estimate above and I will write this for you, or type your own.">${esc(est.scope||'')}</textarea>

    <div class="row">${qf.map(([k,l])=>`<div><label>${esc(l)}</label><input data-q="${esc(k)}" inputmode="decimal"></div>`).join('')}</div>
    <div class="btns"><button class="btn sec" id="fill">Fill lines from my prices</button></div>`:`<p class="muted">You have not set prices for this type of work yet. <a href="/app">Open Estimating Setup</a> (Your prices), or add lines by hand.</p>`}</div></details>
   <div class="tot" id="tot"></div>

});
document.addEventListener('input',e=>{const t=e.target,ds=t.dataset||{};if(ds.dk&&ds.df){const d=docs[ds.dk];if(!d)return;if(ds.di!==undefined)d.items[+ds.di][ds.df]=ds.df==='qty'?(Number(t.value)||0):t.value;else d[ds.df]=t.value;}});
document.addEventListener('input',e=>{const t=e.target;if(t.dataset&&t.dataset.ci!==undefined){clauses[+t.dataset.ci][t.dataset.cf]=t.value;return;}if(t.dataset&&t.dataset.f!==undefined){lines[+t.dataset.i][t.dataset.f]=t.value;drawTotals();}else if(t.id==='discount'||t.id==='tax')drawTotals();});
document.addEventListener('click',e=>{const d=e.target.dataset&&e.target.dataset.del;if(d!==undefined&&d!==''){lines.splice(+d,1);drawLines();}});
(async()=>{try{const id=new URLSearchParams(location.search).get('id');id?await detail(id):await list();}catch(e){if(e)$('view').innerHTML='<p class="bad">'+esc(e.message||'Could not load.')+'</p>';}})();
</script><script src="/nav.js"></script></body></html>
