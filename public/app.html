<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0F1B2D">
<title>PaintersMax Estimating Setup</title><script src="/i18n.js" data-app></script>
<style>
*{box-sizing:border-box}
body{font-family:Inter,system-ui,sans-serif;background:#F7F5F1;color:#0F1B2D;margin:0}
header{background:#0F1B2D;color:#fff;padding:14px 16px;display:flex;justify-content:space-between;align-items:center;gap:8px}
header b{font-family:Newsreader,Georgia,serif;font-size:19px;font-weight:500}
header a{color:#E8A33D;font-size:14px;text-decoration:none}
main{max-width:640px;margin:0 auto;padding:16px 16px 96px}
.steps{display:flex;gap:6px;overflow-x:auto;margin:4px 0 6px;padding-bottom:4px;-webkit-overflow-scrolling:touch}
.steps button{flex:0 0 auto;padding:8px 12px;border-radius:999px;border:1px solid #cfd5dc;background:#fff;color:#0F1B2D;font:inherit;font-size:13px;font-weight:600;cursor:pointer;white-space:nowrap}
.steps button.done{border-color:#0a7a3d}.steps button.done::before{content:"\2713 ";color:#0a7a3d}
.steps button.cur{background:#0F1B2D;color:#fff;border-color:#0F1B2D}.steps button.cur::before{color:#E8A33D}
.prog{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:#4A5568;margin:0 0 14px;gap:8px;flex-wrap:wrap}
.prog a{color:#0F1B2D;font-weight:600}
.edit{font-size:13px;color:#0F1B2D;font-weight:600;margin-left:6px}
.seg{display:flex;gap:6px;margin:8px 0}.seg button{flex:1;padding:10px 6px;border-radius:8px;border:1px solid #cfd5dc;background:#fff;font:inherit;font-weight:700;cursor:pointer;color:#0F1B2D}
.seg button.on{background:#0F1B2D;color:#fff;border-color:#0F1B2D}
.poshelp{font-size:13px;color:#4A5568;margin:0 0 8px}
details.grp{border:1px solid #e3e0d8;border-radius:8px;margin:8px 0;background:#fcfbf8}
details.grp>summary{cursor:pointer;padding:10px 12px;font-weight:700;font-size:14px}
.it{display:grid;grid-template-columns:1fr 104px;gap:4px 10px;align-items:center;padding:8px 12px;border-top:1px solid #eee}
.it .il small{display:block}.it .ir{grid-column:1/3;font-size:12px;color:#4A5568}.it .sn{color:#8a5a00}
.it input{padding:9px}
.ex{background:#eef3fa;border-radius:8px;padding:10px 12px;font-size:14px;margin:10px 0}
.link{background:none;border:0;padding:0;color:#0F1B2D;font:inherit;font-weight:700;text-decoration:underline;cursor:pointer}
#modal{display:none;position:fixed;inset:0;background:rgba(15,27,45,.55);z-index:30;align-items:flex-start;justify-content:center;padding:20px 12px;overflow:auto}
#modal .box{background:#fff;border-radius:12px;max-width:560px;width:100%;padding:18px 18px 22px;line-height:1.5}
#modal h3{font-family:Newsreader,Georgia,serif;font-weight:500;font-size:22px;margin:0 0 6px}#modal h4{margin:14px 0 2px;font-size:15px}
#modal p{margin:4px 0}
.done-card{background:#eaf6ee;border:1px solid #b7dfc3;border-radius:10px;padding:16px;margin:0 0 14px}
h2{font-family:Newsreader,Georgia,serif;font-weight:500;margin:0 0 4px;font-size:26px}
p.lead{color:#4A5568;margin:0 0 16px}
.coach{background:#fff8e6;border-left:4px solid #E8A33D;border-radius:6px;padding:10px 12px;margin:0 0 14px;font-size:14px}
.card{background:#fff;border:1px solid rgba(15,27,45,.1);border-radius:10px;padding:16px;margin:0 0 14px}
label{display:block;font-size:14px;font-weight:600;margin:12px 0 4px}
input,select,textarea{width:100%;padding:12px;border:1px solid #cfd5dc;border-radius:8px;font:inherit;background:#fff}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.chk{display:flex;align-items:center;gap:10px;padding:10px 12px;border:1px solid #cfd5dc;border-radius:8px;margin:6px 0;font-weight:500}
.chk input{width:auto}
.help{display:inline-flex;align-items:center;justify-content:center;width:20px;height:20px;border-radius:50%;background:#E8A33D;color:#0F1B2D;font-size:12px;font-weight:700;cursor:pointer;margin-left:6px;border:0;padding:0}
.tip{display:none;background:#fff8e8;border:1px solid #f0d9a0;border-radius:8px;padding:10px;font-size:13px;margin:6px 0;line-height:1.4}
.nav{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid rgba(15,27,45,.12);padding:10px 16px;display:flex;gap:10px;justify-content:center}
.nav button{flex:1;max-width:300px;padding:14px;border-radius:8px;border:0;font-weight:700;font-size:16px;cursor:pointer}
.nav .next{background:#E8A33D;color:#0F1B2D}.nav .back{background:#eceae4;color:#0F1B2D}
small{color:#4A5568}#msg{font-size:13px;margin-top:8px;min-height:18px}
.ok{color:#0a7a3d}.bad{color:#b42318}
ul.sum{padding-left:18px;margin:6px 0}
</style></head><body>
<header><div><b>PaintersMax</b> Estimating Setup <span id="co" style="opacity:.7;font-size:14px"></span></div><div><a href="/jobs">Jobs</a> &nbsp; <a href="/materials">Materials</a> &nbsp; <a href="/records">Records</a> &nbsp; <a href="/insurance">Insurance</a> &nbsp; <a href="/dashboard">Settings and leads</a></div></header>
<main>
<div class="steps" id="steps" role="tablist"></div><div class="prog" id="prog"></div>
<div id="view"></div>
<div id="msg"></div>
</main>
<div id="modal" role="dialog" aria-modal="true"><div class="box"><div id="modal_body"></div><div style="margin-top:14px"><button class="btn link" id="modal_close" type="button">Close</button></div></div></div>
<div class="nav"><button class="back" id="back">Back</button><button class="next" id="next">Save and continue</button></div>
<script>
const STEPS=['company','services','cities','pricing','labor','extras','review'];
const STEP_LABELS={company:'Your company info',services:'Services you offer',cities:'Cities you serve',pricing:'Your prices',labor:'Labor and money',extras:'Warranty and insurance',review:'Review'};
const TRADE_LABELS={interior:'Interior painting',exterior:'Exterior painting',commercial:'Commercial',new_construction:'New construction (builders)',power_washing:'Power washing',drywall:'Drywall repair',cabinets:'Cabinet painting',decks_fences:'Decks and fence staining',fencing:'Fence installation',remodeling:'Remodeling',epoxy_floors:'Epoxy floors',industrial:'Industrial coatings'};
const HELP={
 floor:'Floor area: length x width of each room, added together. Example: a 12 ft x 15 ft bedroom is 180 sq ft. Most repaints are quoted from the whole home floor area.',
 wall:'Paintable wall area: add up the length of every wall, multiply by the height, then subtract about 20 sq ft for each door and 15 sq ft for each window. Example: 4 walls totaling 54 ft x 8 ft = 432 sq ft, minus 1 door and 1 window = about 397 sq ft.',
 linear:'Linear feet: the total length of the fence or trim run. Walk it with a measuring wheel, or measure it on a satellite map. Add a foot or two per gate or corner.',
 ext:'Exterior prices vary a lot. A simple method: a base price for a typical 1, 2 or 3 story house, then add-ons for doors, shutters, windows and repairs. You can adjust on every job.',
 rooms:'Small: closets, hallways, half baths. Medium: bedrooms, dining rooms, offices. Large: kitchens, living rooms, primary bedroom or bath, garage. Custom: anything else, priced on the job.',
 builder:'Builder rates are the lower per-house or per-sq-ft prices you give a home builder or contractor who keeps you busy all year. Customers never see them.'
};
const SERVICE_HELP={
 interior:'Repainting rooms, walls, ceilings, trim and doors inside homes. Pick the items you do and set a price for each.',
 exterior:'Painting house exteriors: siding, stucco, brick, trim, doors and garage doors, plus the prep that goes with them.',
 commercial:'Painting commercial buildings such as warehouses, retail centers and apartments. Most contractors need insurance to bid commercial work, and commercial bids are on the Basic (one free try) and Pro plans.',
 power_washing:'Pressure and soft washing for houses, concrete, decks, roofs and commercial areas.',
 cabinets:'Spraying or brushing kitchen and bath cabinets, priced by the door, drawer, panel or linear foot.',
 decks_fences:'Staining and sealing decks, fences, pergolas, pavilions, gazebos and concrete patios.',
 epoxy_floors:'Garage, basement and commercial floor coatings: epoxy, flake, metallic and polyaspartic systems with their prep.',
 builder:'Builder rates are the lower per-house or per-sq-ft prices you give a home builder or contractor who keeps you busy all year. Customers never see them.'
};
const POS_HELP=['Win jobs on price. A fit if you are building reviews, or your area is price-sensitive.','A fair rate for a solid local painter. Most painters start here.','For a higher-end finish, careful prep, a tidy crew and strong reviews.'];
const POS_NAMES=['Value','Standard','Premium'];
const TIERS=['high','average','low'];
const TIER_NAMES={high:'High-cost market',average:'Average market',low:'Lower-cost or rural market'};
const TIER_HELP={high:'Large metro areas and places where homes, labor and living costs are high.',average:'Mid-size cities and suburbs where costs are typical.',low:'Small towns and rural areas where customers expect lower prices.'};
let CAT=null;
const roundPrice=v=>v>=100?Math.round(v/5)*5:v>=10?Math.round(v):Math.round(v*20)/20;
const priceFor=(it,pos,mult)=>roundPrice((pos===0?it.low:pos===2?it.high:(it.low+it.high)/2)*mult);
const tierMult=()=>{const t=(S.profile.market||{}).tier||'average';return(CAT&&CAT.markets&&CAT.markets[t])||1;};
const curTier=()=>(S.profile.market||{}).tier||'average';
const fmt$=n=>'$'+(Number(n)%1?Number(n).toFixed(2):Number(n).toLocaleString('en-US'));
function catKey(trade,aud){if(!CAT)return null;if(aud==='builder')return 'builder';return trade!=='builder'&&CAT.catalog[trade]?trade:null;}
const help2=t=>`<button type="button" class="help" data-tog="1" aria-label="Help">?</button><div class="tip">${esc(t)}</div>`;
function openModal(html){$('modal_body').innerHTML=html;$('modal').style.display='flex';window.scrollTo(0,0);}
const MORE_INFO=`<h3>How to choose your prices</h3>
<h4>What a rate card is</h4><p>A painter rate card is a standardized pricing reference used by painting contractors to calculate consistent, repeatable estimates or present transparent service tiers. It breaks down labor, production speeds, materials, and standard unit pricing.</p>
<h4>Pick your level</h4><p><b>Value:</b> you are newer to the trade, still building reviews, or your area is very price-sensitive.</p><p><b>Standard:</b> you are an established painter with steady work and good reviews. Most painters start here.</p><p><b>Premium:</b> you are known for a high-quality finish, careful prep, a tidy crew and reliable scheduling, usually in a higher-cost area.</p>
<h4>Your market</h4><p>Prices follow what customers in your area pay. A large coastal city usually costs more than a small town. We start you from the market you choose, and you can change any number.</p>
<h4>What goes into a price</h4><p><b>Loaded labor rate:</b> what an hour of labor really costs you, including taxes, insurance and benefits.</p><p><b>Production rates:</b> how much a crew finishes per hour, such as square feet or doors.</p><p><b>Materials and waste:</b> paint, primer and supplies, plus a little extra for waste.</p><p><b>Overhead and markup:</b> your truck, tools, insurance and office time, plus profit.</p>
<h4>Not sure? Keep Standard.</h4><p>Then watch your first few estimates. If nearly everyone says yes, you may be too low. If very few do, check whether you are too high. You can change any number at any time.</p>
<p style="color:#4A5568;font-size:13px">These starting ranges come from the PaintersMax rate card guide. They are a starting point, not market data or a guarantee.</p>`;
const BRANDS=['Sherwin-Williams','Benjamin Moore','Behr','Valspar','PPG','Dunn-Edwards','Kelly-Moore','Glidden','Diamond Vogel','Kilz','Zinsser','Rust-Oleum','Tnemec','Cabot','Ready Seal'];
let S={profile:{company:{},trades:[],cities:[],insurance:{},labor:{},warranty:{laborMonths:12},materials:{brands:[]},language:{ui:'en',crewDocs:'en'}},rateCards:{},caps:{services:1,cities:1},plan:'free',step:0,completed:false};

const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const val=(o,k)=>o&&o[k]!=null?esc(o[k]):'';
const help=k=>`<button type="button" class="help" data-help="${k}" aria-label="Help">?</button><div class="tip" id="tip_${k}">${esc(HELP[k])}</div>`;
document.addEventListener('click',e=>{const tg=e.target.closest('[data-tog]');if(tg){const t=tg.nextElementSibling;t.style.display=t.style.display==='block'?'none':'block';return;}const b=e.target.closest('[data-help]');if(b){const t=$('tip_'+b.dataset.help);t.style.display=t.style.display==='block'?'none':'block';}});

function msg(t,ok){const m=$('msg');m.textContent=t||'';m.className=ok?'ok':'bad';}
async function api(path,body){const r=await fetch(path,body?{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(body)}:undefined);if(r.status===401){location.href='/login';throw 0;}const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.error||'Could not save.');return j;}

function rcKey(trade,aud){return trade+'|'+(aud||'retail');}
function card(trade,aud){return S.rateCards[rcKey(trade,aud)]||{method:'',data:{}};}

// ---- pricing field sets per trade ----
function methodsFor(trade){
  if(trade==='interior')return[['room_size','By room size (small, medium, large, custom)'],['sqft_floor','By square foot of floor area'],['sqft_wall','By paintable wall area']];
  if(trade==='exterior')return[['items','Base price by stories, plus add-ons']];
  if(trade==='commercial')return[['sqft_wall','Per sq ft of paintable surface'],['line_items','By line item'],['lump_sum','Lump-sum bid (markup on cost)']];
  if(trade==='fencing'||trade==='decks_fences')return[['per_linear_ft','Per linear foot']];
  return[['sqft_floor','Per square foot'],['lump_sum','Lump-sum bid (markup on cost)']];
}
function fieldsFor(trade,method){
  const f=(k,l,h)=>({k,l,h});
  if(method==='room_size')return[f('small','Small room price ($)'),f('medium','Medium room price ($)'),f('large','Large room price ($)'),f('custom_min','Custom room minimum ($)'),f('ceiling','Add-on: ceiling ($)'),f('trim','Add-on: trim and baseboards ($)'),f('door_each','Add-on: each door ($)'),f('accent_wall','Add-on: accent wall ($)'),f('repairs_hourly','Repairs per hour ($)'),f('high_ceiling_pct','High ceiling surcharge (%)'),f('extra_coat_pct','Extra coat surcharge (%)')];
  if(method==='sqft_floor'||method==='sqft_wall')return[f('low','Low price per sq ft ($)'),f('high','High price per sq ft ($)'),f('minimum','Minimum job ($)')];
  if(method==='items')return[f('base_1_story','Typical 1-story house ($)'),f('base_2_story','Typical 2-story house ($)'),f('base_3_story','Typical 3-story house ($)'),f('door','Each door ($)'),f('shutter','Each shutter ($)'),f('window','Each window ($)'),f('garage_door','Garage door ($)'),f('power_washing','Power washing, whole house ($)'),f('wood_repair_hourly','Wood repair per hour ($)'),f('color_change','Each extra color ($)')];
  if(method==='per_linear_ft')return[f('low','Low price per linear ft ($)'),f('high','High price per linear ft ($)'),f('gate_each','Each gate ($)'),f('removal_per_ft','Old fence removal per ft ($)'),f('stain_per_ft','Staining or painting per ft ($)')];
  if(method==='line_items')return[f('mobilization','Mobilization ($)'),f('lift_daily','Lift or scaffold per day ($)'),f('night_weekend_pct','Night or weekend surcharge (%)'),f('hourly','Labor per hour ($)')];
  if(method==='lump_sum')return[f('markup_pct','Markup on cost (%)'),f('minimum','Minimum job ($)')];
  return[];
}
function helpKeyFor(trade,method){return method==='sqft_wall'?'wall':method==='sqft_floor'?'floor':method==='per_linear_ft'?'linear':method==='items'?'ext':method==='room_size'?'rooms':null;}

function ensureSeed(trade,aud){
  const k=catKey(trade,aud);if(!k)return;
  const c=S.rateCards[rcKey(trade,aud)];
  if(c&&c.method==='catalog')return;
  if(c&&c.method)return; // an older card: leave it alone until the painter switches
  const m=tierMult(),d={position:1,tier:TIERS.indexOf(curTier())};
  CAT.catalog[k].forEach(it=>{d[it.id]=priceFor(it,1,m);});
  S.rateCards[rcKey(trade,aud)]={method:'catalog',data:d};
}
function exampleHtml(key,data){
  const ex=CAT.examples[key];if(!ex)return'';
  let total=0;
  for(const [match,qty] of ex.parts){const it=CAT.catalog[key].find(i=>i.label.startsWith(match)||i.label.includes(match));const pr=it?Number(data[it.id]):0;if(!(pr>0))return'';total+=pr*qty;}
  return `<b>Example only:</b> ${esc(ex.text)} would come to about <b>${fmt$(Math.round(total))}</b> at your prices. This is what your numbers mean in a real job.`;
}
function renderCatalogCard(trade,aud){
  ensureSeed(trade,aud);
  const key=catKey(trade,aud),c=card(trade,aud),d=c.data||{},pos=typeof d.position==='number'?d.position:1,m=tierMult();
  const title=aud==='builder'?'Builder rates':(TRADE_LABELS[trade]||trade);
  const groups=[];CAT.catalog[key].forEach(it=>{let g=groups.find(x=>x.n===it.group);if(!g)groups.push(g={n:it.group,rows:[]});g.rows.push(it);});
  const rows=g=>g.rows.map(it=>{const lo=roundPrice(it.low*m),hi=roundPrice(it.high*m),v=d[it.id];return `<div class="it" data-item="${esc(it.id)}"><div class="il"><b style="font-weight:600">${esc(it.label)}</b>${it.note?help2(it.note):''}<small>${esc(it.unit)}</small></div><input inputmode="decimal" data-k="${esc(it.id)}" data-lo="${it.low}" data-hi="${it.high}" value="${v!=null?esc(v):''}" placeholder="not offered"><div class="ir">Typical range for your market: <span class="rg">${fmt$(lo)} to ${fmt$(hi)}</span> <span class="sn"></span></div></div>`;}).join('');
  return `<div class="card" data-trade="${trade}" data-aud="${aud||'retail'}" data-cat="${key}" data-pos="${pos}">
   <b style="font-size:17px">${esc(title)}</b>${help2(SERVICE_HELP[key]||'')}
   <div class="poshelp" style="margin-top:6px">Where do you want to price? Standard is already filled in for you.</div>
   <div class="seg">${POS_NAMES.map((n,i)=>`<button type="button" data-pos="${i}" class="${i===pos?'on':''}">${n}</button>`).join('')}</div>
   <div class="poshelp" data-poshelp>${esc(POS_HELP[pos])}</div>
   ${groups.map((g,i)=>`<details class="grp" ${i===0?'open':''}><summary>${esc(g.n)} (${g.rows.length})</summary>${rows(g)}</details>`).join('')}
   <div class="ex" data-ex>${exampleHtml(key,d)}</div>
   <details class="grp"><summary>How this rate is built</summary><div style="padding:4px 12px 12px;font-size:14px"><p><b>Loaded labor rate:</b> what an hour of labor really costs you with taxes, insurance and benefits.</p><p><b>Production rates:</b> how much a crew finishes per hour.</p><p><b>Materials and waste:</b> paint, primer and supplies, plus waste.</p><p><b>Overhead and markup:</b> truck, tools, insurance, office time and profit.</p></div></details>
   <button type="button" class="link" data-more="1">More information: how to set your prices</button>
  </div>`;
}
function refreshCatalogCard(el){
  const key=el.dataset.cat,m=tierMult(),d={};
  el.querySelectorAll('input[data-k]').forEach(i=>{const n=Number(i.value);if(i.value.trim()!==''&&n>0)d[i.dataset.k]=n;});
  el.querySelectorAll('.it').forEach(row=>{const i=row.querySelector('input'),n=Number(i.value),lo=Number(i.dataset.lo)*m,hi=Number(i.dataset.hi)*m,sn=row.querySelector('.sn');row.querySelector('.rg').textContent=fmt$(roundPrice(lo))+' to '+fmt$(roundPrice(hi));
    sn.textContent=i.value.trim()===''||!(n>0)?'':(n<lo*0.75?'This is below the usual range for your market. Is that on purpose?':n>hi*1.25?'This is above the usual range for your market. Is that on purpose?':'');});
  el.querySelector('[data-ex]').innerHTML=exampleHtml(key,d);
}
function applyPosition(el,pos,askFirst){
  const key=el.dataset.cat,m=tierMult();
  if(askFirst){let changed=false;const old=Number(el.dataset.pos);el.querySelectorAll('input[data-k]').forEach(i=>{const it=CAT.catalog[key].find(x=>x.id===i.dataset.k);if(it&&Number(i.value)!==priceFor(it,old,m))changed=true;});
    if(changed&&!confirm('You changed some prices. Reset every price to '+POS_NAMES[pos]+'?'))return false;}
  el.querySelectorAll('input[data-k]').forEach(i=>{const it=CAT.catalog[key].find(x=>x.id===i.dataset.k);if(it)i.value=priceFor(it,pos,m);});
  el.dataset.pos=pos;el.querySelectorAll('.seg button').forEach(b=>b.classList.toggle('on',Number(b.dataset.pos)===pos));
  el.querySelector('[data-poshelp]').textContent=POS_HELP[pos];refreshCatalogCard(el);return true;
}

function renderCard(trade,aud){
  if(catKey(trade,aud)){ensureSeed(trade,aud);const cc=card(trade,aud);if(cc.method==='catalog')return renderCatalogCard(trade,aud);}
  const legacy=renderLegacyCard(trade,aud);
  return catKey(trade,aud)?legacy.replace(/<\/div>\s*$/,'<div style="margin-top:8px"><button type="button" class="link" data-switch="1">Switch to the new price list with starting rates</button></div></div>'):legacy;
}
function renderLegacyCard(trade,aud){
  const c=card(trade,aud);const methods=methodsFor(trade);const method=c.method||methods[0][0];
  const fs=fieldsFor(trade,method);const hk=helpKeyFor(trade,method);
  return `<div class="card" data-trade="${trade}" data-aud="${aud||'retail'}">
   <b>${esc(TRADE_LABELS[trade]||trade)}${aud==='builder'?' (builder rates)':''}</b> ${aud==='builder'?help('builder'):''}
   <label>How do you price this? ${hk?help(hk):''}</label>
   <select class="method">${methods.map(([v,l])=>`<option value="${v}" ${v===method?'selected':''}>${esc(l)}</option>`).join('')}</select>
   <div class="row">${fs.map(x=>`<div><label>${esc(x.l)}</label><input inputmode="decimal" data-k="${x.k}" value="${val(c.data,x.k)}"></div>`).join('')}</div>
   ${trade==='power_washing'||trade==='exterior'?'<small>Power washing is always its own line on the estimate.</small>':''}</div>`;
}

// ---- progress ----
function stepDone(k){
  const p=S.profile,c=p.company||{},l=p.labor||{};
  if(k==='company')return!!(c.legalName&&(c.phone||c.email));
  if(k==='services')return p.trades.length>0;
  if(k==='cities')return(p.cities||[]).length>0;
  if(k==='pricing')return p.trades.length>0&&p.trades.every(t=>{const cd=t==='new_construction'?card('interior','builder'):card(t,'retail');return!!cd.method&&Object.keys(cd.data||{}).filter(x=>x!=='position'&&x!=='tier').length>0;});
  if(k==='labor')return!!(l.crewSize||l.hourlyRate);
  if(k==='extras')return(p.warranty||{}).laborMonths!=null&&(p.warranty||{}).laborMonths!=='';
  return S.completed;
}
function nextOpen(){const i=STEPS.findIndex(k=>k!=='review'&&!stepDone(k));return i<0?STEPS.length-1:i;}
function renderSteps(){
  $('steps').innerHTML=STEPS.map((k,i)=>`<button type="button" role="tab" data-step="${i}" class="${i===S.step?'cur':''} ${stepDone(k)?'done':''}">${esc(STEP_LABELS[k])}</button>`).join('');
  const n=STEPS.filter(k=>k!=='review'&&stepDone(k)).length;
  $('prog').innerHTML=`<span>${n} of ${STEPS.length-1} steps done. Tap any step to jump to it. Everything saves when you move.</span><a href="#" id="exit">Save and go to dashboard</a>`;
  const cur=document.querySelector('#steps .cur');if(cur&&cur.scrollIntoView)cur.scrollIntoView({block:'nearest',inline:'center'});
}

// ---- coach lines: one short, honest tip per step, based on what is on screen right now ----
function coachText(k){
  const v=id=>{const e=$(id);return e?e.value.trim():'';},num=id=>Number(v(id).replace(/[^0-9.]/g,''))||0;
  if(k==='company'){
    if(!v('legalName'))return 'Start with your company name. It appears on every estimate and contract.';
    if(!v('phone')&&!v('email'))return 'Add a phone and email. Customers reply to them and they show in your customer portal.';
    if(!v('phone'))return 'Add a phone number so customers can reach you quickly from an estimate.';
    if(!v('email'))return 'Add an email. Customer replies to estimates go here.';
    return 'Looks good. You only type this once and we use it everywhere.';
  }
  if(k==='services'){
    const t=[...document.querySelectorAll('.trade:checked')].map(e=>e.value),cap=S.caps.services;
    if(!t.length)return 'Choose the work you do. You can change this any time.';
    if(t.length>=cap)return 'You have used all '+cap+' service'+(cap===1?'':'s')+' on your plan.';
    if(t.includes('exterior')&&!t.includes('power_washing'))return 'Exterior jobs usually start with washing the surface, so power washing is a natural one to add.';
    return 'Each service gets its own price list on the Your prices step.';
  }
  if(k==='cities'){
    const n=CM.on?CM.sel.length:v('cities').split(',').filter(s=>s.trim()).length,cap=S.caps.cities;
    if(!n)return 'Pick the cities you work in. Each one can get its own page on your website.';
    if(n>=cap)return 'You have used all '+cap+' cit'+(cap===1?'y':'ies')+' on your plan.';
    return n+' of '+cap+' chosen. Each city can get its own page on your website.';
  }
  if(k==='pricing'){
    const all=[...document.querySelectorAll('input[data-k]')],pr=all.filter(i=>Number(i.value)>0).length;
    if(!all.length)return '';
    if(!pr)return 'Pick Value, Standard or Premium above to fill in starting prices. You can change every number.';
    if(pr<all.length)return 'You have priced '+pr+' of '+all.length+' items. Items without a price are left off estimates until you add one.';
    return 'Every item has a price. Check the example under each list to see what a real job comes to.';
  }
  if(k==='labor'){
    const dep=num('depositPct'),hr=num('hourlyRate');
    if(dep>50)return 'A deposit above 50% is high. Some states also limit deposits on home improvement work, so check your state\'s rule.';
    if(hr>0&&hr<25)return 'Use your loaded rate: wages plus taxes, insurance and benefits, not just what you pay the painter.';
    if(!hr&&!dep)return 'Your hourly rate and deposit help the assistant and your estimates. You can edit any estimate before it goes out.';
    return 'Good. Every number here can still be changed on a single job.';
  }
  if(k==='extras'){
    if(!v('carrier'))return 'Insurance is optional here, but customers and builders often ask for proof. You can add it later on the Insurance page.';
    return 'Good. Upload the policy on the Insurance page so we can check whether each job looks covered.';
  }
  if(k==='review')return 'Last look. You can come back to any step later.';
  return '';
}
function updateCoach(){const e=$('coach');if(!e)return;const t=coachText(STEPS[S.step]);e.hidden=!t;e.textContent=t;}
document.addEventListener('input',updateCoach);document.addEventListener('change',updateCoach);

// ---- estimate preview ----
async function loadPreview(){
  const box=$('prev');if(!box)return;
  try{
    const j=await api('/api/estimate-preview');
    if(!$('prev'))return;
    if(!j.previews||!j.previews.length){box.innerHTML='<div class="card"><b>Your estimate preview</b><p class="muted">Save your prices on the Your prices step and a sample estimate shows up here.</p></div>';return;}
    const m=c=>'$'+(c/100).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
    box.innerHTML='<h3 style="margin:18px 0 6px">What your estimate will look like</h3><p class="muted" style="margin:0 0 10px">A sample job priced with the prices you just saved. The job and sizes are made up for this preview. Nothing is sent to anyone.</p>'+j.previews.map(p=>{
      const t=p.totals;
      return `<div class="card"><b>${esc(p.title)}</b><br><small>Sample: ${esc(p.text)}</small>
       <table style="width:100%;border-collapse:collapse;margin-top:8px;font-size:14px"><thead><tr style="text-align:left;color:#4A5568"><th>Item</th><th>Qty</th><th style="text-align:right">Price</th><th style="text-align:right">Amount</th></tr></thead><tbody>
       ${p.lines.map(l=>`<tr><td style="padding:4px 0">${esc(l.description)}</td><td>${esc(l.qty)} ${esc(l.unit)}</td><td style="text-align:right">${m(l.unitCents)}</td><td style="text-align:right">${m(l.totalCents)}</td></tr>`).join('')}
       ${t.minimumTopUpCents?`<tr><td colspan="3">Minimum job adjustment</td><td style="text-align:right">${m(t.minimumTopUpCents)}</td></tr>`:''}
       <tr style="border-top:1px solid #ddd"><td colspan="3"><b>Total</b></td><td style="text-align:right"><b>${m(t.totalCents)}</b></td></tr>
       ${t.depositCents?`<tr><td colspan="3" class="muted">Deposit to schedule</td><td style="text-align:right">${m(t.depositCents)}</td></tr>`:''}</tbody></table></div>`;}).join('');
  }catch(e){}
}

// ---- cities map ----
const CM={on:false,sel:[],list:[],data:null,map:null,mk:{}};
function cmSel(key){return CM.sel.some(c=>c.key===key);}
function cmDraw(){
  const D=CM.data,box=$('cityBox');if(!box||!D)return;
  const rows=CM.list.map(c=>`<label class="chk"><input type="checkbox" class="cityck" value="${esc(c.key)}" ${cmSel(c.key)?'checked':''}> ${esc(c.name)}, ${esc(c.state)} <small>&middot; ${c.miles!=null?c.miles+' mi':''}</small></label>`).join('');
  box.innerHTML=`<div class="card"><div id="cmap" style="height:260px;border-radius:8px;background:#eceae4"></div>
   <p class="muted" id="cmcount"></p>
   <label>Add a city${D.zipSearch?' or ZIP code':''}</label><div class="row"><input id="cadd" placeholder="${D.zipSearch?'Plano or 75024':'Plano'}"><button class="btn sec" type="button" id="caddbtn">Add</button></div>
   <small>${D.zipSearch?'Pro: you can pick cities by ZIP code.':'ZIP code selection is on the Pro plan.'} Up to ${D.radius} miles from your address.</small>
   <div style="margin-top:10px">${rows||'<small>No nearby cities found yet. Add your company address first, or type a city above.</small>'}</div></div>`;
  cmCount();cmMap();
}
function cmCount(){const e=$('cmcount');if(e)e.textContent=CM.sel.length+' of '+CM.data.cap+' cities chosen';}
function cmMap(){
  const D=CM.data;if(!D.browserKey||!D.base||!$('cmap'))return;
  const go=()=>{try{
    const g=window.google.maps;CM.map=new g.Map($('cmap'),{center:{lat:D.base.lat,lng:D.base.lng},zoom:8,mapTypeControl:false,streetViewControl:false});
    new g.Circle({map:CM.map,center:{lat:D.base.lat,lng:D.base.lng},radius:D.radius*1609.34,strokeColor:'#E8A33D',fillColor:'#E8A33D',fillOpacity:.08,strokeWeight:2});
    CM.mk={};CM.list.forEach(c=>{CM.mk[c.key]=new g.Marker({map:CM.map,position:{lat:c.lat,lng:c.lng},title:c.name,opacity:cmSel(c.key)?1:.45});});
  }catch(e){}};
  if(window.google&&window.google.maps)return go();
  window.__cmInit=go;const sc=document.createElement('script');sc.async=true;sc.src='https://maps.googleapis.com/maps/api/js?key='+encodeURIComponent(D.browserKey)+'&callback=__cmInit';document.head.appendChild(sc);
}
async function loadCities(){
  try{
    const D=await api('/api/cities');
    if(!D||!D.configured||!$('cityBox'))return;
    CM.data=D;CM.on=true;
    const have=new Map();(D.chosen||[]).forEach(c=>have.set(c.key,c));
    CM.sel=(D.chosen||[]).slice(0,D.cap);
    CM.list=[...(D.chosen||[]).map(c=>({...c,miles:null})),...(D.nearby||[]).filter(c=>!have.has(c.key))];
    cmDraw();
  }catch(e){}
}
document.addEventListener('change',e=>{
  const c=e.target.closest('.cityck');if(!c)return;
  const city=CM.list.find(x=>x.key===c.value);if(!city)return;
  if(c.checked){if(CM.sel.length>=CM.data.cap){c.checked=false;msg('Your plan includes up to '+CM.data.cap+' cities.');return;}CM.sel.push(city);}
  else CM.sel=CM.sel.filter(x=>x.key!==c.value);
  if(CM.mk[c.value])CM.mk[c.value].setOpacity(c.checked?1:.45);
  cmCount();msg('');
});
document.addEventListener('click',async e=>{
  if(e.target.id!=='caddbtn')return;
  const q=$('cadd').value.trim();if(!q)return;
  try{
    const j=await api('/api/cities',{action:'add',query:q});
    if(!CM.list.some(x=>x.key===j.city.key))CM.list.unshift(j.city);
    if(!cmSel(j.city.key)){if(CM.sel.length>=CM.data.cap){msg('Your plan includes up to '+CM.data.cap+' cities. Untick one first.');cmDraw();return;}CM.sel.push(j.city);}
    cmDraw();msg('');
  }catch(x){if(x)msg(x.message||'Could not add that city.');}
});

// ---- collect and save ----
function collect(){
  const k=STEPS[S.step],p=S.profile,g=id=>{const e=$(id);return e?e.value.trim():undefined;};
  if(k==='company')p.company={legalName:g('legalName'),phone:g('phone'),email:g('email'),address:g('address'),city:g('city'),state:g('state'),zip:g('zip'),license:g('license'),website:g('website')};
  if(k==='services'){p.trades=[...document.querySelectorAll('.trade:checked')].map(e=>e.value);
    if(p.trades.length>S.caps.services)throw new Error('Your plan includes up to '+S.caps.services+' services.');}
  if(k==='cities'){
    if(CM.on){p.cityKeys=CM.sel.map(c=>c.key);p.cities=CM.sel.map(c=>c.name+', '+c.state);}
    else{p.cities=g('cities').split(',').map(s=>s.trim()).filter(Boolean);}
    if(p.cities.length>S.caps.cities)throw new Error('Your plan includes up to '+S.caps.cities+' cities.');}
  if(k==='pricing'){p.market={tier:g('mk')||curTier()};p.ratecard={hidePreparedWith:$('pw')?!$('pw').checked:(p.ratecard||{}).hidePreparedWith};}
  if(k==='labor')p.labor={crewSize:g('crewSize'),hourlyRate:g('hourlyRate'),helperRate:g('helperRate'),minimumJob:g('minimumJob'),markupPct:g('markupPct'),overheadPct:g('overheadPct'),depositPct:g('depositPct'),paymentTerms:g('paymentTerms')};
  if(k==='extras'){p.warranty={laborMonths:g('laborMonths'),text:g('wtext'),exclusions:g('exclusions')};p.insurance={carrier:g('carrier'),expires:g('expires'),coverage:g('coverage'),shareSummary:$('shareSummary').checked};
    p.materials={brands:[...document.querySelectorAll('.brand:checked')].map(e=>e.value),notes:g('mnotes')};p.language={ui:window.PM_LANG||'en',crewDocs:g('crewDocs')};}
}
async function saveCards(){
  for(const el of document.querySelectorAll('[data-trade]')){
    const data={};el.querySelectorAll('input[data-k]').forEach(i=>{if(i.value.trim()!=='')data[i.dataset.k]=i.value.trim();});
    const isCat=!!el.dataset.cat;
    if(isCat){data.position=Number(el.dataset.pos);data.tier=TIERS.indexOf(curTier());}
    const body={trade:el.dataset.trade,audience:el.dataset.aud,method:isCat?'catalog':el.querySelector('.method').value,data};
    await api('/api/ratecard',body);S.rateCards[rcKey(body.trade,body.audience)]={method:body.method,data};
  }
}
async function save(target,finishing){
  if(STEPS[S.step]!=='review'){collect();if(STEPS[S.step]==='pricing')await saveCards();}
  await api('/api/profile',{profile:S.profile,setupStep:STEPS[target].replace(/[^a-z]/g,''),completed:finishing||S.completed});
}
async function jump(target){
  try{
    target=Math.max(0,Math.min(STEPS.length-1,target));
    await save(target,false);
    S.step=target;view();window.scrollTo(0,0);
  }catch(e){if(e)msg(e.message||'Could not save.');}
}
async function go(delta){
  if(STEPS[S.step]==='review'&&delta>0)return finish();
  return jump(S.step+delta);
}
async function finish(){
  try{
    await save(STEPS.length-1,true);S.completed=true;renderSteps();
    $('view').innerHTML='<div class="done-card"><b>You are set up.</b><p>Your business profile is saved. Opening your dashboard...</p></div>';
    $('next').disabled=true;$('back').disabled=true;
    setTimeout(()=>{location.href='/dashboard';},900);
  }catch(e){if(e)msg(e.message||'Could not save.');}
}
document.addEventListener('click',async e=>{
  const st=e.target.closest('#steps [data-step]');if(st){await jump(Number(st.dataset.step));return;}
  const gt=e.target.closest('[data-go]');if(gt){e.preventDefault();await jump(Number(gt.dataset.go));return;}
  if(e.target.id==='exit'){e.preventDefault();try{await save(S.step,false);location.href='/dashboard';}catch(x){if(x)msg(x.message||'Could not save.');}}
});
