<script>
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
// Each topic: t = title, p = short paragraphs, l = bullet list, n = numbered steps
const C={
en:{
 title:'Insurance guide',h1:'Insurance for painters and their customers',
 lead:'What to look for, how to buy it, how to add coverage for special jobs, what to ask, and what to do if something goes wrong. Built for painting contractors, and written so you can share the ideas with your customers.',
 disc:'General information only. This is not insurance or legal advice. Rules and prices vary by state and by insurance company. Talk to a licensed insurance agent about your own situation. PaintersMax does not sell insurance.',
 c1:'Upload my policy',c2:'Check my coverage',
 foot:'Have a topic you want added? Tell us and we will add it.',
 topics:[
 {t:'Why insurance helps you win and protect jobs',p:['Painting looks simple, but ladders fall, sprayers drift, drop cloths get missed and people get hurt. One accident can cost more than a year of profit.'],l:['It protects your business and your personal savings when something goes wrong.','Many homeowners, property managers, HOAs and general contractors ask for proof of insurance before they hire. Having it ready lets you say yes quickly.','Customers feel safer hiring a painter who can show proof, so showing it can help more of your estimates get approved.','You can still work without insurance in many places, but you carry all the risk yourself. If you do not have coverage yet, you are usually better off getting it.']},
 {t:'The main types of coverage',l:['General liability: pays for injuries to other people and damage to a customer\'s property caused by your work, such as paint on a car or a ladder through a window. Ask that it includes completed operations, which covers problems that show up after the job is finished.','Workers\' compensation: covers injuries to your employees. Rules are different in every state, so ask your agent what is required for you. Even where it is optional, some customers and general contractors require it.','Commercial auto: covers vehicles used for the business. A personal auto policy often does not cover a work truck full of ladders and paint.','Tools and equipment (sometimes called inland marine): covers sprayers, ladders and tools if they are stolen or damaged.','Umbrella or excess liability: adds more limit on top of your general liability. Commercial jobs often ask for it.','Pollution or lead coverage: standard policies often exclude lead paint and similar hazards. If you work on older homes, ask about it.','Builder\'s risk: usually bought by the property owner or general contractor for a building under construction. Ask who carries it before you start.','Bonds are not insurance. A license or performance bond is a promise backed by a surety company. Ask your agent which ones your state or customer requires.']},
 {t:'What to look for in a policy',l:['Limits: the most the policy will pay. Look at the per-occurrence limit, the general aggregate (the yearly total) and the products and completed operations aggregate.','Your real work is listed: interior, exterior, commercial, cabinets, power washing, drywall repair, epoxy floors. If the class does not match what you do, a claim can be denied.','Exclusions: read them. Common ones are height limits (for example work above two or three stories), lead paint, mold, stucco or EIFS, residential only or commercial only, work by subcontractors, and work done before the policy started.','Occurrence or claims-made: an occurrence policy covers things that happen during the policy period. Claims-made policies have reporting rules and need more care.','Deductible: what you pay before the insurance pays. Make sure you could afford it on a bad day.','Names and dates: your business name is spelled right, the policy period is current and the address is correct.','Endorsements: add-ons that change the policy. They can add coverage, such as additional insured, or remove it.']},
 {t:'How to buy insurance',n:['Write down what you do: types of work, the tallest building you paint, how much work is commercial, whether you use subcontractors, and whether you work on homes built before 1978.','Estimate your yearly sales, payroll and number of employees. Insurers price from these numbers, so be accurate and honest. A wrong answer on an application can cause a claim to be denied.','Ask two or three independent agents and at least one direct carrier for quotes. Ask each for the same limits so the prices can be compared fairly.','Ask about carriers that specialize in painters and contractors. They understand the work and often have the right endorsements.','Compare the exclusions and deductibles, not only the price.','Ask how payments work: one payment, monthly, and what happens if you pay late.','After you buy, get your certificate, save the full policy, and upload it here so PaintersMax can check every lead and job.','Set a reminder to renew. PaintersMax emails you 30 days and 7 days before it ends.']},
 {t:'Adding special coverage for certain jobs',p:['Some jobs need more than your everyday policy. Ask your agent before you bid, not after you win.'],l:['Additional insured: a customer, property manager or general contractor asks to be listed on your policy for the job. Your agent adds it with an endorsement.','Waiver of subrogation and primary and non-contributory wording: common in commercial contracts. Ask your agent if your policy can include them.','Higher limits or an umbrella policy for large commercial work.','A per-project aggregate so one big job does not use up your yearly limit.','Removing or raising a height limit for tall buildings or lifts.','Lead-safe work on older homes: the EPA requires certification for many repairs and paint work in homes built before 1978. Ask about pollution or lead coverage and training.','Wrap-up or owner-controlled programs: on some large projects the owner buys one policy for everyone. Ask the general contractor.']},
 {t:'Questions to ask your insurance agent',l:['Does my policy cover the kind of work I actually do, including exterior, commercial and spray work?','What is the height limit, and how do I raise it?','Am I covered for lead paint, mold, stucco and EIFS? If not, can I add it?','Does it cover my employees, helpers and subcontractors?','What happens if I hire a subcontractor who has no insurance?','Is completed operations coverage included, and for how long after the job?','Can you add a customer as additional insured, and how fast can you send a certificate?','What is my deductible, and how do claims work?','Is it occurrence or claims-made?','Do my tools, sprayers and truck have coverage?','What would make a claim get denied, and what must I do to avoid it?','How soon must I report an accident or a possible claim?','What will change my price at renewal?','Do I need a higher limit for commercial jobs?','What does an audit look like, and what records will you ask for?']},
 {t:'Certificates of insurance (COIs)',l:['A certificate is a one-page proof that a policy exists, with the carrier, dates and limits. It is not the policy and does not change it.','The certificate holder is who the certificate is sent to. An additional insured is someone who is actually added to your coverage. They are not the same.','Your agent issues official certificates. Ask them how long it takes, and keep a list of who has asked for one.','The PaintersMax proof of insurance page is a summary you prepare from your own policy. It helps customers feel comfortable and is quick to share, but it is not an official certificate. Send an official certificate when a customer or building requires one.']},
 {t:'Hiring subcontractors',l:['Ask every subcontractor for a current certificate before they start. Check the dates and the types of coverage.','If a subcontractor has no insurance, your policy may be asked to cover their work, and your insurer may charge you more at audit time.','Ask whether they have workers\' compensation or an exclusion on file, and what your state requires.','Write the insurance requirement into your subcontract and keep the certificates with the job.']},
 {t:'Before, during and after the job',n:['Before you bid: check that your policy covers this type of work. PaintersMax shows a note on every lead, job and new-lead email.','Before you start: send your proof of insurance to the customer from the job page, and confirm the policy is current.','Walk the property with the customer and take photos of anything already damaged, such as scratches, cracks or stains. This protects both of you.','During the work: keep the site safe, cover and mask carefully, and tell the customer right away about anything that goes wrong. A change in the scope of the job can change your coverage, so call your agent if it does.','After the job: do the final walkthrough, fix the punch list and keep the signed documents and photos.','Keep your policy active after the job. Completed operations coverage only helps if a policy is in place when a claim comes in.']},
 {t:'If something goes wrong',n:['If anyone is hurt, call 911 first.','Make the area safe and stop work near the problem.','Take photos and video before anything is moved or cleaned up.','Write down the names and phone numbers of everyone involved and any witnesses.','Do not admit fault, promise to pay or sign anything. You can say, "I will report this to my insurance and we will make it right."','Call your agent or carrier as soon as you can. Many policies require quick notice and a late report can hurt a claim.','Keep receipts, messages and quotes. Do not throw away damaged items.','On the job page, use "Something happened? Get claim help" to save the incident to the job history and build a claim sheet you can send to your agent.'],p:['What your customer should do: tell you right away, take photos, keep receipts, and not sign anything they do not understand. Your proof of insurance page for customers explains these steps.']},
 {t:'What to tell your customers',l:['Say that you are insured and that you can send proof before you start.','Offer the link to your proof page, or an official certificate from your agent if they need one.','Tell them what to do if something goes wrong: tell you right away, take photos and keep receipts.','Let them know they can call your carrier to confirm that your policy is active.','If you do not carry a type of coverage, say so honestly and explain how you handle the risk.']},
 {t:'Common mistakes',l:['Letting the policy lapse, even for a few days.','Taking a job type the policy excludes, such as tall exterior work or lead paint.','Not telling the agent that you added crew members, vehicles or new kinds of work.','Hiring subcontractors without a certificate.','Assuming a homeowner\'s policy or a personal auto policy covers business work.','Not reading the exclusions until after an accident.','Reporting an accident late.','Admitting fault at the scene.']},
 {t:'If you do not have insurance yet',p:['This is for you only and never shows to your customers.'],l:['You may be better off with coverage. One accident without it can be paid out of your own pocket, and some customers will not hire without proof.','Start with a general liability quote. Ask an independent agent who works with contractors.','You can keep using PaintersMax to estimate, send contracts and invoices while you decide. The insurance features stay quiet until you add a policy.','Rules vary by state, so ask a licensed agent what you need for the work you do.']}
 ]},
es:{
 title:'Guía de seguros',h1:'Seguros para pintores y sus clientes',
 lead:'Qué buscar, cómo comprarlo, cómo agregar cobertura para trabajos especiales, qué preguntar y qué hacer si algo sale mal. Hecha para contratistas de pintura y escrita para que pueda compartir las ideas con sus clientes.',
 disc:'Solo información general. Esto no es asesoría de seguros ni legal. Las reglas y los precios varían según el estado y la aseguradora. Hable con un agente de seguros con licencia sobre su situación. PaintersMax no vende seguros.',
 c1:'Subir mi póliza',c2:'Revisar mi cobertura',
 foot:'¿Quiere que agreguemos un tema? Díganos y lo agregamos.',
 topics:[
 {t:'Por qué el seguro le ayuda a ganar y proteger trabajos',p:['Pintar parece sencillo, pero se caen escaleras, la pistola de rociado deja neblina, se olvida una lona y la gente se lastima. Un accidente puede costar más que la ganancia de un año.'],l:['Protege su negocio y sus ahorros personales cuando algo sale mal.','Muchos propietarios, administradores de propiedades, asociaciones de vecinos y contratistas generales piden comprobante de seguro antes de contratar. Tenerlo listo le permite decir que sí rápido.','Los clientes se sienten más seguros con un pintor que puede mostrar su comprobante, así que mostrarlo puede ayudar a que se aprueben más de sus presupuestos.','En muchos lugares puede trabajar sin seguro, pero usted carga todo el riesgo. Si todavía no tiene cobertura, normalmente le conviene conseguirla.']},
 {t:'Los tipos principales de cobertura',l:['Responsabilidad civil general: paga lesiones a otras personas y daños a la propiedad del cliente causados por su trabajo, como pintura en un carro o una escalera que rompe una ventana. Pida que incluya operaciones terminadas, que cubre problemas que aparecen después de terminar el trabajo.','Compensación para trabajadores: cubre las lesiones de sus empleados. Las reglas cambian en cada estado, así que pregunte a su agente qué se requiere en su caso. Aun donde es opcional, algunos clientes y contratistas generales la exigen.','Auto comercial: cubre los vehículos que usa para el negocio. Una póliza de auto personal muchas veces no cubre una camioneta de trabajo llena de escaleras y pintura.','Herramientas y equipo (a veces llamado inland marine): cubre pistolas de rociado, escaleras y herramientas si las roban o se dañan.','Paraguas o exceso de responsabilidad: agrega más límite encima de su responsabilidad civil general. Los trabajos comerciales a veces lo piden.','Cobertura por contaminación o plomo: las pólizas estándar muchas veces excluyen la pintura con plomo y peligros parecidos. Si trabaja en casas viejas, pregunte.','Riesgo del constructor (builder\'s risk): normalmente lo compra el dueño o el contratista general para un edificio en construcción. Pregunte quién lo tiene antes de empezar.','Las fianzas no son seguros. Una fianza de licencia o de cumplimiento es una promesa respaldada por una afianzadora. Pregunte a su agente cuáles exige su estado o su cliente.']},
 {t:'Qué buscar en una póliza',l:['Límites: lo máximo que paga la póliza. Revise el límite por ocurrencia, el límite general agregado (el total del año) y el agregado de productos y operaciones terminadas.','Su trabajo real aparece en la póliza: interior, exterior, comercial, gabinetes, lavado a presión, reparación de tablaroca, pisos de epoxi. Si la clase no coincide con lo que hace, pueden negar un reclamo.','Exclusiones: léalas. Las comunes son límites de altura (por ejemplo trabajo arriba de dos o tres pisos), pintura con plomo, moho, estuco o EIFS, solo residencial o solo comercial, trabajo de subcontratistas y trabajo hecho antes de que empezara la póliza.','Por ocurrencia o por reclamación presentada: una póliza por ocurrencia cubre lo que pasa durante la vigencia. Las de reclamación presentada tienen reglas de aviso y requieren más cuidado.','Deducible: lo que usted paga antes de que pague el seguro. Asegúrese de poder pagarlo en un mal día.','Nombres y fechas: su nombre comercial está bien escrito, la vigencia está al día y la dirección es correcta.','Endosos: adiciones que cambian la póliza. Pueden agregar cobertura, como asegurado adicional, o quitarla.']},
 {t:'Cómo comprar un seguro',n:['Anote lo que hace: tipos de trabajo, el edificio más alto que pinta, cuánto trabajo es comercial, si usa subcontratistas y si trabaja en casas construidas antes de 1978.','Calcule sus ventas anuales, su nómina y su número de empleados. Las aseguradoras cobran con base en estos números, así que sea exacto y honesto. Una respuesta falsa en la solicitud puede hacer que le nieguen un reclamo.','Pida cotizaciones a dos o tres agentes independientes y al menos a una aseguradora directa. Pida los mismos límites a todos para comparar los precios de forma justa.','Pregunte por aseguradoras que se especialicen en pintores y contratistas. Entienden el trabajo y muchas veces tienen los endosos correctos.','Compare las exclusiones y los deducibles, no solo el precio.','Pregunte cómo son los pagos: un solo pago, mensual, y qué pasa si paga tarde.','Después de comprar, pida su certificado, guarde la póliza completa y súbala aquí para que PaintersMax revise cada cliente potencial y cada trabajo.','Ponga un recordatorio para renovar. PaintersMax le envía un correo 30 días y 7 días antes de que termine.']},
 {t:'Cómo agregar cobertura especial para ciertos trabajos',p:['Algunos trabajos necesitan más que su póliza de todos los días. Pregunte a su agente antes de hacer la oferta, no después de ganar el trabajo.'],l:['Asegurado adicional: un cliente, administrador de propiedades o contratista general pide que lo incluyan en su póliza para el trabajo. Su agente lo agrega con un endoso.','Renuncia a la subrogación y redacción primaria y no contributiva: comunes en contratos comerciales. Pregunte a su agente si su póliza puede incluirlas.','Límites más altos o una póliza paraguas para trabajos comerciales grandes.','Un agregado por proyecto para que un trabajo grande no gaste su límite del año.','Quitar o subir un límite de altura para edificios altos o elevadores.','Trabajo seguro con plomo en casas viejas: la EPA exige certificación para muchas reparaciones y trabajos de pintura en casas construidas antes de 1978. Pregunte por cobertura de contaminación o plomo y por capacitación.','Programas integrales o controlados por el dueño: en algunos proyectos grandes el dueño compra una sola póliza para todos. Pregunte al contratista general.']},
 {t:'Preguntas para su agente de seguros',l:['¿Mi póliza cubre el tipo de trabajo que realmente hago, incluyendo exterior, comercial y rociado?','¿Cuál es el límite de altura y cómo lo subo?','¿Estoy cubierto por pintura con plomo, moho, estuco y EIFS? Si no, ¿puedo agregarlo?','¿Cubre a mis empleados, ayudantes y subcontratistas?','¿Qué pasa si contrato a un subcontratista sin seguro?','¿Incluye operaciones terminadas y por cuánto tiempo después del trabajo?','¿Pueden agregar a un cliente como asegurado adicional y qué tan rápido pueden enviar un certificado?','¿Cuál es mi deducible y cómo funcionan los reclamos?','¿Es por ocurrencia o por reclamación presentada?','¿Mis herramientas, pistolas de rociado y camioneta tienen cobertura?','¿Qué haría que negaran un reclamo y qué debo hacer para evitarlo?','¿Cuánto tiempo tengo para reportar un accidente o un posible reclamo?','¿Qué cambiará mi precio en la renovación?','¿Necesito un límite más alto para trabajos comerciales?','¿Cómo es una auditoría y qué registros me van a pedir?']},
 {t:'Certificados de seguro',l:['Un certificado es un comprobante de una página de que existe una póliza, con la aseguradora, las fechas y los límites. No es la póliza y no la cambia.','El titular del certificado es a quien se le envía. Un asegurado adicional es alguien que realmente se agrega a su cobertura. No son lo mismo.','Su agente emite los certificados oficiales. Pregunte cuánto tarda y lleve una lista de quién los ha pedido.','La página de comprobante de seguro de PaintersMax es un resumen que usted prepara con su propia póliza. Ayuda a que los clientes se sientan tranquilos y se comparte rápido, pero no es un certificado oficial. Envíe un certificado oficial cuando un cliente o un edificio lo exija.']},
 {t:'Cómo contratar subcontratistas',l:['Pida a cada subcontratista un certificado vigente antes de que empiece. Revise las fechas y los tipos de cobertura.','Si un subcontratista no tiene seguro, pueden pedirle a su póliza que cubra su trabajo y su aseguradora puede cobrarle más en la auditoría.','Pregunte si tiene compensación para trabajadores o una exclusión registrada, y qué exige su estado.','Escriba el requisito de seguro en su subcontrato y guarde los certificados con el trabajo.']},
 {t:'Antes, durante y después del trabajo',n:['Antes de hacer la oferta: revise que su póliza cubra este tipo de trabajo. PaintersMax muestra una nota en cada cliente potencial, trabajo y correo de cliente nuevo.','Antes de empezar: envíe su comprobante de seguro al cliente desde la página del trabajo y confirme que la póliza esté vigente.','Recorra la propiedad con el cliente y tome fotos de lo que ya esté dañado, como rayones, grietas o manchas. Esto los protege a los dos.','Durante el trabajo: mantenga el sitio seguro, cubra y enmascare con cuidado, y avise de inmediato al cliente si algo sale mal. Un cambio en el alcance del trabajo puede cambiar su cobertura, así que llame a su agente si pasa.','Después del trabajo: haga el recorrido final, resuelva la lista de pendientes y guarde los documentos firmados y las fotos.','Mantenga vigente su póliza después del trabajo. La cobertura de operaciones terminadas solo ayuda si hay una póliza vigente cuando llega un reclamo.']},
 {t:'Si algo sale mal',n:['Si alguien está lesionado, llame primero al 911.','Haga seguro el área y pare el trabajo cerca del problema.','Tome fotos y video antes de mover o limpiar algo.','Anote los nombres y teléfonos de todos los involucrados y de los testigos.','No admita culpa, no prometa pagar ni firme nada. Puede decir: "Voy a reportar esto a mi seguro y lo vamos a arreglar."','Llame a su agente o aseguradora lo antes posible. Muchas pólizas exigen aviso rápido y un reporte tardío puede perjudicar el reclamo.','Guarde los recibos, mensajes y cotizaciones. No tire los objetos dañados.','En la página del trabajo, use "¿Pasó algo? Pida ayuda con el reclamo" para guardar el incidente en el historial del trabajo y preparar una hoja de reclamo que puede enviar a su agente.'],p:['Lo que debe hacer su cliente: avisarle de inmediato, tomar fotos, guardar recibos y no firmar nada que no entienda. La página de comprobante de seguro para clientes explica estos pasos.']},
 {t:'Qué decirle a sus clientes',l:['Dígales que tiene seguro y que puede enviarles el comprobante antes de empezar.','Ofrezca el enlace de su página de comprobante, o un certificado oficial de su agente si lo necesitan.','Explíqueles qué hacer si algo sale mal: avisarle de inmediato, tomar fotos y guardar los recibos.','Déjeles saber que pueden llamar a su aseguradora para confirmar que su póliza está vigente.','Si no tiene un tipo de cobertura, dígalo con honestidad y explique cómo maneja ese riesgo.']},
 {t:'Errores comunes',l:['Dejar que la póliza venza, aunque sea unos días.','Aceptar un tipo de trabajo que la póliza excluye, como trabajo exterior en altura o pintura con plomo.','No avisar al agente que agregó empleados, vehículos o nuevos tipos de trabajo.','Contratar subcontratistas sin certificado.','Creer que la póliza del hogar o la de auto personal cubre el trabajo del negocio.','No leer las exclusiones hasta después de un accidente.','Reportar un accidente tarde.','Admitir culpa en el lugar.']},
 {t:'Si todavía no tiene seguro',p:['Esto es solo para usted y nunca se muestra a sus clientes.'],l:['Probablemente le conviene tener cobertura. Un accidente sin ella se puede pagar de su bolsillo, y algunos clientes no contratan sin comprobante.','Empiece con una cotización de responsabilidad civil general. Pregunte a un agente independiente que trabaje con contratistas.','Puede seguir usando PaintersMax para hacer presupuestos y enviar contratos y facturas mientras decide. Las funciones de seguro se quedan calladas hasta que agregue una póliza.','Las reglas varían por estado, así que pregunte a un agente con licencia qué necesita para el trabajo que hace.']}
 ]}};
const L=(window.PM_LANG==='es')?'es':'en',D=C[L];
document.title=D.title+' - PaintersMax';document.documentElement.lang=L;
for(const [id,k] of [['ttl','title'],['h1','h1'],['lead','lead'],['disc','disc'],['c1','c1'],['c2','c2'],['foot','foot']])document.getElementById(id).textContent=D[k];
document.getElementById('g').innerHTML=D.topics.map((x,i)=>`<details ${i===0?'open':''}><summary>${esc(x.t)}</summary><div class="in">${(x.p||[]).map(p=>`<p>${esc(p)}</p>`).join('')}${x.l?`<ul>${x.l.map(l=>`<li>${esc(l)}</li>`).join('')}</ul>`:''}${x.n?`<ol>${x.n.map(l=>`<li>${esc(l)}</li>`).join('')}</ol>`:''}</div></details>`).join('');
