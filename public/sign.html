<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Review and sign</title>
<style>
body{font-family:Inter,system-ui,sans-serif;background:#F7F5F1;color:#0F1B2D;margin:0;padding:16px}
.wrap{max-width:820px;margin:0 auto}
h1{font-family:Newsreader,Georgia,serif;font-weight:500;font-size:26px;margin:8px 0 12px}
.card{background:#fff;border:1px solid rgba(15,27,45,.12);border-radius:8px;padding:16px;margin:14px 0}
iframe{width:100%;border:1px solid rgba(15,27,45,.12);border-radius:8px;background:#fff;min-height:400px}
label{display:block;font-weight:600;font-size:14px;margin:14px 0 4px}
input[type=text]{width:100%;box-sizing:border-box;padding:12px;border:1px solid #cfd5dc;border-radius:6px;font:inherit}
canvas{width:100%;height:150px;border:1px dashed #8a94a3;border-radius:6px;background:#fff;touch-action:none;display:block}
button{padding:12px 18px;border:0;border-radius:6px;background:#0F1B2D;color:#fff;font-weight:600;font-size:16px;cursor:pointer}
button.sec{background:#fff;color:#0F1B2D;border:1px solid #cfd5dc;font-size:14px;padding:8px 12px}
button:disabled{opacity:.5}
.chk{display:flex;gap:10px;align-items:flex-start;margin-top:14px;font-size:14px}
.chk input{margin-top:4px;width:20px;height:20px}
.bad{color:#b42318}.ok{color:#067647;font-weight:600}
</style></head><body><div class="wrap">
<h1 id="h">Review and sign</h1>
<div id="top"></div>
<iframe id="doc" sandbox="allow-same-origin" title="Document"></iframe>
<div id="sign" class="card" style="display:none">
 <label id="l_name" for="name">Type your full name</label><input type="text" id="name" autocomplete="name">
 <label id="l_draw">Draw your signature (optional)</label>
 <canvas id="pad"></canvas>
 <div style="margin-top:6px"><button class="sec" id="clear" type="button">Clear</button></div>
 <div class="chk"><input type="checkbox" id="agree"><label for="agree" id="l_agree" style="margin:0;font-weight:400"></label></div>
 <div style="margin-top:16px"><button id="go" type="button"></button></div>
 <p id="msg" class="bad"></p>
</div>
<p id="state"></p>
<p style="text-align:center;color:#4A5568;font-size:12px;margin-top:28px">Secure electronic signing by <a href="https://paintersmax.app" style="color:inherit">PaintersMax</a></p>
</div>
<script>
const $=id=>document.getElementById(id);
const t=location.pathname.split('/')[2]||'';
let es=false,drew=false;
const T={en:{h:'Review and sign',name:'Type your full name',draw:'Draw your signature (optional)',clear:'Clear',agree:'I agree to sign this document electronically. I understand my typed name and drawing have the same effect as a handwritten signature.',go:'Sign document',done:'Thank you. Your signed copy was emailed to you.',signed:'This document has been signed.',expired:'This link has expired. Please ask the company for a new one.',gone:'This request was cancelled. Please ask the company for a new link.',bad:'This signing link is not valid.',working:'Signing...'},
es:{h:'Revise y firme',name:'Escriba su nombre completo',draw:'Dibuje su firma (opcional)',clear:'Borrar',agree:'Acepto firmar este documento electrónicamente. Entiendo que mi nombre escrito y mi dibujo tienen el mismo efecto que una firma a mano.',go:'Firmar documento',done:'Gracias. Le enviamos su copia firmada por correo.',signed:'Este documento ya fue firmado.',expired:'El enlace venció. Pida uno nuevo a la empresa.',gone:'Esta solicitud fue cancelada. Pida un enlace nuevo a la empresa.',bad:'Este enlace no es válido.',working:'Firmando...'}};
const tx=k=>T[es?'es':'en'][k];
function size(){const f=$('doc');try{f.style.height=(f.contentDocument.documentElement.scrollHeight+20)+'px';}catch(e){}}
$('doc').onload=size;
const cv=$('pad'),cx=cv.getContext('2d');
function fit(){const r=cv.getBoundingClientRect(),d=window.devicePixelRatio||1;cv.width=r.width*d;cv.height=r.height*d;cx.scale(d,d);cx.lineWidth=2.2;cx.lineCap='round';cx.strokeStyle='#0F1B2D';drew=false;}
let down=false;
function pt(e){const r=cv.getBoundingClientRect();return[e.clientX-r.left,e.clientY-r.top];}
cv.addEventListener('pointerdown',e=>{down=true;cv.setPointerCapture(e.pointerId);const[x,y]=pt(e);cx.beginPath();cx.moveTo(x,y);});
cv.addEventListener('pointermove',e=>{if(!down)return;const[x,y]=pt(e);cx.lineTo(x,y);cx.stroke();drew=true;});
['pointerup','pointercancel'].forEach(n=>cv.addEventListener(n,()=>{down=false;}));
$('clear').onclick=()=>{cx.clearRect(0,0,cv.width,cv.height);drew=false;};
function labels(){document.documentElement.lang=es?'es':'en';$('h').textContent=tx('h');$('l_name').textContent=tx('name');$('l_draw').textContent=tx('draw');$('clear').textContent=tx('clear');$('l_agree').textContent=tx('agree');$('go').textContent=tx('go');}
function end(k,ok){$('sign').style.display='none';$('state').className=ok?'ok':'bad';$('state').textContent=tx(k);}
fetch('/api/sign/view?t='+encodeURIComponent(t)).then(r=>r.json()).then(d=>{
 if(d.error){end('bad');$('doc').style.display='none';return;}
 es=d.language==='es';labels();
 $('top').textContent=d.company||'';
 if(d.html)$('doc').srcdoc=d.html;else $('doc').style.display='none';
 if(d.status==='signed'){end('signed',true);return;}
 if(d.status==='expired'){end('expired');return;}
 if(d.status==='void'){end('gone');return;}
 $('name').value=d.signerName||'';$('sign').style.display='block';fit();
}).catch(()=>end('bad'));
$('go').onclick=async()=>{
 $('msg').textContent='';$('go').disabled=true;$('go').textContent=tx('working');
 try{
  const body={t,name:$('name').value,agree:$('agree').checked,drawing:drew?cv.toDataURL('image/png'):null};
  const r=await fetch('/api/sign/submit',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(body)});
  const j=await r.json().catch(()=>({}));
  if(!r.ok)throw new Error(j.error||'Something went wrong.');
  const v=await (await fetch('/api/sign/view?t='+encodeURIComponent(t))).json();
  if(v.html)$('doc').srcdoc=v.html;
  end('done',true);window.scrollTo(0,0);
 }catch(e){$('msg').textContent=e.message;$('go').disabled=false;$('go').textContent=tx('go');}
};
</script></body></html>
