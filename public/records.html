<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Records - PaintersMax</title><script src="/i18n.js" data-app></script>
<style>
*{box-sizing:border-box}
body{font-family:Inter,system-ui,sans-serif;background:#F7F5F1;color:#0F1B2D;margin:0}
header{background:#0F1B2D;color:#fff;padding:14px 16px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px}
header b{font-family:Newsreader,Georgia,serif;font-size:19px;font-weight:500}
header a{color:#E8A33D;font-size:14px;text-decoration:none;margin-left:12px}
main{max-width:980px;margin:0 auto;padding:16px 12px 60px}
h1{font-family:Newsreader,Georgia,serif;font-weight:500;font-size:28px;margin:8px 0}
h3{margin:18px 0 6px}
.card{background:#fff;border:1px solid rgba(15,27,45,.1);border-radius:10px;padding:14px;margin:0 0 14px}
button,.btn{font:inherit;font-weight:700;border:0;border-radius:8px;padding:9px 13px;background:#E8A33D;color:#0F1B2D;cursor:pointer;text-decoration:none;display:inline-block}button.s,.btn.s{background:#eceae4}button.d{background:#fff;border:1px solid #cfd5dc;color:#b42318}button.mini{padding:4px 9px;font-size:13px}
label{display:block;font-size:13px;font-weight:600;margin:10px 0 3px}input,textarea,select{font:inherit;width:100%;padding:9px;border:1px solid #cfd5dc;border-radius:8px;background:#fff}
.row{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.row3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}@media(max-width:620px){.row,.row3{grid-template-columns:1fr 1fr}}
.muted{color:#4A5568;font-size:14px}.ok{color:#0a7a3d;font-weight:600}.bad{color:#b42318;font-weight:600}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0 14px}.tabs button{background:#eceae4}.tabs button.on{background:#0F1B2D;color:#fff}
table{width:100%;border-collapse:collapse}th,td{padding:7px 4px;border-bottom:1px solid #eee;text-align:left;font-size:14px;vertical-align:top}td.r,th.r{text-align:right}
.sum{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}.sum div{background:#fff;border:1px solid rgba(15,27,45,.1);border-radius:10px;padding:10px}.sum b{display:block;font-size:22px;font-family:Newsreader,Georgia,serif;font-weight:500}
.bar{height:8px;border-radius:5px;background:#E8A33D}
.note{background:#fff8e6;border-left:4px solid #E8A33D;padding:8px 10px;border-radius:6px;font-size:14px}
.scroll{overflow-x:auto}
</style></head><body>
<header><div><b>PaintersMax</b> Records</div><div><a href="/jobs">Jobs</a><a href="/calendar">Calendar</a><a href="/dashboard">Settings and leads</a></div></header>
<main>
<h1>Expenses, mileage and records</h1>
<p class="muted">Records for your accountant, not tax advice. Download them any time.</p>
<div id="msg" class="muted"></div>
<div class="tabs" id="tabs"><button data-t="exp" class="on">Expenses</button><button data-t="mil">Mileage</button><button data-t="imp">Import from bank or card</button><button data-t="out">Download</button><button data-t="set">Settings</button></div>
<div class="row3" style="margin-bottom:10px"><div><label for="yr">Year</label><select id="yr"></select></div></div>
<div class="sum" id="sum"></div>
<div id="pane"></div>
</main>
<script>
var $=function(i){return document.getElementById(i)};
var T=window.pmT||function(s){return s};
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function msg(t,c){$('msg').textContent=t||'';$('msg').className=c||'muted';}
function api(p,b){return fetch(p,b?{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(b)}:undefined).then(function(r){if(r.status===401){location.href='/login';throw 0;}return r.json().then(function(j){if(!r.ok)throw new Error(j.error||'Something went wrong.');return j;});});}
function $$(c){return '$'+(c/100).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});}
var D=null,tab='exp',year=String(new Date().getFullYear()),PRE=null,RECEIPT=null;
var today=function(){var d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');};
var qs=new URLSearchParams(location.search),JOBQ=qs.get('job')||'';
(function(){var y=new Date().getFullYear(),h='';for(var i=y;i>=y-5;i--)h+='<option>'+i+'</option>';$('yr').innerHTML=h;$('yr').value=year;})();
$('yr').onchange=function(){year=$('yr').value;load();};
$('tabs').onclick=function(e){var t=e.target.dataset&&e.target.dataset.t;if(!t)return;tab=t;[].forEach.call($('tabs').children,function(b){b.className=b.dataset.t===t?'on':''});draw();};
function load(){return api('/api/records?year='+year).then(function(r){D=r;draw();}).catch(function(e){if(e)msg(e.message,'bad');});}
function jobOpts(sel){return '<option value="">'+T('General (not tied to a job)')+'</option>'+D.jobs.map(function(j){return '<option value="'+j.id+'"'+(String(sel)===String(j.id)?' selected':'')+'>'+esc(j.title+' - '+j.customer)+'</option>'}).join('');}
function catOpts(sel){return D.categories.map(function(c){return '<option'+(c===sel?' selected':'')+'>'+esc(c)+'</option>'}).join('');}
function drawSum(){var s=D.summary,cats=Object.keys(s.byCategory).sort(function(a,b){return s.byCategory[b]-s.byCategory[a]});
 $('sum').innerHTML='<div><span class="muted">'+T('Expenses this year')+'</span><b>'+$$(s.totalCents)+'</b></div><div><span class="muted">'+T('Miles driven')+'</span><b>'+s.miles+'</b>'+(s.mileageValueCents!=null?'<span class="muted">'+T('Value at your rate')+': '+$$(s.mileageValueCents)+'</span>':'<span class="muted">'+T('Set your mileage rate in Settings')+'</span>')+'</div>'+
 (cats.length?'<div style="grid-column:span 2"><span class="muted">'+T('By category')+'</span>'+cats.slice(0,6).map(function(c){var w=Math.max(3,Math.round(100*s.byCategory[c]/s.totalCents));return '<div style="display:flex;gap:8px;align-items:center;border:0;padding:2px 0"><span style="width:130px;font-size:13px">'+esc(c)+'</span><span class="bar" style="width:'+w+'%;flex:none;max-width:45%"></span><span style="font-size:13px">'+$$(s.byCategory[c])+'</span></div>'}).join('')+'</div>':'');}
function draw(){if(!D)return;drawSum();var p=$('pane');
 if(tab==='exp')p.innerHTML=expPane();else if(tab==='mil')p.innerHTML=milPane();else if(tab==='imp')p.innerHTML=impPane();else if(tab==='out')p.innerHTML=outPane();else p.innerHTML=setPane();
 if(tab==='exp'&&!$('x_date').value)$('x_date').value=today();if(tab==='mil'&&!$('m_date').value)$('m_date').value=today();}
function expPane(){
 var rows=D.expenses.map(function(e){return '<tr><td>'+esc(e.spentOn)+'</td><td>'+esc(e.vendor||'')+(e.note?'<div class="muted">'+esc(e.note)+'</div>':'')+'</td><td>'+esc(e.category)+'</td><td>'+esc(e.jobTitle||T('General'))+'</td><td class="r">'+$$(e.amountCents)+'</td><td>'+(e.fileId?'<a href="/api/files?id='+e.fileId+'" target="_blank">'+T('Receipt')+'</a> ':'')+'<button class="mini d" data-xdel="'+e.id+'">'+T('Delete')+'</button></td></tr>'}).join('');
 var al=D.receiptAllowance;
 return '<div class="card"><b>'+T('Quick add')+'</b><div class="row"><div><label>'+T('Amount ($)')+'</label><input id="x_amt" inputmode="decimal" placeholder="0.00"></div><div><label>'+T('Date')+'</label><input id="x_date" type="date"></div><div><label>'+T('Vendor')+'</label><input id="x_ven" maxlength="80" placeholder="Sherwin-Williams"></div><div><label>'+T('Category')+'</label><select id="x_cat">'+catOpts('Materials')+'</select></div></div>'+
 '<div class="row3"><div><label>'+T('Job')+'</label><select id="x_job">'+jobOpts(JOBQ)+'</select></div><div style="grid-column:span 2"><label>'+T('Note (optional)')+'</label><input id="x_note" maxlength="300"></div></div>'+
 '<div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;align-items:center"><button id="x_save">'+T('Save expense')+'</button><label class="btn s" style="margin:0;cursor:pointer">'+T('Add receipt photo')+'<input id="x_file" type="file" accept="image/*" style="display:none"></label><span id="x_rc" class="muted"></span></div>'+
 '<div id="x_read"></div><small class="muted">'+T('After the first time, a vendor fills in its own category. Photos are shrunk on your phone before upload.')+'</small></div>'+
 '<div class="card scroll"><table><thead><tr><th>'+T('Date')+'</th><th>'+T('Vendor')+'</th><th>'+T('Category')+'</th><th>'+T('Job')+'</th><th class="r">'+T('Amount')+'</th><th></th></tr></thead><tbody>'+(rows||'<tr><td colspan="6" class="muted">'+T('No expenses for this year yet.')+'</td></tr>')+'</tbody></table></div>';}
function milPane(){var r=D.settings.mileageRateCents;
 var rows=D.trips.map(function(t){return '<tr><td>'+esc(t.tripOn)+'</td><td>'+esc(t.jobTitle||T('General'))+(t.note?'<div class="muted">'+esc(t.note)+'</div>':'')+'</td><td class="r">'+t.miles+'</td><td class="r">'+(r?$$(Math.round(t.miles*r)):'')+'</td><td><button class="mini d" data-tdel="'+t.id+'">'+T('Delete')+'</button></td></tr>'}).join('');
 return '<div class="card"><b>'+T('Add a trip')+'</b>'+(r?'':'<div class="note" style="margin-top:6px">'+T('Set your mileage rate in Settings to see the value of each trip. The IRS rate changes every year, so check the current rate.')+'</div>')+'<div class="row"><div><label>'+T('Miles')+'</label><input id="m_mi" inputmode="decimal"></div><div><label>'+T('Date')+'</label><input id="m_date" type="date"></div><div style="grid-column:span 2"><label>'+T('Job')+'</label><select id="m_job">'+jobOpts(JOBQ)+'</select></div></div><label>'+T('Note (optional)')+'</label><input id="m_note" maxlength="200"><div style="margin-top:10px"><button id="m_save">'+T('Save trip')+'</button></div></div>'+
 '<div class="card scroll"><table><thead><tr><th>'+T('Date')+'</th><th>'+T('Job')+'</th><th class="r">'+T('Miles')+'</th><th class="r">'+T('Value')+'</th><th></th></tr></thead><tbody>'+(rows||'<tr><td colspan="5" class="muted">'+T('No trips for this year yet.')+'</td></tr>')+'</tbody></table></div>';}
function impPane(){
 var pre=PRE?('<p><b>'+PRE.rows.length+'</b> '+T('expenses found')+(PRE.skipped?' ('+PRE.skipped+' '+T('credits or unreadable rows skipped')+')':'')+'. '+T('Uncheck any that are not business expenses. Duplicates are unchecked for you.')+'</p><div class="scroll"><table><thead><tr><th></th><th>'+T('Date')+'</th><th>'+T('Vendor')+'</th><th>'+T('Category')+'</th><th class="r">'+T('Amount')+'</th></tr></thead><tbody>'+PRE.rows.map(function(r,i){return '<tr><td><input type="checkbox" data-pi="'+i+'" style="width:auto"'+(r.duplicate?'':' checked')+'></td><td>'+esc(r.spentOn)+'</td><td>'+esc(r.vendor)+(r.duplicate?' <span class="muted">('+T('already saved')+')</span>':'')+'</td><td><select data-pc="'+i+'">'+catOpts(r.category)+'</select></td><td class="r">'+$$(r.amountCents)+'</td></tr>'}).join('')+'</tbody></table></div><label>'+T('Put all of these on one job (optional)')+'</label><select id="i_job">'+jobOpts('')+'</select><div style="margin-top:10px"><button id="i_commit">'+T('Add the checked expenses')+'</button> <button class="s" id="i_cancel">'+T('Cancel')+'</button></div>'):'';
 return '<div class="card"><b>'+T('Import a month of expenses')+'</b><p class="muted">'+T('Download your bank or credit card transactions as a CSV file, then choose it here. Nothing is saved until you check the list. No AI is used, so it costs nothing.')+'</p><input id="i_file" type="file" accept=".csv,text/csv">'+pre+'</div>';}
function outPane(){var y=year,q=D.settings;
 var csv=function(k,l){return '<a class="btn s" href="/api/records?export='+k+'&year='+y+'">'+T(l)+'</a>';};
 return '<div class="card"><b>'+T('Download your records')+' ('+y+')</b><p class="muted">'+T('Spreadsheet files (CSV) that open in Excel or Google Sheets and that your accountant can use. Records only, not tax advice.')+'</p><div style="display:flex;gap:8px;flex-wrap:wrap">'+csv('expenses','Expenses (CSV)')+csv('mileage','Mileage (CSV)')+csv('income','Invoices (CSV)')+'<a class="btn s" href="/crew">'+T('Crew hours and 1099 list')+'</a></div><p class="muted" style="margin-top:10px">'+T('Your data stays safe here. We still suggest downloading at least once a year, at tax time.')+'</p></div>'+
 '<div class="card"><b>QuickBooks</b><p class="muted">'+T('Files built to the formats QuickBooks publishes. Try a small file first, or make a backup of your company file. We cannot test inside your QuickBooks.')+'</p>'+
 '<p><b>QuickBooks Online</b><br><span class="muted">'+T('Banking, then Upload transactions. Pick the bank or card account that paid. The file has Date, Description and Amount, with payments as negative amounts. The description shows vendor, category and job, so you can assign them in QuickBooks. If the same charges also come in from your bank feed, they may show twice: upload only the ones that are not in your feed.')+'</span><br><span style="display:inline-block;margin-top:6px">'+csv('qbo','QuickBooks Online file (CSV)')+'</span></p>'+
 '<p><b>QuickBooks Desktop</b><br><span class="muted">'+T('File menu, Utilities, Import, IIF Files. First create these expense accounts in QuickBooks, or it may create them as the wrong type:')+' '+(D.qbAccounts.length?esc(D.qbAccounts.join(', ')):'-')+'. '+T('Intuit does not provide support for IIF files, so check the imported entries.')+'</span></p>'+
 '<div class="row3"><div><label>'+T('Account that paid (must exist in QuickBooks)')+'</label><input id="q_acct" maxlength="60" value="'+esc(q.qbPayAccount)+'"></div><div><label>'+T('That account is a')+'</label><select id="q_type"><option value="check"'+(q.qbPayType==='card'?'':' selected')+'>'+T('Bank account (checks)')+'</option><option value="card"'+(q.qbPayType==='card'?' selected':'')+'>'+T('Credit card')+'</option></select></div><div><label>&nbsp;</label><button class="s" id="q_save">'+T('Save account')+'</button></div></div>'+
 '<p style="margin-top:8px">'+csv('iif','QuickBooks Desktop file (IIF)')+'</p></div>';}
function setPane(){var s=D.settings,rules=Object.keys(s.rules);
 return '<div class="card"><b>'+T('Mileage rate')+'</b><p class="muted">'+T('Cents per mile. The IRS rate changes every year, so we do not fill it in. Check the current rate at IRS.gov or ask your accountant.')+'</p><div class="row"><div><label>'+T('Cents per mile')+'</label><input id="s_rate" inputmode="decimal" value="'+(s.mileageRateCents||'')+'"></div><div><label>'+T('1099 reporting threshold ($)')+'</label><input id="s_th" inputmode="decimal" value="'+(s.threshold1099Cents/100)+'"></div></div><small class="muted">'+T('The 1099 amount changes by law (it is $2,000 for payments after Dec 31, 2025). Confirm with your accountant or IRS.gov.')+'</small><div style="margin-top:10px"><button id="s_save">'+T('Save settings')+'</button></div></div>'+
 '<div class="card"><b>'+T('Your own categories')+'</b><div class="row3"><div style="grid-column:span 2"><input id="c_name" maxlength="40" placeholder="'+T('Example: Dumpster rental')+'"></div><div><button id="c_add">'+T('Add category')+'</button></div></div><div style="margin-top:8px">'+(D.customCategories.length?D.customCategories.map(function(c){return '<span class="muted">'+esc(c.name)+' <button class="mini d" data-cdel="'+c.id+'">&times;</button></span> &nbsp; '}).join(''):'<span class="muted">'+T('None yet.')+'</span>')+'</div></div>'+
 '<div class="card"><b>'+T('Saved vendor rules')+'</b><p class="muted">'+T('When you save an expense, its vendor remembers the category. Remove a rule here if it is wrong.')+'</p>'+(rules.length?rules.map(function(k){return '<div style="display:flex;justify-content:space-between;border-top:1px solid #eee;padding:5px 0"><span>'+esc(k)+' &rarr; '+esc(s.rules[k])+'</span><button class="mini d" data-rdel="'+esc(k)+'">'+T('Remove')+'</button></div>'}).join(''):'<span class="muted">'+T('None yet.')+'</span>')+'</div>';}
function shrink(f){return new Promise(function(res){if(!f.type.startsWith('image/')||f.type==='image/gif'){res(f);return;}var im=new Image();im.onload=function(){var s=Math.min(1,1600/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*s);c.height=Math.round(im.height*s);c.getContext('2d').drawImage(im,0,0,c.width,c.height);c.toBlob(function(b){res(b?new File([b],(f.name||'receipt').replace(/\.\w+$/,'')+'.jpg',{type:'image/jpeg'}):f)},'image/jpeg',0.82)};im.onerror=function(){res(f)};im.src=URL.createObjectURL(f)});}
function dollars(v){var n=Number(String(v).replace(/[$,]/g,''));return Math.round((n||0)*100);}
document.addEventListener('change',function(e){var t=e.target;
 if(t.id==='x_ven'){var k=(t.value||'').toLowerCase().trim();if(k){var rules=D.settings.rules;for(var r in rules){if(r&&k.indexOf(r)>=0){$('x_cat').value=rules[r];break;}}}}
 else if(t.id==='x_file'&&t.files[0]){shrink(t.files[0]).then(function(b){var fd=new FormData();fd.append('file',b);fd.append('kind','receipt');return fetch('/api/files',{method:'POST',body:fd})}).then(function(r){return r.json().then(function(j){if(!r.ok)throw new Error(j.error||'Could not upload.');return j;})}).then(function(j){RECEIPT=j.id;$('x_rc').textContent=T('Receipt photo added.');var al=D.receiptAllowance;$('x_read').innerHTML='<div style="margin-top:8px"><button class="s" id="x_ai">'+T('Read this receipt for me')+'</button> <span class="muted">'+(al?(al.limit>0?(al.limit-al.used)+' '+T('reads left this month'):T('Not in your plan')):'')+'</span></div>';}).catch(function(x){msg(x.message,'bad')});}
 else if(t.id==='i_file'&&t.files[0]){t.files[0].text().then(function(tx){return api('/api/records',{action:'csvPreview',text:tx})}).then(function(r){PRE=r;draw();}).catch(function(x){if(x)msg(x.message,'bad')});}
 else if(t.dataset&&t.dataset.pc!==undefined){PRE.rows[+t.dataset.pc].category=t.value;}
});
document.addEventListener('click',function(e){var t=e.target,d=t.dataset||{},id=t.id;
 var act=function(p,after){p.then(function(){if(after)after();return load();}).catch(function(x){if(x)msg(x.message,'bad')});};
 if(id==='x_save'){var amt=dollars($('x_amt').value);act(api('/api/records',{action:'addExpense',amountCents:amt,spentOn:$('x_date').value,vendor:$('x_ven').value,category:$('x_cat').value,jobId:$('x_job').value,note:$('x_note').value,fileId:RECEIPT,source:RECEIPT&&window.RDRAFT?'receipt':'manual'}).then(function(r){msg(r.ruleSaved?T('Saved. This vendor will fill its category next time.'):T('Saved.'),'ok');RECEIPT=null;window.RDRAFT=false;}));}
 else if(id==='x_ai'){t.disabled=true;t.textContent=T('Reading...');api('/api/records',{action:'readReceipt',fileId:RECEIPT}).then(function(r){var dr=r.draft;if(dr.vendor)$('x_ven').value=dr.vendor;if(dr.spentOn)$('x_date').value=dr.spentOn;if(dr.amountCents)$('x_amt').value=(dr.amountCents/100).toFixed(2);if(dr.category)$('x_cat').value=dr.category;if(dr.note)$('x_note').value=dr.note;window.RDRAFT=true;msg(T('Check what was read, fix anything wrong, then save.'),'ok');t.remove();}).catch(function(x){msg(x.message,'bad');t.disabled=false;t.textContent=T('Read this receipt for me');});}
 else if(d.xdel){if(confirm(T('Delete this expense?')))act(api('/api/records',{action:'deleteExpense',id:+d.xdel}));}
 else if(id==='m_save'){act(api('/api/records',{action:'addTrip',miles:$('m_mi').value,tripOn:$('m_date').value,jobId:$('m_job').value,note:$('m_note').value}).then(function(){msg(T('Saved.'),'ok')}));}
 else if(d.tdel){if(confirm(T('Delete this trip?')))act(api('/api/records',{action:'deleteTrip',id:+d.tdel}));}
 else if(id==='i_cancel'){PRE=null;draw();}
 else if(id==='i_commit'){var rows=[];document.querySelectorAll('[data-pi]').forEach(function(c){if(c.checked)rows.push(PRE.rows[+c.dataset.pi]);});act(api('/api/records',{action:'csvCommit',rows:rows,jobId:$('i_job').value}).then(function(r){msg(r.added+' '+T('expenses added.'),'ok');PRE=null;}));}
 else if(id==='s_save'){act(api('/api/records',{action:'saveSettings',mileageRateCents:$('s_rate').value,threshold1099Cents:dollars($('s_th').value)}).then(function(){msg(T('Saved.'),'ok')}));}
 else if(id==='q_save'){act(api('/api/records',{action:'saveSettings',qbPayAccount:$('q_acct').value,qbPayType:$('q_type').value}).then(function(){msg(T('Saved.'),'ok')}));}
 else if(id==='c_add'){act(api('/api/records',{action:'addCategory',name:$('c_name').value}));}
 else if(d.cdel){act(api('/api/records',{action:'deleteCategory',id:+d.cdel}));}
 else if(d.rdel){var r2=Object.assign({},D.settings.rules);delete r2[d.rdel];act(api('/api/records',{action:'saveSettings',rules:r2}));}
});
if(JOBQ){tab='exp';}
load();
</script></body></html>
