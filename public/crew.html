<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Crew and hours - PaintersMax</title><script src="/i18n.js" data-app></script>
<style>
*{box-sizing:border-box}
body{font-family:Inter,system-ui,sans-serif;background:#F7F5F1;color:#0F1B2D;margin:0}
header{background:#0F1B2D;color:#fff;padding:14px 16px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px}
header b{font-family:Newsreader,Georgia,serif;font-size:19px;font-weight:500}
header a{color:#E8A33D;font-size:14px;text-decoration:none;margin-left:12px}
main{max-width:980px;margin:0 auto;padding:16px 12px 60px}
h1{font-family:Newsreader,Georgia,serif;font-weight:500;font-size:28px;margin:8px 0}
.card{background:#fff;border:1px solid rgba(15,27,45,.1);border-radius:10px;padding:14px;margin:0 0 14px}
button,.btn{font:inherit;font-weight:700;border:0;border-radius:8px;padding:9px 13px;background:#E8A33D;color:#0F1B2D;cursor:pointer;text-decoration:none;display:inline-block}button.s,.btn.s{background:#eceae4}button.d{background:#fff;border:1px solid #cfd5dc;color:#b42318}button.mini,.btn.mini{padding:4px 9px;font-size:13px}
label{display:block;font-size:13px;font-weight:600;margin:10px 0 3px}input,textarea,select{font:inherit;width:100%;padding:9px;border:1px solid #cfd5dc;border-radius:8px;background:#fff}
.row{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.row3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}@media(max-width:620px){.row,.row3{grid-template-columns:1fr 1fr}}
.muted{color:#4A5568;font-size:14px}.ok{color:#0a7a3d;font-weight:600}.bad{color:#b42318;font-weight:600}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0 14px}.tabs button{background:#eceae4}.tabs button.on{background:#0F1B2D;color:#fff}
table{width:100%;border-collapse:collapse}th,td{padding:7px 4px;border-bottom:1px solid #eee;text-align:left;font-size:14px;vertical-align:top}td.r,th.r{text-align:right}
.scroll{overflow-x:auto}.note{background:#fff8e6;border-left:4px solid #E8A33D;padding:8px 10px;border-radius:6px;font-size:14px}
.wk{display:flex;gap:8px;align-items:center;margin-bottom:8px}.wk b{flex:1;text-align:center}
.ph{width:44px;height:44px;border-radius:50%;object-fit:cover;background:#eceae4;display:inline-block;vertical-align:middle;margin-right:8px}
.lock{background:repeating-linear-gradient(135deg,#fff,#fff 10px,#faf7f0 10px,#faf7f0 20px)}
details.g{border:1px solid #e6e3dc;border-radius:8px;margin:8px 0;background:#fff}details.g>summary{cursor:pointer;padding:9px 12px;font-weight:600}details.g .inner{padding:0 12px 8px}
.btn.mini{padding:4px 9px;font-size:13px}
</style></head><body>
<header><div><b>PaintersMax</b> Crew and hours</div><div><a href="/jobs">Jobs</a><a href="/records">Records</a><a href="/calendar">Calendar</a><a href="/dashboard">Settings and leads</a></div></header>
<main>
<h1>Crew, hours and pay records</h1>
<p class="muted">Records for your accountant, not tax advice. We do not store Social Security or tax ID numbers. Pay records are visible only to the owner login.</p>
<div id="msg" class="muted"></div>
<div id="body"></div>
</main>
<script>
var $=function(i){return document.getElementById(i)};
var T=window.pmT||function(s){return s};
var DT=window.pmDate||function(s){return s};
var HELP=window.pmHelp||function(){return ''};
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function msg(t,c){$('msg').textContent=t||'';$('msg').className=c||'muted';}
function api(p,b){return fetch(p,b?{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(b)}:undefined).then(function(r){if(r.status===401){location.href='/login';throw 0;}return r.json().then(function(j){if(!r.ok)throw new Error(j.error||'Something went wrong.');return j;});});}
function $$(c){return '$'+(c/100).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});}
var D=null,tab='crew',year=String(new Date().getFullYear()),EDIT=null,SEL=0,WEEK='',TS=null;
var today=function(){var d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');};
function shiftWeek(w,n){var d=new Date(w+'T00:00:00Z');d.setUTCDate(d.getUTCDate()+7*n);return d.toISOString().slice(0,10);}
var UNIT={hour:'per hour',day:'per day',job:'per job'};
var METHOD={cash:'Cash',check:'Check',direct_deposit:'Direct deposit or bank transfer',zelle:'Zelle',cash_app:'Cash App',venmo:'Venmo',paypal:'PayPal',other:'Other'};
var KIND={sick:'Sick',vacation:'Vacation',holiday:'Holiday',absent:'Absent (did not show up)',late:'Late',other:'Other time off'};
function wkStart(d){var t=new Date(d+'T00:00:00Z');var back=(t.getUTCDay()+6)%7;t.setUTCDate(t.getUTCDate()-back);return t.toISOString().slice(0,10);}
var MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
function load(){return api('/api/crew?year='+year).then(function(r){D=r;if(!SEL&&D.workers&&D.workers.length)SEL=D.workers.filter(function(w){return w.active})[0]?D.workers.filter(function(w){return w.active})[0].id:0;draw();}).catch(function(e){if(e)msg(e.message,'bad');});}
function tabs(){return '<div class="tabs" id="tabs">'+[['crew','Crew'],['time','Time sheet'],['pay','Payments'],['rep','Reports and 1099']].map(function(t){return '<button data-t="'+t[0]+'"'+(tab===t[0]?' class="on"':'')+'>'+T(t[1])+'</button>'}).join('')+'</div>';}
function teaser(){return '<div class="card lock"><h3 style="margin-top:0">'+T('Crew pay and 1099 tracking')+'</h3><p>'+T('Keep every worker in one place: photo, position, start date and pay rate, a weekly time sheet, hours and pay per job, week, month and year, and a year-end list of contractors who need a 1099.')+'</p><ul><li>'+T('Printable employee profile for your paper records')+'</li><li>'+T('W-9 file on record, no tax ID numbers stored')+'</li><li>'+T('CSV downloads for your accountant')+'</li></ul><p class="muted">'+T('Example: Luis, painter, $22 per hour, 38.5 hours this week on the Smith job.')+'</p><a class="btn" href="/dashboard#billing">'+T('See Basic and Pro plans')+'</a></div>';}
function draw(){var b=$('body');if(!D)return;if(D.locked){b.innerHTML=teaser();return;}
 b.innerHTML='<div class="row3"><div><label for="yr">'+T('Year')+'</label><select id="yr">'+yearOpts()+'</select></div></div>'+tabs()+'<div id="pane"></div>';
 var p=$('pane');if(tab==='crew')p.innerHTML=crewPane();else if(tab==='time')p.innerHTML=timePane();else if(tab==='pay')p.innerHTML=payPane();else p.innerHTML=repPane();
 if(tab==='time'&&SEL)loadTs();}
function yearOpts(){var y=new Date().getFullYear(),h='';for(var i=y;i>=y-5;i--)h+='<option'+(String(i)===year?' selected':'')+'>'+i+'</option>';return h;}
function active(){return D.workers.filter(function(w){return w.active});}
function jobOpts(sel){return '<option value="">'+T('No job')+'</option>'+D.jobs.map(function(j){return '<option value="'+j.id+'"'+(String(sel)===String(j.id)?' selected':'')+'>'+esc(j.title+' - '+j.customer)+'</option>'}).join('');}
function workerOpts(sel){return active().map(function(w){return '<option value="'+w.id+'"'+(w.id===sel?' selected':'')+'>'+esc(w.name)+'</option>'}).join('');}
function crewPane(){
 var list=D.workers.map(function(w){return '<tr'+(w.active?'':' style="opacity:.55"')+'><td>'+(w.photoFileId?'<img class="ph" src="/api/files?id='+w.photoFileId+'" alt="">':'<span class="ph"></span>')+'<b>'+esc(w.name)+'</b><div class="muted">'+(w.kind==='contractor'?T('1099 contractor'):T('Employee'))+(w.position?' &middot; '+esc(w.position):'')+(w.active?'':' &middot; '+T('removed'))+'</div>'+(w.kind==='contractor'?(w.w9FileId?'<div class="ok" style="font-size:12px">'+T('W-9 on file')+'</div>':'<div class="bad" style="font-size:12px">'+T('No W-9 yet')+' <button class="mini s" data-edit="'+w.id+'">'+T('Add it')+'</button></div>'):'')+'</td><td>'+(w.payCents?$$(w.payCents)+' '+T(UNIT[w.payUnit]):'')+'</td><td class="r">'+w.hours+' '+T('hrs')+'</td><td class="r"><button class="mini s" data-edit="'+w.id+'">'+T('Edit')+'</button> <button class="mini s" data-ts="'+w.id+'">'+T('Time sheet')+'</button> <a class="btn mini s" href="/api/crew?profile='+w.id+'&year='+year+'" target="_blank">'+T('Profile')+'</a></td></tr>'}).join('');
 return '<div class="card scroll"><table><thead><tr><th>'+T('Name')+'</th><th>'+T('Pay rate')+'</th><th class="r">'+year+'</th><th></th></tr></thead><tbody>'+(list||'<tr><td colspan="4" class="muted">'+T('No workers yet. Add your first one below.')+'</td></tr>')+'</tbody></table></div>'+(EDIT?editCard(EDIT):'<button id="w_new">'+T('Add a worker')+'</button>');}
function editCard(w){var f=w.id?D.workers.find(function(x){return x.id===w.id}):w;f=f||w;
 return '<div class="card"><b>'+(f.id?T('Edit worker'):T('New worker'))+'</b><div class="row"><div style="grid-column:span 2"><label>'+T('Name')+'</label><input id="w_name" maxlength="80" value="'+esc(f.name||'')+'"></div><div><label>'+T('Type')+'</label><select id="w_kind"><option value="employee"'+(f.kind==='contractor'?'':' selected')+'>'+T('Employee')+'</option><option value="contractor"'+(f.kind==='contractor'?' selected':'')+'>'+T('1099 contractor')+'</option></select></div><div><label>'+T('Position')+'</label><input id="w_pos" maxlength="60" value="'+esc(f.position||'')+'"></div></div>'+
 '<div class="row"><div><label>'+T('Pay ($)')+'</label><input id="w_pay" inputmode="decimal" value="'+(f.payCents?f.payCents/100:'')+'"></div><div><label>'+T('Paid by')+'</label><select id="w_unit">'+['hour','day','job'].map(function(u){return '<option value="'+u+'"'+(f.payUnit===u?' selected':'')+'>'+T(UNIT[u])+'</option>'}).join('')+'</select></div><div><label>'+T('Start date')+'</label><input id="w_start" type="date" value="'+esc(f.startedOn||'')+'"></div><div><label>'+T('Phone')+'</label><input id="w_phone" maxlength="30" value="'+esc(f.phone||'')+'"></div></div>'+
 '<label>Email</label><input id="w_email" maxlength="120" value="'+esc(f.email||'')+'"><label>'+T('Notes')+'</label><textarea id="w_notes" rows="2" maxlength="1000">'+esc(f.notes||'')+'</textarea>'+
 (f.id?'<div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;align-items:center"><label class="btn s" style="margin:0;cursor:pointer">'+T('Add or change photo')+'<input type="file" accept="image/*" data-up="worker_photo" style="display:none"></label>'+(f.kind==='contractor'?'<label class="btn s" style="margin:0;cursor:pointer">'+T('Upload W-9')+'<input type="file" accept="image/*,application/pdf" data-up="w9" style="display:none"></label><span class="muted">'+(f.w9FileId?T('W-9 on file')+' <a href="/api/files?id='+f.w9FileId+'" target="_blank">'+T('View')+'</a> <button class="mini d" data-delfile="'+f.w9FileId+'">'+T('Delete file')+'</button>':T('No W-9 on file'))+'</span>':'')+(f.photoFileId?'<button class="mini d" data-delfile="'+f.photoFileId+'">'+T('Delete photo')+'</button>':'')+'</div><small class="muted">'+T('Print the profile, then delete files here if you want to free up storage. The hours and pay records stay.')+'</small>':'<small class="muted">'+T('Save first, then you can add a photo and W-9.')+'</small>')+
 '<div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:12px"><button id="w_save" data-id="'+(f.id||'')+'">'+T('Save worker')+'</button><button class="s" id="w_cancel">'+T('Cancel')+'</button>'+(f.id&&f.active?'<button class="d" id="w_rm" data-id="'+f.id+'">'+T('Remove from active crew')+'</button>':'')+'</div></div>';}
function timePane(){if(!active().length)return '<div class="card muted">'+T('Add a worker first.')+'</div>';if(!WEEK)WEEK=today();
 return '<div class="card"><div class="row"><div style="grid-column:span 2"><label>'+T('Worker')+'</label><select id="t_w">'+workerOpts(SEL)+'</select></div></div><div class="wk"><button class="s" id="t_prev">&larr;</button><b id="t_lbl"></b><button class="s" id="t_next">&rarr;</button></div><div id="t_list" class="scroll"></div></div>'+
 '<div class="card"><b>'+T('Add hours')+'</b><div class="row"><div><label>'+T('Date')+'</label><input id="t_date" type="date" value="'+today()+'"></div><div style="grid-column:span 3"><label>'+T('Job')+'</label><select id="t_job">'+jobOpts('')+'</select></div></div><div class="row"><div><label>'+T('Clock in')+'</label><input id="t_in" type="time"></div><div><label>'+T('Clock out')+'</label><input id="t_out" type="time"></div><div><label>'+T('Break (minutes)')+'</label><input id="t_brk" inputmode="numeric" placeholder="0"></div><div><label>'+T('or Hours')+'</label><input id="t_hrs" inputmode="decimal" placeholder="8"></div></div><label>'+T('Note (optional)')+'</label><input id="t_note" maxlength="200"><div style="margin-top:10px"><button id="t_add">'+T('Save hours')+'</button></div></div>'+
 '<div class="card"><b>'+T('Record time off or an absence')+'</b>'+HELP(T('Use this for a sick day, vacation, a holiday, a day someone did not show up, or a late arrival. It does not add work hours. It lets you see, at the end of the year, how often each person was out.'))+'<div class="row"><div><label>'+T('Date')+'</label><input id="a_date" type="date" value="'+today()+'"></div><div><label>'+T('What happened')+'</label><select id="a_kind">'+Object.keys(KIND).map(function(k){return '<option value="'+k+'">'+T(KIND[k])+'</option>'}).join('')+'</select></div><div><label>'+T('Paid hours (optional)')+'</label><input id="a_hrs" inputmode="decimal" placeholder="8"></div><div><label>'+T('Note (optional)')+'</label><input id="a_note" maxlength="200"></div></div><div style="margin-top:10px"><button id="a_add">'+T('Save time off')+'</button></div><small class="muted">'+T('This is for the worker chosen at the top of this tab.')+'</small></div>';}
function loadTs(){api('/api/crew?timesheet='+SEL+'&week='+WEEK).then(function(r){TS=r;$('t_lbl').textContent=T('Week of')+' '+DT(r.week,'long')+' ('+r.totalHours+' '+T('hrs')+')';
 var rows=r.entries.map(function(e){return{d:e.workDate,h:'<tr><td>'+esc(DT(e.workDate))+'</td><td>'+esc(e.jobTitle||'')+(e.note?'<div class="muted">'+esc(e.note)+'</div>':'')+'</td><td>'+esc(e.clockIn||'')+'</td><td>'+esc(e.clockOut||'')+'</td><td class="r">'+e.hours+'</td><td><button class="mini d" data-tdel="'+e.id+'">'+T('Delete')+'</button></td></tr>'}}).concat((r.absences||[]).map(function(a){return{d:a.date,h:'<tr style="background:#fbf3f1"><td>'+esc(DT(a.date))+'</td><td colspan="3"><b>'+T(KIND[a.kind]||'Other time off')+'</b>'+(a.note?'<div class="muted">'+esc(a.note)+'</div>':'')+'</td><td class="r">'+(a.hours||'')+'</td><td><button class="mini d" data-adel="'+a.id+'">'+T('Delete')+'</button></td></tr>'}}));
 rows.sort(function(x,y){return x.d<y.d?-1:x.d>y.d?1:0;});
 $('t_list').innerHTML='<table><thead><tr><th>'+T('Date')+'</th><th>'+T('Job')+'</th><th>'+T('In')+'</th><th>'+T('Out')+'</th><th class="r">'+T('Hours')+'</th><th></th></tr></thead><tbody>'+(rows.map(function(x){return x.h}).join('')||'<tr><td colspan="6" class="muted">'+T('No hours this week.')+'</td></tr>')+'</tbody></table>';}).catch(function(e){if(e)msg(e.message,'bad');});}
function payPane(){if(!active().length)return '<div class="card muted">'+T('Add a worker first.')+'</div>';
 var wn=function(id){var w=D.workers.find(function(x){return x.id===id});return w?w.name:''};
 var mOpts=(D.payMethods||Object.keys(METHOD)).map(function(m){return '<option value="'+m+'">'+T(METHOD[m]||m)+'</option>'}).join('');
 return '<div class="card"><b>'+T('Record a payment')+'</b><p class="muted">'+T('Record what you actually paid. For contractors, this is what the 1099 list adds up.')+'</p><div class="row"><div><label>'+T('Worker')+'</label><select id="p_w">'+workerOpts(SEL)+'</select></div><div><label>'+T('Date')+'</label><input id="p_date" type="date" value="'+today()+'"></div><div><label>'+T('Amount ($)')+'</label><input id="p_amt" inputmode="decimal"></div><div><label>'+T('Job')+'</label><select id="p_job">'+jobOpts('')+'</select></div></div>'+
 '<div class="row"><div style="grid-column:span 2"><label>'+T('Paid by')+HELP(T('How the money reached them: cash, check, a payment app, or the bank. Your accountant likes to see this, especially for cash.'))+'</label><select id="p_m">'+mOpts+'</select></div><div style="grid-column:span 2"><label>'+T('Check number or reference (optional)')+'</label><input id="p_ref" maxlength="40"></div></div><label>'+T('Note (optional)')+'</label><input id="p_note" maxlength="200"><div style="margin-top:10px"><button id="p_add">'+T('Save payment')+'</button></div></div>'+
 '<div class="card scroll"><table><thead><tr><th>'+T('Date')+'</th><th>'+T('Worker')+'</th><th>'+T('Job')+'</th><th class="r">'+T('Amount')+'</th><th></th></tr></thead><tbody>'+(D.payments.map(function(p){return '<tr><td>'+esc(DT(p.paidOn))+'</td><td>'+esc(wn(p.workerId))+'<div class="muted">'+esc([p.method?T(METHOD[p.method]||p.method):'',p.ref,p.note].filter(Boolean).join(' - '))+'</div></td><td>'+esc(p.jobTitle||'')+'</td><td class="r">'+$$(p.amountCents)+'</td><td><button class="mini d" data-pdel="'+p.id+'">'+T('Delete')+'</button></td></tr>'}).join('')||'<tr><td colspan="5" class="muted">'+T('No payments recorded this year.')+'</td></tr>')+'</tbody></table></div>';}
function repPane(){
 var thisYear=year===String(new Date().getFullYear()),wk=wkStart(D.today),mo=D.today.slice(0,7);
 var people=D.workers.filter(function(w){return w.active||w.hours>0||w.paidCents>0});
 var any=people.some(function(w){return w.hours>0||w.paidCents>0});
 var hrs=people.map(function(w){return '<tr><td><b>'+esc(w.name)+'</b><div class="muted">'+(w.kind==='contractor'?T('1099 contractor'):T('Employee'))+'</div></td><td class="r">'+(thisYear?(w.byWeek[wk]||0):'-')+'</td><td class="r">'+(thisYear?(w.byMonth[mo]||0):'-')+'</td><td class="r"><b>'+w.hours+'</b></td><td class="r">'+(w.payCents?$$(w.estimatedCents):'')+'</td><td class="r">'+$$(w.paidCents)+'</td></tr>'}).join('');
 var grid=people.map(function(w){return '<tr><td>'+esc(w.name)+'</td>'+MON.map(function(m,i){var k=year+'-'+String(i+1).padStart(2,'0');return '<td class="r">'+(w.byMonth[k]||'')+'</td>'}).join('')+'</tr>'}).join('');
 var emptyHelp='<div class="note" style="margin:8px 0">'+T('Nothing is here yet because no hours or payments are recorded for')+' '+year+'. '+T('Add hours on the Time sheet tab and payments on the Payments tab, and this fills in by itself.')+'<div style="margin-top:8px"><button class="s mini" data-t="time">'+T('Go to Time sheet')+'</button> <button class="s mini" data-t="pay">'+T('Go to Payments')+'</button></div></div>';
 var contractors=D.workers.filter(function(w){return w.kind==='contractor'&&(w.active||w.paidCents>0)});
 var l1099=D.list1099.reduce(function(m,x){m[x.id]=x;return m;},{});
 var w9rows=contractors.map(function(w){var x=l1099[w.id]||{paidCents:0,crossed:false};
  return '<tr><td><b>'+esc(w.name)+'</b></td><td class="r">'+$$(x.paidCents)+'</td><td>'+(x.crossed?'<b class="bad">'+T('Needs a 1099')+'</b>':'<span class="muted">'+T('Under the amount')+'</span>')+'</td><td>'+(w.w9FileId?'<span class="ok">'+T('W-9 on file')+'</span> <a href="/api/files?id='+w.w9FileId+'" target="_blank">'+T('View')+'</a> ':'<span class="bad">'+T('No W-9')+'</span> ')+'<label class="btn s mini" style="margin:0;cursor:pointer">'+T(w.w9FileId?'Replace':'Upload W-9')+'<input type="file" accept="image/*,application/pdf" data-up="w9" data-wid="'+w.id+'" style="display:none"></label></td></tr>'}).join('');
 var sum=D.absenceSummary||{};
 var att=people.map(function(w){var o=sum[w.id]||{};return '<tr><td><b>'+esc(w.name)+'</b></td><td class="r">'+(o.sick||0)+'</td><td class="r">'+(o.vacation||0)+'</td><td class="r">'+(o.holiday||0)+'</td><td class="r">'+(o.absent||0)+'</td><td class="r">'+(o.late||0)+'</td><td>'+(o.last?esc(DT(o.last)):'')+'</td></tr>'}).join('');
 var wname=function(id){var w=D.workers.find(function(x){return x.id===id});return w?w.name:''};
 var attList=(D.absences||[]).map(function(a){return '<tr><td>'+esc(DT(a.date))+'</td><td>'+esc(wname(a.workerId))+'</td><td>'+T(KIND[a.kind]||'Other time off')+(a.note?'<div class="muted">'+esc(a.note)+'</div>':'')+'</td><td class="r">'+(a.hours||'')+'</td><td><button class="mini d" data-adel="'+a.id+'">'+T('Delete')+'</button></td></tr>'}).join('');
 return '<div class="card scroll"><b>'+T('Hours and pay')+' '+year+'</b>'+(any?'':emptyHelp)+'<table><thead><tr><th>'+T('Worker')+'</th><th class="r">'+T('This week')+'</th><th class="r">'+T('This month')+'</th><th class="r">'+T('This year')+'</th><th class="r">'+T('Worked out from rate')+HELP(T('Hours times the pay rate you entered for the worker. It is an estimate to compare with what you really paid.'))+'</th><th class="r">'+T('Paid')+'</th></tr></thead><tbody>'+(hrs||'<tr><td colspan="6" class="muted">'+T('No workers yet.')+'</td></tr>')+'</tbody></table>'+
 '<details class="g" style="margin-top:10px"><summary>'+T('Hours by month')+'</summary><div class="scroll"><table><thead><tr><th></th>'+MON.map(function(m){return '<th class="r">'+T(m)+'</th>'}).join('')+'</tr></thead><tbody>'+(grid||'')+'</tbody></table></div></details></div>'+
 '<div class="card scroll"><b>'+T('Time off and attendance')+' '+year+'</b><p class="muted">'+T('How many days each person was sick, on vacation, off for a holiday, absent, or late. Record them on the Time sheet tab.')+'</p><table><thead><tr><th>'+T('Worker')+'</th><th class="r">'+T('Sick')+'</th><th class="r">'+T('Vacation')+'</th><th class="r">'+T('Holiday')+'</th><th class="r">'+T('Absent')+'</th><th class="r">'+T('Late')+'</th><th>'+T('Last sick, absent or late')+'</th></tr></thead><tbody>'+(att||'<tr><td colspan="7" class="muted">'+T('No workers yet.')+'</td></tr>')+'</tbody></table>'+
 (attList?'<details class="g" style="margin-top:10px"><summary>'+T('Every day recorded')+'</summary><table><tbody>'+attList+'</tbody></table></details>':'<p class="muted" style="margin-top:8px">'+T('No time off recorded yet.')+'</p>')+'<p style="margin-top:8px"><a class="btn s mini" href="/api/crew?export=attendance&year='+year+'">'+T('Time off (CSV)')+'</a></p></div>'+
 '<div class="card scroll"><b>'+T('1099 contractors and W-9 forms')+' '+year+'</b>'+
 '<details class="g"><summary>'+T('What is this? (plain words)')+'</summary><div class="inner"><p class="muted">'+T('A contractor is someone who works for you but is not your employee, like a painter you pay by the job. Before you pay a contractor, ask for a W-9. It is a one-page IRS form where they give their legal name, address and tax number. Keep it in your records. If you pay a contractor the reporting amount or more in a year, the IRS may want a 1099-NEC form from you by January 31. Your accountant or tax software files it.')+'</p><p class="muted">'+T('PaintersMax keeps a scan or photo of the W-9 and adds up what you paid. We do not store tax numbers. Employees are different: they get a W-2, and payroll taxes are handled by you, a payroll service or your accountant. Confirm everything with your accountant or IRS.gov.')+'</p><p><a href="https://www.irs.gov/pub/irs-pdf/fw9.pdf" target="_blank" rel="noopener">'+T('Get a blank W-9 from IRS.gov')+'</a></p></div></details>'+

function dollars(v){var n=Number(String(v).replace(/[$,]/g,''));return Math.round((n||0)*100);}
function shrink(f){return new Promise(function(res){if(!f.type.startsWith('image/')||f.type==='image/gif'){res(f);return;}var im=new Image();im.onload=function(){var s=Math.min(1,1600/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*s);c.height=Math.round(im.height*s);c.getContext('2d').drawImage(im,0,0,c.width,c.height);c.toBlob(function(b){res(b?new File([b],(f.name||'photo').replace(/\.\w+$/,'')+'.jpg',{type:'image/jpeg'}):f)},'image/jpeg',0.82)};im.onerror=function(){res(f)};im.src=URL.createObjectURL(f)});}
document.addEventListener('change',function(e){var t=e.target;
 if(t.id==='yr'){year=t.value;load();}
 else if(t.id==='t_w'){SEL=+t.value;loadTs();}
 else if(t.dataset&&t.dataset.up&&t.files[0]){msg(T('Uploading...'),'muted');shrink(t.files[0]).then(function(b){var fd=new FormData();fd.append('file',b);fd.append('kind',t.dataset.up);fd.append('workerId',t.dataset.wid||(EDIT&&EDIT.id));return fetch('/api/files',{method:'POST',body:fd})}).then(function(r){return r.json().then(function(j){if(!r.ok)throw new Error(j.error||'Could not upload.');return j;})}).then(function(){msg(T('Saved.'),'ok');return load();}).catch(function(x){msg(x.message,'bad')});}
});
document.addEventListener('click',function(e){var t=e.target,d=t.dataset||{},id=t.id;
 var act=function(p,after){p.then(function(){if(after)after();return load();}).catch(function(x){if(x)msg(x.message,'bad')});};
 if(d.t){tab=d.t;EDIT=null;draw();}
 else if(id==='w_new'){EDIT={};draw();}
 else if(d.edit){EDIT={id:+d.edit};draw();}
 else if(d.ts){SEL=+d.ts;tab='time';draw();}
 else if(id==='w_cancel'){EDIT=null;draw();}
 else if(id==='w_save'){act(api('/api/crew',{action:'saveWorker',id:d.id?+d.id:undefined,name:$('w_name').value,kind:$('w_kind').value,position:$('w_pos').value,payCents:dollars($('w_pay').value),payUnit:$('w_unit').value,startedOn:$('w_start').value,phone:$('w_phone').value,email:$('w_email').value,notes:$('w_notes').value}).then(function(r){msg(T('Saved.'),'ok');if(!d.id){SEL=r.id;}EDIT=d.id?null:{id:r.id};}));}
 else if(id==='w_rm'){if(confirm(T('Remove this worker from the active crew? Their hours and pay records stay.')))act(api('/api/crew',{action:'removeWorker',id:+d.id}),function(){EDIT=null;});}
 else if(d.delfile){if(confirm(T('Delete this file? This cannot be undone.')))act(api('/api/files',{action:'delete',id:+d.delfile}));}
 else if(id==='t_prev'){WEEK=shiftWeek(TS?TS.week:WEEK,-1);loadTs();}
 else if(id==='t_next'){WEEK=shiftWeek(TS?TS.week:WEEK,1);loadTs();}
 else if(id==='t_add'){api('/api/crew',{action:'addTime',workerId:SEL,workDate:$('t_date').value,jobId:$('t_job').value,clockIn:$('t_in').value,clockOut:$('t_out').value,breakMinutes:$('t_brk').value,hours:$('t_hrs').value,note:$('t_note').value}).then(function(){msg(T('Saved.'),'ok');WEEK=$('t_date').value;$('t_in').value=$('t_out').value=$('t_brk').value=$('t_hrs').value=$('t_note').value='';loadTs();load().then(function(){});}).catch(function(x){if(x)msg(x.message,'bad')});}
 else if(d.tdel){if(confirm(T('Delete these hours?')))api('/api/crew',{action:'deleteTime',id:+d.tdel}).then(function(){loadTs();}).catch(function(x){if(x)msg(x.message,'bad')});}
 else if(id==='a_add'){act(api('/api/crew',{action:'addAbsence',workerId:SEL,date:$('a_date').value,kind:$('a_kind').value,hours:$('a_hrs').value,note:$('a_note').value}).then(function(){msg(T('Saved.'),'ok');if(tab==='time')loadTs();}));}
 else if(d.adel){if(confirm(T('Delete this record?')))api('/api/crew',{action:'deleteAbsence',id:+d.adel}).then(function(){if(tab==='time')loadTs();return load();}).catch(function(x){if(x)msg(x.message,'bad')});}
 else if(id==='p_add'){act(api('/api/crew',{action:'addPayment',workerId:+$('p_w').value,paidOn:$('p_date').value,amountCents:dollars($('p_amt').value),jobId:$('p_job').value,method:$('p_m').value,ref:$('p_ref').value,note:$('p_note').value}).then(function(){msg(T('Saved.'),'ok')}));}
 else if(d.pdel){if(confirm(T('Delete this payment?')))act(api('/api/crew',{action:'deletePayment',id:+d.pdel}));}
});
load();
