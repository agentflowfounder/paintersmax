<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Business analysis - PaintersMax</title><script src="/i18n.js" data-app></script>
<style>
*{box-sizing:border-box}
body{font-family:Inter,system-ui,sans-serif;background:#F7F5F1;color:#0F1B2D;margin:0}
header{background:#0F1B2D;color:#fff;padding:14px 16px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px}
header b{font-family:Newsreader,Georgia,serif;font-size:19px;font-weight:500}
header a{color:#E8A33D;font-size:14px;text-decoration:none;margin-left:12px}
main{max-width:980px;margin:0 auto;padding:16px 12px 60px}
h1{font-family:Newsreader,Georgia,serif;font-weight:500;font-size:28px;margin:8px 0}
h3{margin:0 0 8px}
.card{background:#fff;border:1px solid rgba(15,27,45,.1);border-radius:10px;padding:14px;margin:0 0 14px}
.btn{font:inherit;font-weight:700;border:0;border-radius:8px;padding:9px 13px;background:#E8A33D;color:#0F1B2D;text-decoration:none;display:inline-block}
.muted{color:#4A5568;font-size:14px}
.kpi{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:14px}.kpi div{background:#fff;border:1px solid rgba(15,27,45,.1);border-radius:10px;padding:10px}.kpi b{display:block;font-size:24px;font-family:Newsreader,Georgia,serif;font-weight:500}
.bars div.r{display:flex;align-items:center;gap:8px;margin:3px 0;font-size:14px}.bars .l{width:110px;flex:none;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.bars .b{height:12px;border-radius:4px;background:#E8A33D;min-width:2px}.bars .v{flex:none;color:#4A5568}
table{width:100%;border-collapse:collapse}th,td{padding:6px 4px;border-bottom:1px solid #eee;text-align:left;font-size:14px}td.r,th.r{text-align:right}
.lock{background:repeating-linear-gradient(135deg,#fff,#fff 10px,#faf7f0 10px,#faf7f0 20px)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}@media(max-width:700px){.grid2{grid-template-columns:1fr}}
.sample{display:inline-block;background:#fff3d6;color:#8a5a00;border-radius:99px;padding:2px 10px;font-size:12px;font-weight:700}
</style></head><body>
<header><div><b>PaintersMax</b> Business analysis</div><div><a href="/jobs">Jobs</a><a href="/records">Records</a><a href="/crew">Crew</a><a href="/dashboard">Settings and leads</a></div></header>
<main>
<h1>How your business is doing</h1>
<p class="muted">Worked out from your own jobs, costs and hours. Plain math, no guessing. Records for your accountant, not tax advice.</p>
<div id="body" class="muted">Loading...</div>
</main>
<script>
var $=function(i){return document.getElementById(i)};
var T=window.pmT||function(s){return s};
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function $$(c){return '$'+Math.round(c/100).toLocaleString('en-US');}
var REASON={price:'Price',timing:'Timing',no_reply:'No reply',chose_other:'Chose someone else',other:'Other'};
function bars(map,fmt,order){var k=order||Object.keys(map).sort(function(a,b){return map[b]-map[a]});var mx=Math.max.apply(null,k.map(function(x){return map[x]}).concat([1]));
 return k.length?'<div class="bars">'+k.map(function(x){return '<div class="r"><span class="l" title="'+esc(x)+'">'+esc(T(x))+'</span><span class="b" style="width:'+Math.max(2,Math.round(55*map[x]/mx))+'%"></span><span class="v">'+fmt(map[x])+'</span></div>'}).join('')+'</div>':'<p class="muted">'+T('Nothing yet.')+'</p>';}
function kpi(a){var f=a.funnel,t=a.totals;return '<div class="kpi"><div><span class="muted">'+T('Jobs won')+'</span><b>'+f.won+'</b><span class="muted">'+T('of')+' '+f.jobs+' '+T('jobs')+'</span></div><div><span class="muted">'+T('Win rate')+'</span><b>'+(f.winRatePct==null?'-':f.winRatePct+'%')+'</b><span class="muted">'+T('won vs lost')+'</span></div><div><span class="muted">'+T('Sales from won jobs')+'</span><b>'+$$(t.revenueCents)+'</b></div><div><span class="muted">'+T('Recorded expenses')+'</span><b>'+$$(t.expenseCents)+'</b></div>'+(t.miles!=null?'<div><span class="muted">'+T('Miles driven')+'</span><b>'+t.miles+'</b></div>':'')+'</div>';}
function sugg(list){return '<div class="card"><h3>'+T('Data we suggest collecting next')+'</h3><p class="muted" style="margin-top:0">'+T('The more complete your records, the more these reports can tell you.')+'</p>'+list.map(function(s){return '<div style="border-top:1px solid #eee;padding:7px 0"><b>'+esc(T(s.title))+'</b>'+(s.link?' <a href="'+s.link+'">'+T('Start here')+'</a>':'')+'<div class="muted">'+esc(T(s.why))+'</div></div>'}).join('')+'</div>';}
function lockCard(t){return '<div class="card lock"><h3>'+T(t)+'</h3><p class="muted" style="margin:0">'+T('Included in Pro.')+' <a href="/dashboard#billing">'+T('See plans')+'</a></p></div>';}
function teaser(){return '<div class="card lock"><span class="sample">'+T('Sample numbers')+'</span><h3 style="margin-top:8px">'+T('See what your jobs really earn')+'</h3><p>'+T('Basic shows your win rate, sales by month and why you lose jobs. Pro adds profit per job and per service, sales by season and city, crew productivity, mileage and materials use.')+'</p>'+
 '<div class="grid2"><div><b>'+T('Sales by season')+'</b>'+bars({Spring:3200000,Summer:4100000,Fall:2900000,Winter:900000},$$)+'</div><div><b>'+T('Profit by service')+'</b>'+bars({Exterior:2100000,Interior:1700000,Cabinets:600000},$$)+'</div></div><p style="margin-top:12px"><a class="btn" href="/dashboard#billing">'+T('See Basic and Pro plans')+'</a></p></div>';}
function render(a){var h='';
 if(a.level==='teaser'){$('body').innerHTML=teaser();return;}
 h+=kpi(a);
 h+='<div class="grid2"><div class="card"><h3>'+T('Sales by year')+'</h3>'+bars(a.salesByYear,$$,Object.keys(a.salesByYear).sort())+'</div><div class="card"><h3>'+T('Why jobs were lost')+'</h3>'+bars(Object.fromEntries(Object.keys(a.lostReasons).map(function(k){return [REASON[k]||k,a.lostReasons[k]]})),function(v){return v})+'</div></div>';
 var months=Object.keys(a.salesByMonth).sort().slice(-12);h+='<div class="card"><h3>'+T('Sales by month')+'</h3>'+bars(Object.fromEntries(months.map(function(m){return [m,a.salesByMonth[m]]})),$$,months)+'</div>';
 if(a.level==='basic'){h+=lockCard('Profit per job and per service')+lockCard('Sales by season and city')+lockCard('Crew productivity, mileage and materials use');}
 else{
  h+='<div class="grid2"><div class="card"><h3>'+T('Sales by season')+'</h3>'+bars(a.salesBySeason,$$)+'</div><div class="card"><h3>'+T('Sales by city')+'</h3>'+bars(a.salesByCity,$$)+'</div></div>';
  var tr=a.profit.byTrade,ks=Object.keys(tr).sort(function(x,y){return tr[y].profitCents-tr[x].profitCents});
  h+='<div class="card"><h3>'+T('Profit by service')+'</h3><p class="muted" style="margin-top:0">'+T('Sales minus the expenses and crew payments you recorded on each job. Only as complete as your records.')+'</p><table><thead><tr><th>'+T('Service')+'</th><th class="r">'+T('Jobs')+'</th><th class="r">'+T('Sales')+'</th><th class="r">'+T('Costs')+'</th><th class="r">'+T('Profit')+'</th><th class="r">'+T('Margin')+'</th></tr></thead><tbody>'+(ks.map(function(k){var t=tr[k];return '<tr><td>'+esc(k.replace(/_/g,' '))+'</td><td class="r">'+t.jobs+'</td><td class="r">'+$$(t.revenueCents)+'</td><td class="r">'+$$(t.costCents)+'</td><td class="r">'+$$(t.profitCents)+'</td><td class="r">'+(t.marginPct==null?'-':t.marginPct+'%')+'</td></tr>'}).join('')||'<tr><td colspan="6" class="muted">'+T('Nothing yet.')+'</td></tr>')+'</tbody></table></div>';
  var tj=function(l){return l.map(function(x){return '<a href="/jobs?id='+x.id+'">'+T('Job')+' #'+x.id+'</a>: '+$$(x.profitCents)+(x.marginPct==null?'':' ('+x.marginPct+'%)')}).join('<br>')||'<span class="muted">-</span>';};
  h+='<div class="grid2"><div class="card"><h3>'+T('Most profitable jobs')+'</h3>'+tj(a.profit.topJobs)+'</div><div class="card"><h3>'+T('Least profitable jobs')+'</h3>'+tj(a.profit.bottomJobs)+'</div></div>';
  var p=a.productivity,cs=Object.keys(p.byCrewSize).sort();
  h+='<div class="card"><h3>'+T('Crew productivity')+'</h3>'+(p.revenuePerHourCents==null?'<p class="muted">'+T('Record crew hours on your jobs to see sales per labor hour.')+'</p>':'<p>'+T('Sales per labor hour')+': <b>'+$$(p.revenuePerHourCents)+'</b></p>'+bars(Object.fromEntries(cs.map(function(k){return [k+' '+T('workers'),p.byCrewSize[k].revenuePerHourCents]})),function(v){return $$(v)+'/hr'},cs.map(function(k){return k+' '+T('workers')})))+'</div>';
  var t=a.totals;h+='<div class="card"><h3>'+T('Materials and mileage')+'</h3><p>'+T('Materials')+': <b>'+$$(t.materialsCents)+'</b>'+(t.materialsPctOfRevenue==null?'':' ('+t.materialsPctOfRevenue+'% '+T('of sales')+')')+' &middot; '+T('Crew payments on jobs')+': <b>'+$$(t.payCents)+'</b> &middot; '+T('Miles')+': <b>'+t.miles+'</b></p></div>';}
 h+=sugg(a.suggestions);$('body').innerHTML=h;}
fetch('/api/analysis').then(function(r){if(r.status===401){location.href='/login';throw 0;}return r.json();}).then(render).catch(function(e){if(e)$('body').textContent=T('Could not load the report.');});
</script><script src="/nav.js"></script></body></html>
