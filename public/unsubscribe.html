<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Unsubscribe - PaintersMax</title><script src="/i18n.js" data-app></script>
<style>
*{box-sizing:border-box}
body{font-family:Inter,system-ui,sans-serif;background:#F7F5F1;color:#0F1B2D;margin:0}
header{background:#0F1B2D;color:#fff;padding:14px 16px}
header b{font-family:Newsreader,Georgia,serif;font-size:19px;font-weight:500}
main{max-width:560px;margin:0 auto;padding:24px 16px 60px}
h1{font-family:Newsreader,Georgia,serif;font-weight:500;font-size:28px;margin:8px 0}
.card{background:#fff;border:1px solid rgba(15,27,45,.1);border-radius:10px;padding:16px}
button{font:inherit;font-weight:700;border:0;border-radius:8px;padding:11px 16px;background:#E8A33D;color:#0F1B2D;cursor:pointer;margin-top:12px}
button.gray{background:#eceae4}
.muted{color:#4A5568;font-size:14px}.bad{color:#b42318;font-weight:600}
</style></head><body>
<header><b>PaintersMax</b></header>
<main>
<h1>Unsubscribe</h1>
<div class="card" id="box">Loading...</div>
</main>
<script>
const T=window.pmT||(s=>s);
const q=new URLSearchParams(location.search),c=q.get('c'),t=q.get('t');
const box=document.getElementById('box');
const esc=s=>String(s).replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));
function draw(name,out){
  box.innerHTML=out
   ?'<p><b translate="no">'+esc(name)+'</b></p><p>'+esc(T('You are unsubscribed from PaintersMax announcement emails. You will still get emails about your account, such as replies to your messages.'))+'</p><button class="gray" id="undo">'+esc(T('Subscribe again'))+'</button>'
   :'<p><b translate="no">'+esc(name)+'</b></p><p>'+esc(T('Stop PaintersMax announcement emails to this account?'))+'</p><button id="go">'+esc(T('Unsubscribe'))+'</button>';
  const b=document.getElementById(out?'undo':'go');
  b.onclick=async()=>{b.disabled=true;try{const r=await fetch('/api/unsubscribe',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({c,t,undo:out})});const j=await r.json();if(!r.ok)throw new Error(j.error);draw(j.name,j.optedOut);}catch(e){box.innerHTML='<p class="bad">'+esc(T('Something went wrong. Please try again.'))+'</p>';}};
}
fetch('/api/unsubscribe?c='+encodeURIComponent(c||'')+'&t='+encodeURIComponent(t||'')).then(async r=>{const j=await r.json();if(!r.ok)throw 0;draw(j.name,j.optedOut);}).catch(()=>{box.innerHTML='<p class="bad">'+esc(T('This link is not valid. Please use the link in the email.'))+'</p>';});
</script>
</body></html>
