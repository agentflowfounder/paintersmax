<!doctype html>
<html lang="en"><head><link rel="icon" type="image/svg+xml" href="/favicon.svg"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Vendors and prices - PaintersMax</title><link rel="stylesheet" href="/colorcode.css"><script src="/i18n.js" data-app></script>
<style>
*{box-sizing:border-box}
body{font-family:Inter,system-ui,sans-serif;background:#F7F5F1;color:#0F1B2D;margin:0}
header{background:#0F1B2D;color:#fff;padding:14px 16px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px}
header b{font-family:Newsreader,Georgia,serif;font-size:19px;font-weight:500}
main{max-width:980px;margin:0 auto;padding:16px 12px 80px}
h1{font-family:Newsreader,Georgia,serif;font-weight:500;font-size:28px;margin:8px 0}
h3{margin:0 0 8px}
.card{background:#fff;border:1px solid rgba(15,27,45,.1);border-radius:10px;padding:14px;margin:0 0 14px}
.btn{font:inherit;font-weight:700;border:0;border-radius:8px;padding:10px 14px;background:#E8A33D;color:#0F1B2D;cursor:pointer;min-height:44px}
.btn.sec{background:#eceae4}.btn.red{background:#fdecea;color:#b42318}
.muted{color:#4A5568;font-size:14px}
label{display:block;font-weight:600;font-size:14px;margin:10px 0 4px}
input,select,textarea{font:inherit;width:100%;padding:10px;border:1px solid #cfcac0;border-radius:8px;background:#fff}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}@media(max-width:640px){.row{grid-template-columns:1fr}}
.vlist{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.v{background:#fff;border:1px solid rgba(15,27,45,.1);border-radius:12px;padding:14px;cursor:pointer;text-align:left;font:inherit}
.v:hover{box-shadow:0 2px 10px rgba(15,27,45,.08)}
.badge{display:inline-flex;align-items:center;justify-content:center;width:44px;height:44px;border-radius:10px;color:#fff;font-weight:800;font-size:15px;margin-right:10px;flex:none}
.vh{display:flex;align-items:center;margin-bottom:6px}
table{width:100%;border-collapse:collapse}th,td{padding:6px 4px;border-bottom:1px solid #eee;text-align:left;font-size:14px}td.r,th.r{text-align:right}
.tips li{margin:6px 0}
.msg{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:#0F1B2D;color:#fff;padding:10px 16px;border-radius:10px;display:none;z-index:50}
.btns{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
</style></head><body>
<header><div><b>PaintersMax</b> Vendors and prices</div></header>
<main>
<h1>Vendors and price lists</h1>
<p class="muted">Keep your paint store accounts and the prices you negotiated, so your estimates use your real costs. You can also keep a customer's own price list for jobs where they buy the paint on their account.</p>
<div id="body" class="muted">Loading...</div>
</main>
<div class="msg" id="msg"></div>
<script>
var $=function(i){return document.getElementById(i)};
var T=window.pmT||function(s){return s};
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function $$(c){return '$'+(c/100).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});}
function toast(t){var m=$('msg');m.textContent=T(t);m.style.display='block';clearTimeout(m._t);m._t=setTimeout(function(){m.style.display='none'},2600);}
function api(path,body){return fetch(path,body?{method:'POST',headers:{'content-type':'application/json'},credentials:'same-origin',body:JSON.stringify(body)}:{credentials:'same-origin'}).then(function(r){if(r.status===401){location.href='/login';throw 0;}return r.json().then(function(j){if(!r.ok)throw new Error(j.error||'Something went wrong.');return j;});});}
// Text badges, not store logos: logos are trademarks and are not used without permission.
var COL={sherwin_williams:'#1d4f91',home_depot:'#c2410c',lowes:'#1e40af',benjamin_moore:'#334155',ppg:'#0f766e',other:'#5b6572'};
function badge(v){var w=String(v.name||'?').split(/\s+/).filter(Boolean);var t=(w[0]||'?').charAt(0)+(w[1]?w[1].charAt(0):'');return '<span class="badge" style="background:'+(COL[v.kind]||COL.other)+'">'+esc(t.toUpperCase())+'</span>';}
var D=null,CUR=null,SHEET=null;
function load(){api('/api/vendors').then(function(j){D=j;draw();}).catch(function(e){if(e)$('body').textContent=T(e.message);});}
function draw(){if(!D)return;var mine=D.vendors.filter(function(v){return v.owner==='mine'}),cust=D.vendors.filter(function(v){return v.owner==='customer'});
 var card=function(v){return '<button class="v" data-open="'+v.id+'"><div class="vh">'+badge(v)+'<div><b>'+esc(v.name)+'</b><br><span class="muted">'+esc(D.kinds[v.kind]||'')+(v.account_last4?' &middot; acct ...'+esc(v.account_last4):'')+'</span></div></div><span class="muted">'+v.priceCount+' '+T('prices')+(v.latest?' &middot; '+T('sheet dated')+' '+esc(v.latest):'')+(v.discount_pct?' &middot; '+v.discount_pct+'% '+T('off'):'')+'</span>'+(v.customer_name?'<br><span class="cc t-info">'+esc(v.customer_name)+'</span>':'')+'</button>'};
 var h='<div class="btns" style="margin:0 0 14px"><button class="btn" data-new="mine">+ '+T('Add my vendor')+'</button><button class="btn sec" data-new="customer">+ '+T("Add a customer's price list")+'</button></div>';
 h+='<div class="card"><h3>'+T('My vendors')+'</h3>'+(mine.length?'<div class="vlist">'+mine.map(card).join('')+'</div>':'<p class="muted">'+T('No vendors yet. Add the paint store where you have an account, then add prices or upload their price sheet.')+'</p>')+'</div>';
 h+='<div class="card"><h3>'+T("Customers' price lists")+'</h3><p class="muted" style="margin-top:0">'+T('Some builders, property managers and government buyers have their own account with Sherwin-Williams, Benjamin Moore or PPG. When you know their prices, keep them here. I will only ask about this on jobs where it fits.')+'</p>'+(cust.length?'<div class="vlist">'+cust.map(card).join('')+'</div>':'')+
  '<label style="display:flex;gap:8px;align-items:center;font-weight:400"><input type="checkbox" id="optout" style="width:auto" '+(D.prefs.optOut?'checked':'')+'> '+T('Never ask me about customer price lists on estimates')+'</label></div>';
 h+='<div class="card"><h3>'+T('Ways to pay less for materials')+'</h3><ul class="tips">'+D.tips.map(function(t){return '<li>'+esc(T(t))+'</li>'}).join('')+'</ul></div>';
 $('body').innerHTML=h;}
function form(v,owner){v=v||{};var k=Object.keys(D.kinds).map(function(x){return '<option value="'+x+'" '+((v.kind||'other')===x?'selected':'')+'>'+esc(D.kinds[x])+'</option>'}).join('');owner=v.owner||owner||'mine';
 return '<div class="card"><h3>'+(v.id?T('Edit vendor'):owner==='customer'?T("Add a customer's price list"):T('Add my vendor'))+'</h3>'+
 '<div class="row"><div><label>'+T('Store')+'</label><select id="f_kind">'+k+'</select></div><div><label>'+T('Name (store or branch)')+'</label><input id="f_name" value="'+esc(v.name||'')+'" placeholder="Sherwin-Williams, Main St"></div></div>'+
 (owner==='customer'?'<label>'+T('Customer this price list belongs to')+'</label><input id="f_cust" value="'+esc(v.customer_name||'')+'" placeholder="Example: Lone Star Builders">':'')+
 '<div class="row"><div><label>'+T('Account number, last 4 only')+'</label><input id="f_acct" maxlength="4" value="'+esc(v.account_last4||'')+'"></div><div><label>'+T('Discount off list (%)')+'</label><input id="f_disc" inputmode="decimal" value="'+esc(v.discount_pct||'')+'"></div></div>'+
 '<div class="row"><div><label>'+T('Rep name')+'</label><input id="f_rep" value="'+esc(v.rep_name||'')+'"></div><div><label>'+T('Rep phone')+'</label><input id="f_rph" inputmode="tel" value="'+esc(v.rep_phone||'')+'"></div></div>'+
 '<label>'+T('Rep email')+'</label><input id="f_rem" type="email" value="'+esc(v.rep_email||'')+'"><label>'+T('Notes')+'</label><textarea id="f_notes" rows="2">'+esc(v.notes||'')+'</textarea>'+
 '<p class="muted">'+T('Only keep the last 4 of a store account number. Never enter bank, routing or card numbers here.')+'</p>'+
 '<div class="btns"><button class="btn" data-save="'+(v.id||'')+'" data-owner="'+owner+'">'+T('Save')+'</button><button class="btn sec" data-back="1">'+T('Back')+'</button>'+(v.id?'<button class="btn red" data-del="'+v.id+'">'+T('Delete vendor')+'</button>':'')+'</div></div>';}
function openV(id){api('/api/vendors?id='+id).then(function(j){CUR=j;SHEET=null;drawV();});}
function drawV(){var v=CUR.vendor,p=CUR.prices;
 var h='<div class="btns" style="margin:0 0 10px"><button class="btn sec" data-back="1">&larr; '+T('All vendors')+'</button></div><div class="card"><div class="vh">'+badge(v)+'<div><b style="font-size:18px">'+esc(v.name)+'</b><br><span class="muted">'+esc(D.kinds[v.kind]||'')+(v.customer_name?' &middot; '+T('Price list of')+' '+esc(v.customer_name):'')+'</span></div></div>'+
 (v.rep_name||v.rep_phone?'<p class="muted">'+T('Rep')+': '+esc(v.rep_name)+' '+(v.rep_phone?'<a href="tel:'+esc(v.rep_phone)+'">'+esc(v.rep_phone)+'</a>':'')+'</p>':'')+'<div class="btns"><button class="btn sec" data-edit="1">'+T('Edit details')+'</button></div></div>';
 h+='<div class="card"><h3>'+T('Upload a price sheet')+'</h3><p class="muted" style="margin-top:0">'+T('A PDF or a clear photo of the price sheet or quote, or a CSV or Excel file. I turn it into lines you check before saving. The file is not kept.')+'</p><div class="btns"><label class="btn sec" style="margin:0">'+T('Take a photo')+'<input type="file" accept="image/*" capture="environment" data-sheet="1" style="display:none"></label><label class="btn sec" style="margin:0">'+T('Choose a PDF or photo')+'<input type="file" accept="application/pdf,image/*,.csv,.xlsx,.xls,text/csv" data-sheet="1" style="display:none"></label></div><div id="sheet"></div></div>';
 h+='<div class="card"><h3>'+T('Prices')+' <span class="muted">('+p.length+')</span></h3><div class="row" style="grid-template-columns:2fr 1fr 1fr auto;align-items:end"><div><label>'+T('Product')+'</label><input id="p_prod" placeholder="Duration Interior Satin"></div><div><label>'+T('Size')+'</label><input id="p_size" placeholder="gallon"></div><div><label>'+T('Price ($)')+'</label><input id="p_price" inputmode="decimal"></div><button class="btn" data-addp="1">'+T('Add')+'</button></div>'+
 (p.length?'<div style="overflow-x:auto;margin-top:10px"><table><thead><tr><th>'+T('Product')+'</th><th>'+T('Size')+'</th><th class="r">'+T('Price')+'</th><th>'+T('Date')+'</th><th></th></tr></thead><tbody>'+p.map(function(x){return '<tr><td>'+esc(x.product)+(x.sku?'<br><span class="muted">'+esc(x.sku)+'</span>':'')+'</td><td>'+esc(x.size)+'</td><td class="r">'+$$(x.priceCents)+'</td><td>'+esc(x.effectiveOn||'')+'</td><td><button class="btn sec" style="padding:4px 10px;min-height:0" data-delp="'+x.id+'">&times;</button></td></tr>'}).join('')+'</tbody></table></div>':'<p class="muted">'+T('No prices yet.')+'</p>')+'</div>';
 $('body').innerHTML=h;}
function drawSheet(){var s=$('sheet');if(!s||!SHEET)return;
 s.innerHTML='<p><b>'+SHEET.lines.length+' '+T('lines found')+'</b>'+(SHEET.effectiveOn?' &middot; '+T('dated')+' '+esc(SHEET.effectiveOn):'')+'. '+T('Check them, untick anything wrong, then save.')+'</p><div style="overflow-x:auto;max-height:420px"><table><tbody>'+SHEET.lines.map(function(l,i){return '<tr><td><input type="checkbox" data-sl="'+i+'" checked style="width:auto"></td><td>'+esc(l.product)+'</td><td>'+esc(l.size)+'</td><td class="r">'+$$(l.priceCents)+'</td></tr>'}).join('')+'</tbody></table></div>'+
 '<label style="display:flex;gap:8px;align-items:center;font-weight:400"><input type="checkbox" id="s_repl" style="width:auto"> '+T('Replace the prices from my last sheet')+'</label><div class="btns"><button class="btn" data-ssave="1">'+T('Save these prices')+'</button><button class="btn sec" data-scancel="1">'+T('Cancel')+'</button></div>';}
/* CSV and Excel price lists are read right here in the browser. Nothing is uploaded until the painter checks the lines and saves. */
function csvRows(text){var rows=[],row=[],cell='',q=false;for(var i=0;i<text.length;i++){var ch=text[i];
 if(q){if(ch==='"'){if(text[i+1]==='"'){cell+='"';i++;}else q=false;}else cell+=ch;}
 else if(ch==='"')q=true;else if(ch===','||ch==='\t'||ch===';'){row.push(cell);cell='';}
 else if(ch==='\n'||ch==='\r'){if(ch==='\r'&&text[i+1]==='\n')i++;row.push(cell);cell='';if(row.some(function(x){return String(x).trim()}))rows.push(row);row=[];}
 else cell+=ch;}
 row.push(cell);if(row.some(function(x){return String(x).trim()}))rows.push(row);return rows;}
function tableToLines(rows){if(!rows.length)return [];
 var head=rows[0].map(function(x){return String(x==null?'':x).toLowerCase().trim()});
 var find=function(re){for(var i=0;i<head.length;i++)if(re.test(head[i]))return i;return -1;};
 var ip=find(/product|item name|description|^item$|^name$|paint/),is=find(/size|unit|pack|container/),ic=find(/price|cost|amount|net|contractor|pro\b/),ik=find(/sku|item #|item no|part|code|upc/);
 var hasHead=ip>=0&&ic>=0;var body=hasHead?rows.slice(1):rows;
 if(!hasHead){ip=0;ic=rows[0].length>2?2:1;is=rows[0].length>2?1:-1;ik=-1;}
 var out=[];body.slice(0,1000).forEach(function(r){var name=String(r[ip]==null?'':r[ip]).trim();var raw=String(r[ic]==null?'':r[ic]).replace(/[$,\s]/g,'');var price=Number(raw);
  if(!name||!isFinite(price)||price<=0||price>100000)return;
  out.push({product:name.slice(0,120),size:is>=0?String(r[is]==null?'':r[is]).trim().slice(0,40):'',sku:ik>=0?String(r[ik]==null?'':r[ik]).trim().slice(0,40):'',priceCents:Math.round(price*100)});});
 return out;}
function loadXlsx(){return new Promise(function(res,rej){if(window.XLSX)return res();var sc=document.createElement('script');sc.src='https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';sc.onload=res;sc.onerror=function(){rej(new Error('Could not load the Excel reader. Save the sheet as CSV and try again.'));};document.head.appendChild(sc);});}
function readTable(file){var s=$('sheet');if(file.size>4*1024*1024){toast('That file is too large. Use a file under 4 MB.');return;}
 s.innerHTML='<p class="muted">'+T('Reading the file...')+'</p>';
 var done=function(rows){var lines=tableToLines(rows);if(!lines.length){s.innerHTML='<p class="cc t-bad">'+esc(T('I could not find product and price columns. Use one column for the product, one for the size and one for the price, with a header row.'))+'</p>';return;}SHEET={lines:lines,effectiveOn:''};drawSheet();};
 var fail=function(e){s.innerHTML='<p class="cc t-bad">'+esc(T(e&&e.message||'Could not read it.'))+'</p>';};
 var fr=new FileReader();
 if(/\.csv$/i.test(file.name||'')){fr.onload=function(){try{done(csvRows(String(fr.result)));}catch(e){fail(e);}};fr.readAsText(file);}
 else{fr.onload=function(){loadXlsx().then(function(){var wb=XLSX.read(fr.result,{type:'array'});var ws=wb.Sheets[wb.SheetNames[0]];done(XLSX.utils.sheet_to_json(ws,{header:1,raw:true,defval:''}));}).catch(fail);};fr.readAsArrayBuffer(file);}}
function readSheet(file){if(!file)return;if(file.size>4*1024*1024){toast('That file is too large. Use a file under 4 MB.');return;}
 var s=$('sheet');s.innerHTML='<p class="muted">'+T('Reading the price sheet. This can take up to a minute...')+'</p>';
 var fr=new FileReader();fr.onload=function(){var data=String(fr.result).split(',')[1];api('/api/vendors',{action:'readSheet',mime:file.type||'application/pdf',data:data}).then(function(j){SHEET=j;drawSheet();}).catch(function(e){s.innerHTML='<p class="cc t-bad">'+esc(T(e&&e.message||'Could not read it.'))+'</p>';});};fr.readAsDataURL(file);}
document.addEventListener('change',function(e){var t=e.target;
 if(t.id==='optout')api('/api/vendors',{action:'prefs',optOut:t.checked}).then(function(){toast('Saved.')});
 if(t.getAttribute&&t.getAttribute('data-sheet')){var f=t.files&&t.files[0];if(f&&/\.(csv|xlsx|xls)$/i.test(f.name||''))readTable(f);else readSheet(f);}});
document.addEventListener('click',function(e){var t=e.target.closest?e.target.closest('button'):null;if(!t)return;var a=function(k){return t.getAttribute('data-'+k)};
 if(a('open'))return openV(a('open'));
 if(a('new')){$('body').innerHTML=form(null,a('new'));return;}
 if(a('back')){CUR=null;load();return;}
 if(a('edit')){$('body').innerHTML=form(CUR.vendor);return;}
 if(t.hasAttribute('data-save')){var id=a('save');var v={kind:$('f_kind').value,name:$('f_name').value,owner:a('owner'),customerName:$('f_cust')?$('f_cust').value:'',accountLast4:$('f_acct').value,discountPct:$('f_disc').value,repName:$('f_rep').value,repPhone:$('f_rph').value,repEmail:$('f_rem').value,notes:$('f_notes').value};
  api('/api/vendors',{action:'save',id:id?Number(id):undefined,vendor:v}).then(function(j){toast('Saved.');openV(j.id);}).catch(function(x){if(x)toast(x.message)});return;}
 if(a('del')){if(!confirm(T('Delete this vendor and all its prices?')))return;api('/api/vendors',{action:'delete',id:Number(a('del'))}).then(function(){CUR=null;load();});return;}
 if(a('addp')){api('/api/vendors',{action:'addPrice',vendorId:CUR.vendor.id,price:{product:$('p_prod').value,size:$('p_size').value,price:$('p_price').value}}).then(function(){openV(CUR.vendor.id)}).catch(function(x){if(x)toast(x.message)});return;}
 if(a('delp')){api('/api/vendors',{action:'deletePrice',id:Number(a('delp'))}).then(function(){openV(CUR.vendor.id)});return;}
 if(a('scancel')){SHEET=null;$('sheet').innerHTML='';return;}
 if(a('ssave')){var keep=[];document.querySelectorAll('[data-sl]').forEach(function(c){if(c.checked){var l=SHEET.lines[Number(c.getAttribute('data-sl'))];keep.push({product:l.product,size:l.size,sku:l.sku,price:l.priceCents/100,effectiveOn:l.effectiveOn});}});
  api('/api/vendors',{action:'savePrices',vendorId:CUR.vendor.id,lines:keep,replace:$('s_repl').checked}).then(function(j){toast(j.added+' prices saved.');openV(CUR.vendor.id);}).catch(function(x){if(x)toast(x.message)});return;}
});
load();
</script><script src="/nav.js"></script><script src="/logo-apply.js"></script></body></html>
